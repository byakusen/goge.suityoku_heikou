      const ac=new AC(), t0=ac.currentTime;
      [523.25,659.25,783.99].forEach((f,i)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.value=f;
        const s=t0+i*0.10;
        g.gain.setValueAtTime(0.0001,s);
        g.gain.exponentialRampToValueAtTime(0.25,s+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,s+0.35);
        o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+0.4);
      });
      setTimeout(()=>{ try{ ac.close(); }catch(e){} },1200);
    }catch(e){}
  }
  function playOK(){
    if(SE){ try{ SE.pause(); SE.currentTime=0; const p=SE.play(); if(p&&p.catch) p.catch(()=>beepOK()); return; }catch(e){} }
    beepOK();
  }
  function showHana(){
    if(hanaTimer){ clearTimeout(hanaTimer); hanaTimer=null; }
    hana.classList.remove('fade'); hana.classList.add('show');
    hanaTimer=setTimeout(()=>{ hana.classList.remove('show'); hana.classList.add('fade'); hanaTimer=null; },1900);
  }

  // ── こたえあわせ ──
  document.getElementById('btnCheck').addEventListener('click',()=>{
    let ok=0;
    for(let r=0;r<ANS.length;r++){
      for(let c=0;c<5;c++){
        const td=CELL[r][c];
        td.classList.remove('ok','ng','need');
        const on=td.classList.contains('on');
        const want=ANS[r][c]===1;
        if(want&&on){ td.classList.add('ok'); ok++; }
        else if(!want&&!on){ ok++; }
        else if(!want&&on){ td.classList.add('ng'); }
        else { td.classList.add('need'); }
      }
    }
    if(ok===TOTAL){ say('ぜんぶ 正解！ よく できました。','good'); playOK(); showHana(); }
    else{ say('あかい ますが まちがい だよ。なおして もう一回！（正解 '+ok+'こ／'+TOTAL+'こ）','bad'); }
  });

  // ── はじめから ──
  document.getElementById('btnReset').addEventListener('click',()=>{
    document.querySelectorAll('td.cell').forEach(td=>td.classList.remove('on','ok','ng','need'));
    if(hanaTimer){ clearTimeout(hanaTimer); hanaTimer=null; }
    hana.classList.remove('show','fade');
    say('あてはまる ますを タップして ○を つけよう。');
  });

  // ══════════════════ 「図形」ページ ══════════════════
  // 6つの 形の 中から、もんだいに あてはまる ものを ぜんぶ えらんで「決定」。
  // ★ 形の 特ちょう（平行・長さ・角・対角線）は 頂点の 数から その場で 計算して 出す。
  //   ＝ 絵と こたえが ズレる ことが ない。答えを 手で 書いて いないので 直しても 安全。
  (function(){
    const ZP=[
      {n:'四角形',     p:[[15,72],[38,14],[64,28],[82,72]]},
      {n:'長方形',     p:[[12,26],[88,26],[88,74],[12,74]]},
      {n:'台形',       p:[[24,24],[62,24],[88,76],[10,76]]},
      {n:'ひし形',     p:[[50,14],[90,50],[50,86],[10,50]]},
      {n:'平行四辺形', p:[[28,24],[92,24],[72,76],[8,76]]},
      {n:'正方形',     p:[[24,22],[78,22],[78,76],[24,76]]}
    ];
    const V=(a,b)=>[b[0]-a[0], b[1]-a[1]];
    const LEN=v=>Math.hypot(v[0],v[1]);
    const U=(a,b)=>{ const v=V(a,b), d=LEN(v)||1; return [v[0]/d, v[1]/d]; };
    const F=q=>q[0].toFixed(1)+','+q[1].toFixed(1);

    // ── 頂点から 特ちょうを 計算する ──
    function analyze(p){
      const s=[0,1,2,3].map(i=>V(p[i], p[(i+1)%4]));
      const L=s.map(LEN);
      const par=(i,j)=>Math.abs(s[i][0]*s[j][1]-s[i][1]*s[j][0])/(L[i]*L[j])<0.02;
      const near=(a,b)=>Math.abs(a-b)/Math.max(a,b)<0.03;
      const ang=i=>{ const u=s[(i+3)%4], w=s[i];
        const c=(-u[0]*w[0]-u[1]*w[1])/(LEN(u)*LEN(w));
        return Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI; };
      const A=[0,1,2,3].map(ang);
      const d1=V(p[0],p[2]), d2=V(p[1],p[3]);
      const pp=[]; if(par(0,2)) pp.push(0); if(par(1,3)) pp.push(1);
      return { L:L, A:A, parPairs:pp, parCount:pp.length,
        oppSideEq: near(L[0],L[2]) && near(L[1],L[3]),
        allSideEq: near(L[0],L[1]) && near(L[1],L[2]) && near(L[2],L[3]),
        oppAngEq : Math.abs(A[0]-A[2])<1 && Math.abs(A[1]-A[3])<1,
        allRight : A.every(a=>Math.abs(a-90)<1),
        diagPerp : Math.abs(d1[0]*d2[0]+d1[1]*d2[1])/(LEN(d1)*LEN(d2))<0.02,
        diagEq   : near(LEN(d1),LEN(d2)) };
    }
    ZP.forEach(sh=>{ sh.P=analyze(sh.p); });

    const ZQ=[
      {t:'向かい合った 辺が、<b>1組だけ</b> 平行である。',   f:P=>P.parCount===1, hl:'par'},
      {t:'向かい合った 辺が、<b>2組とも</b> 平行である。',   f:P=>P.parCount===2, hl:'par'},
      {t:'向かい合った <b>辺の 長さ</b> が 等しい。',        f:P=>P.oppSideEq,    hl:'oppside'},
      {t:'向かい合った <b>角の 大きさ</b> が 等しい。',      f:P=>P.oppAngEq,     hl:'angle'},
      {t:'<b>4つの 辺の 長さ</b> が みんな 等しい。',        f:P=>P.allSideEq,    hl:'side4'},
      {t:'<b>4つの 角</b> が みんな 直角である。',           f:P=>P.allRight,     hl:'right4'},
      {t:'2本の <b>対角線</b> が 垂直に 交わる。',           f:P=>P.diagPerp,     hl:'diagperp'},
      {t:'2本の <b>対角線の 長さ</b> が 等しい。',           f:P=>P.diagEq,       hl:'diag'}
    ];

    // ── 形を かく（あてはまる ところを 赤／青 で 見せる）──
    const RED='#e23c3c', BLUE='#2f7dd1';
    function seg(a,b,c,w){ return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+
      '" stroke="'+c+'" stroke-width="'+(w||5.5)+'" stroke-linecap="round"/>'; }
    function arcAt(p,k,c){
      const v=p[k], a=p[(k+3)%4], b=p[(k+1)%4];
      const u=U(v,a), w=U(v,b);
      const r=Math.min(17, 0.30*Math.min(LEN(V(v,a)), LEN(V(v,b))));
      const q1=[v[0]+r*u[0], v[1]+r*u[1]], q2=[v[0]+r*w[0], v[1]+r*w[1]];
      const cr=u[0]*w[1]-u[1]*w[0];
      return '<path d="M'+F(q1)+' A'+r.toFixed(1)+','+r.toFixed(1)+' 0 0,'+(cr>0?1:0)+' '+F(q2)+
        '" fill="none" stroke="'+c+'" stroke-width="3.6" stroke-linecap="round"/>';
    }
    function corner(O,u,w,r,c){
      const a=[O[0]+r*u[0],O[1]+r*u[1]], b=[O[0]+r*w[0],O[1]+r*w[1]];
      const m=[O[0]+r*(u[0]+w[0]), O[1]+r*(u[1]+w[1])];
      return '<path d="M'+F(a)+' L'+F(m)+' L'+F(b)+'" fill="none" stroke="'+c+'" stroke-width="3.4" stroke-linejoin="round"/>';
    }
    function rightAt(p,k,c){ const v=p[k]; return corner(v, U(v,p[(k+3)%4]), U(v,p[(k+1)%4]), 12, c); }
    function crossAt(p,c){
      const a=p[0], r=V(p[0],p[2]), q=p[1], t=V(p[1],p[3]);
      const den=r[0]*t[1]-r[1]*t[0]; if(Math.abs(den)<1e-6) return '';
      const k=((q[0]-a[0])*t[1]-(q[1]-a[1])*t[0])/den;
      const O=[a[0]+r[0]*k, a[1]+r[1]*k];
      return corner(O, U(O,p[0]), U(O,p[1]), 10, c);
    }
    function zsvg(sh, hl){
      const p=sh.p, P=sh.P;
      let g='<polygon points="'+p.map(a=>a.join(',')).join(' ')+
        '" fill="#d8e9f6" stroke="#1f2430" stroke-width="3" stroke-linejoin="round"/>';
      const pairSides=k=>[[p[k],p[(k+1)%4]], [p[(k+2)%4],p[(k+3)%4]]];
      if(hl==='par'){
        P.parPairs.forEach((k,i)=>pairSides(k).forEach(sd=>{ g+=seg(sd[0],sd[1], i===0?RED:BLUE); }));
      }else if(hl==='oppside'){
        [0,1].forEach(k=>pairSides(k).forEach(sd=>{ g+=seg(sd[0],sd[1], k===0?RED:BLUE); }));
      }else if(hl==='side4'){
        [0,1,2,3].forEach(k=>{ g+=seg(p[k],p[(k+1)%4],RED); });
      }else if(hl==='angle'){
        [0,1,2,3].forEach(k=>{ g+=arcAt(p,k, k%2===0?RED:BLUE); });
      }else if(hl==='right4'){
        [0,1,2,3].forEach(k=>{ g+=rightAt(p,k,RED); });
      }else if(hl==='diag'||hl==='diagperp'){
        g+=seg(p[0],p[2],RED,4)+seg(p[1],p[3],RED,4);
        if(hl==='diagperp') g+=crossAt(p,RED);
      }
      return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
    }

    // ── 画面 ──
    const grid=document.getElementById('zgrid'), zqEl=document.getElementById('zq');
    const zmsgEl=document.getElementById('zmsg'), hanaZ=document.getElementById('hanaZ');
    hanaZ.src=HANA_B64;
    const HINT='あてはまる 形を タップ しよう。（いくつ えらんでも いいよ）';
    let cur=null, sel=[], done=false, order=[], oi=99, cards=[], hz=null;

    function zsay(t,k){ zmsgEl.textContent=t; zmsgEl.className='msg'+(k?(' '+k):''); }
    // はなまるを 2秒 出す → すっと 消す → 次の もんだいへ（辺と角タブと 同じ ながれ）
    function showHanaZ(after){
      if(hz) clearTimeout(hz);
      hanaZ.classList.remove('fade'); hanaZ.classList.add('show');
      hz=setTimeout(()=>{
        hanaZ.classList.remove('show'); hanaZ.classList.add('fade');
        hz=setTimeout(()=>{ hz=null; if(after) after(); }, 800);
      },2000);
    }
    function marks(){
      cards.forEach((c,j)=>{
        c.classList.remove('ok','ng');
        c.classList.toggle('sel', sel[j]);
        c.querySelector('.mk').textContent = sel[j] ? '✓' : '';
      });
    }
    function render(){
      grid.textContent='';
      cards=ZP.map((sh,i)=>{
        const c=document.createElement('div');
        c.className='zcard';
        c.innerHTML='<div class="zsv">'+zsvg(sh, (done && cur.f(sh.P)) ? cur.hl : null)+
          '</div><div class="nm">'+sh.n+'</div><span class="mk"></span>';
        c.addEventListener('click',()=>{
          if(done) return;
          sel[i]=!sel[i]; marks(); zsay(HINT);
        });
        grid.appendChild(c);
        return c;
      });
      marks();
    }
    function newQ(){
      if(oi>=order.length){
        const last=cur ? ZQ.indexOf(cur) : -1;
        order=ZQ.map((q,i)=>i);
        for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; }
        if(order[0]===last){ const t=order[0]; order[0]=order[order.length-1]; order[order.length-1]=t; }  // 同じ問題が つづかない
        oi=0;
      }
      cur=ZQ[order[oi++]];
      sel=ZP.map(()=>false); done=false;
      zqEl.innerHTML='次の 中から、あてはまる ものを <b>ぜんぶ</b> えらんで「決定」を おしましょう。　<span class="qq">'+cur.t+'</span>';
      if(hz){ clearTimeout(hz); hz=null; }
      hanaZ.classList.remove('show','fade');
      render(); zsay(HINT);
    }
    function check(){
      if(done) return;
      if(!sel.some(x=>x)){ zsay('まだ ひとつも えらんで いないよ。','bad'); return; }
      const want=ZP.map(sh=>cur.f(sh.P));
      let wrong=0, miss=0;
      ZP.forEach((sh,i)=>{ if(sel[i]&&!want[i]) wrong++; if(!sel[i]&&want[i]) miss++; });
      if(wrong===0 && miss===0){
        done=true; render();
        cards.forEach((c,i)=>{ if(want[i]){ c.classList.add('ok'); c.querySelector('.mk').textContent='✓'; } });
        zsay('正解！ 赤い ところを 見て たしかめよう。','good');
        playOK(); showHanaZ(newQ);
      }else{
        cards.forEach((c,i)=>{
          const m=c.querySelector('.mk');
          if(sel[i] && !want[i]){ c.classList.add('ng'); m.textContent='✕'; }
          else if(sel[i]){ c.classList.add('ok'); m.textContent='✓'; }
        });
        zsay(wrong>0 ? '✕の 形は あてはまらないよ。もう一度 見てみよう。'
                     : 'おしい！ あてはまる 形は まだ あるよ。', 'bad');
      }
    }
    document.getElementById('btnZCheck').addEventListener('click', check);
    document.getElementById('btnZNext').addEventListener('click', newQ);
    newQ();
    window.zNewQ=newQ;   // テスト用
    window.zData=()=>({ZP:ZP, ZQ:ZQ, cur:cur, cards:cards, sel:sel, done:done});
  })();

  // ══════════ 「点を移動」ページ（v86） ══════════
  // ジオボード（7×7 の 点）の 上を 四角形の 4つの 頂点が うごく。
  // 「図形」ページの ぎゃく向き ＝ 形を 自分で つくって、名前と 特ちょうを たしかめる ページ。
  //
  // ★ ここだけ analyze() を 使って いない（v86 で 変えた）
  //   analyze() の 許容は ゆるめ（長さ 3%／平行 約1.15°）。ところが 格子の 上では
  //   長さ 5 と √26＝5.099 の ような 組が 30組 あって、ぜんぶ「等しい」に なって しまう。
  //   ここは 頂点が かならず 整数 なので、2乗どうし・外積・内積を「＝0」「＝同じ」で
  //   きっちり くらべる。まちがいが 出ない うえに 式も みじかい。
  //
  // ■ さわる ときの めやす
  //   N …… 点の 数（たてよこ）。7 を 6 や 8 に すれば ジオボードの 目が 変わる。
  //   START … さいしょの 形（平行四辺形）。「はじめの 形」ボタンで ここに もどる。
  //   valid() … 点が かさなる／3点が 一直線／辺どうしが 交わる を ふせいでいる。
  //             ここを 通らない 動かし方は その場で 止まる（へんな 形に ならない）。
  (function(){
    const N=7, G=40, OX=35, VB=OX*2+G*(N-1);      // viewBox 310×310
    const RED='#e23c3c', BLUE='#2f7dd1', INK='#1f2430', GRN='#4a9e5c';
    const px=i=>OX+i*G;
    const START=[[1,1],[0,4],[4,4],[5,1]];        // さいしょは 平行四辺形

    let P=START.map(v=>v.slice()), showDiag=true, drag=-1;

    const figEl=document.getElementById('tfig'),  nameEl=document.getElementById('tname');
    const tqEl =document.getElementById('tq'),    tmsgEl=document.getElementById('tmsg');
    const hanaT=document.getElementById('hanaT'), diagEl=document.getElementById('btnDiag');
    hanaT.src=HANA_B64;

    // ── 整数の まま きっちり しらべる ──
    const sub  =(a,b)=>[b[0]-a[0], b[1]-a[1]];
    const cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
    const dot  =(a,b)=>a[0]*b[0]+a[1]*b[1];
    const q2   =v=>v[0]*v[0]+v[1]*v[1];
    function look(p){
      const s=[0,1,2,3].map(i=>sub(p[i], p[(i+1)%4]));
      const q=s.map(q2);
      const d1=sub(p[0],p[2]), d2=sub(p[1],p[3]);
      const pp=[]; if(cross(s[0],s[2])===0) pp.push(0); if(cross(s[1],s[3])===0) pp.push(1);
      return { s:s, d1:d1, d2:d2, parPairs:pp, parCount:pp.length,
        allSideEq: q[0]===q[1] && q[1]===q[2] && q[2]===q[3],
        allRight : [0,1,2,3].every(i=>dot(s[(i+3)%4], s[i])===0),
        diagEq   : q2(d1)===q2(d2),
        diagPerp : dot(d1,d2)===0 };
    }
    function nameOf(L){
      if(L.parCount===2){                          // 平行四辺形の なかま
        if(L.allRight && L.allSideEq) return '正方形';
        if(L.allSideEq)               return 'ひし形';
        if(L.allRight)                return '長方形';
        return '平行四辺形';
      }
      if(L.parCount===1)              return '台形';
      return null;                                 // 名前の ない ただの 四角形
    }

    // ── 四角形として 成り立つか（整数なので これも きっちり）──
    function segX(a,b,c,d){                        // 線分 a-b と c-d が ぶつかるか
      const o=(p,q,r)=>Math.sign(cross(sub(p,q), sub(p,r)));
      const d1=o(c,d,a), d2=o(c,d,b), d3=o(a,b,c), d4=o(a,b,d);
      if(d1*d2<0 && d3*d4<0) return true;
      const on=(p,q,r)=>cross(sub(p,q),sub(p,r))===0 &&
        Math.min(p[0],q[0])<=r[0] && r[0]<=Math.max(p[0],q[0]) &&
        Math.min(p[1],q[1])<=r[1] && r[1]<=Math.max(p[1],q[1]);
      return on(c,d,a)||on(c,d,b)||on(a,b,c)||on(a,b,d);
    }
    function valid(p){
      for(let i=0;i<4;i++) for(let j=i+1;j<4;j++)
        if(p[i][0]===p[j][0] && p[i][1]===p[j][1]) return false;   // かさなり
      const s=[0,1,2,3].map(i=>sub(p[i], p[(i+1)%4]));
      for(let i=0;i<4;i++) if(cross(s[(i+3)%4], s[i])===0) return false; // 3点 一直線
      if(segX(p[0],p[1],p[2],p[3])) return false;                  // 辺どうしの 交わり
      if(segX(p[1],p[2],p[3],p[0])) return false;
      return true;
    }

    // ── 絵を かく（線は ほそめ。しるしが 見える ように）──
    const N1=x=>Math.round(x*10)/10;
    function line(a,b,c,w){ return '<line x1="'+N1(a[0])+'" y1="'+N1(a[1])+'" x2="'+N1(b[0])+'" y2="'+N1(b[1])+
      '" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>'; }
    function unit(a,b){ const v=sub(a,b), d=Math.hypot(v[0],v[1])||1; return [v[0]/d, v[1]/d]; }
    function tick(a,b,c){                          // 辺の まん中に「同じ 長さ」の しるし
      const m=[(a[0]+b[0])/2,(a[1]+b[1])/2], u=unit(a,b), n=[-u[1],u[0]];
      return line([m[0]-n[0]*6,m[1]-n[1]*6],[m[0]+n[0]*6,m[1]+n[1]*6],c,2.2);
    }
    function rightMark(O,u,w,r,c){                 // 直角の しるし
      const a=[O[0]+r*u[0],O[1]+r*u[1]], b=[O[0]+r*w[0],O[1]+r*w[1]];
      const m=[O[0]+r*(u[0]+w[0]), O[1]+r*(u[1]+w[1])];
      return '<path d="M'+N1(a[0])+','+N1(a[1])+' L'+N1(m[0])+','+N1(m[1])+' L'+N1(b[0])+','+N1(b[1])+
        '" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round"/>';
    }
    function meet(A){                              // 対角線の 交点（線分の 中で 交わる ときだけ）
      const a=A[0], r=sub(A[0],A[2]), q=A[1], t=sub(A[1],A[3]);
      const den=cross(r,t); if(!den) return null;
      const k=cross(sub(a,q), t)/den, h=cross(sub(a,q), r)/den;
      if(k<0||k>1||h<0||h>1) return null;
      return [a[0]+r[0]*k, a[1]+r[1]*k];
    }
    function svgHTML(L){
      const A=P.map(v=>[px(v[0]), px(v[1])]);
      let g='';
      g+='<polygon points="'+A.map(a=>a.join(',')).join(' ')+'" fill="#eaf3fa" stroke="none"/>';
      for(let y=0;y<N;y++) for(let x=0;x<N;x++)   // ジオボードの 点
        g+='<circle cx="'+px(x)+'" cy="'+px(y)+'" r="3.2" fill="#b8c7bb"/>';
      if(showDiag){
        g+=line(A[0],A[2],RED,2)+line(A[1],A[3],BLUE,2);
        if(L.diagPerp){ const O=meet(A);
          if(O) g+=rightMark(O, unit(O,A[0]), unit(O,A[1]), 13, INK); }
      }
      g+='<polygon points="'+A.map(a=>a.join(',')).join(' ')+
        '" fill="none" stroke="'+INK+'" stroke-width="2" stroke-linejoin="round"/>';
      if(L.allSideEq) [0,1,2,3].forEach(i=>{ g+=tick(A[i],A[(i+1)%4],INK); });
      if(L.allRight)  [0,1,2,3].forEach(i=>{
        g+=rightMark(A[i], unit(A[i],A[(i+3)%4]), unit(A[i],A[(i+1)%4]), 13, INK); });
      A.forEach((a,i)=>{                           // うごかせる 頂点
        g+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="'+(drag===i?9.5:8)+'" fill="#fff" stroke="'+
          (drag===i?GRN:INK)+'" stroke-width="2.8"/>';
      });
      return '<svg viewBox="0 0 '+VB+' '+VB+'" preserveAspectRatio="xMidYMid meet" '+
        'xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
    }

    // ── めあて（つくって みよう）──
    const GOALS=['平行四辺形','ひし形','長方形','正方形','台形'];
    let goal=null, gOrder=[], gi=99, cleared=false, ht=null, last=null;
    const FREE='白い ○ を ドラッグ すると 形が 変わるよ。どんな 四角形が できるかな。';

    function tsay(t,k){ tmsgEl.textContent=t; tmsgEl.className='msg'+(k?(' '+k):''); }
    function showHanaT(after){
      if(ht) clearTimeout(ht);
      hanaT.classList.remove('fade'); hanaT.classList.add('show');
      ht=setTimeout(()=>{
        hanaT.classList.remove('show'); hanaT.classList.add('fade');
        ht=setTimeout(()=>{ ht=null; if(after) after(); }, 800);
      },2000);
    }
    function nextGoal(){
      if(gi>=gOrder.length){
        const back=goal;
        gOrder=GOALS.slice();
        for(let i=gOrder.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=gOrder[i]; gOrder[i]=gOrder[j]; gOrder[j]=t; }
        if(gOrder[0]===back){ const t=gOrder[0]; gOrder[0]=gOrder[gOrder.length-1]; gOrder[gOrder.length-1]=t; }
        gi=0;
      }
      goal=gOrder[gi++]; cleared=false;
      if(ht){ clearTimeout(ht); ht=null; }
      hanaT.classList.remove('show','fade');
      update();
    }

    // ── まとめて つくり直す ──
    function ck(i,on){ document.getElementById('ck'+i).classList.toggle('on', !!on); }
    function update(){
      const L=look(P), nm=nameOf(L);
      last={pts:P.map(v=>v.slice()), name:nm, par:L.parCount, sideEq:L.allSideEq,
            right:L.allRight, diagEq:L.diagEq, diagPerp:L.diagPerp};
      figEl.innerHTML=svgHTML(L);
      nameEl.textContent = nm || 'まだ 名前の ない 四角形';
      nameEl.classList.toggle('none', !nm);
      ck(1, L.parCount===2); ck(2, L.allSideEq); ck(3, L.allRight);
      ck(4, L.diagEq);       ck(5, L.diagPerp);

      if(goal){
        tqEl.innerHTML='めあて\u3000<b>'+goal+'</b> を つくって みよう。';
        if(nm===goal){
          cleared=true; drag=-1;
          tsay('正解！ '+goal+'が できたね。','good');
          playOK(); showHanaT(nextGoal);
        }else{
          tsay('いまは 「'+(nm||'名前の ない 四角形')+'」。'+goal+'に なるように 動かそう。');
        }
      }else{
        tqEl.innerHTML=FREE;
        tsay(nm ? ('いまの 形は 「'+nm+'」。右の ✓を 見て たしかめよう。')
                : 'まだ 名前の ある 形には なって いないよ。');
      }
    }

    // ── ドラッグ ──
    // viewBox は 正方形＋meet なので、はみ出しぶんを 手で 引けば 画面→図の 座標が 出せる。
    function toGrid(ev){
      const svg=figEl.querySelector('svg'); if(!svg) return null;
      const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return null;
      const k=Math.min(r.width, r.height)/VB;
      const x=(ev.clientX - (r.left+(r.width -VB*k)/2))/k;
      const y=(ev.clientY - (r.top +(r.height-VB*k)/2))/k;
      return [Math.round((x-OX)/G), Math.round((y-OX)/G)];
    }
    figEl.addEventListener('pointerdown', ev=>{
      if(cleared) return;
      const g=toGrid(ev); if(!g) return;
      const i=P.findIndex(v=>v[0]===g[0] && v[1]===g[1]);
      if(i<0) return;
      drag=i; ev.preventDefault();
      try{ figEl.setPointerCapture(ev.pointerId); }catch(e){}
      update();
    });
    figEl.addEventListener('pointermove', ev=>{
      if(drag<0) return;
      const g=toGrid(ev); if(!g) return;
      if(g[0]<0||g[0]>=N||g[1]<0||g[1]>=N) return;
      if(g[0]===P[drag][0] && g[1]===P[drag][1]) return;
      const T=P.map(v=>v.slice()); T[drag]=g;
      if(!valid(T)) return;                        // だめな 形には しない（その場で 止まる）
      P=T; update();
    });
    function drop(ev){
      if(drag<0) return;
      drag=-1;
      try{ figEl.releasePointerCapture(ev.pointerId); }catch(e){}
      update();
    }
    figEl.addEventListener('pointerup', drop);
    figEl.addEventListener('pointercancel', drop);

    // ── ボタン ──
    diagEl.addEventListener('click',()=>{
      showDiag=!showDiag;
      diagEl.classList.toggle('on', showDiag);
      update();
    });
    document.getElementById('btnTReset').addEventListener('click',()=>{
      if(cleared) return;
      P=START.map(v=>v.slice()); drag=-1; update();
    });
    document.getElementById('btnTGoal').addEventListener('click',()=>{ nextGoal(); });

    update();
    window.tData=()=>Object.assign({goal:goal, showDiag:showDiag}, last);   // テスト用
    window.tSet=p=>{ if(valid(p)){ P=p.map(v=>v.slice()); update(); return true; } return false; };
  })();

  // ── 「表」「図形」「点を移動」の 切りかえ ──
  const subEl=document.querySelector('header .sub');
  const SUB={
    hyo:'形を タップ すると <b>対角線</b> が 見えるよ（ヒント）',
    zu :'あてはまる 形を <b>ぜんぶ</b> えらんで「決定」',
    tai:'白い \u25cb を <b>ドラッグ</b> して 形を 変えよう'
  };
  window.showPane=function(k){
    if(!SUB[k]) k='hyo';
    document.getElementById('paneHyo').classList.toggle('show', k==='hyo');
    document.getElementById('paneZu' ).classList.toggle('show', k==='zu');
    document.getElementById('paneTai').classList.toggle('show', k==='tai');
    document.getElementById('tnHyo').classList.toggle('on', k==='hyo');
    document.getElementById('tnZu' ).classList.toggle('on', k==='zu');
    document.getElementById('tnTai').classList.toggle('on', k==='tai');
    if(subEl) subEl.innerHTML = SUB[k];
  };
<\/script>

</script>

<script type="text/html" id="srcHenKaku">
<!--
  辺と角（小4 算数）／ v7（アプリ v77）
  ------------------------------------------------------------------
  小タブ「平行四辺形」「ひし形」。図を 見て 2問（辺の長さ → 角の大きさ）に 答える。
  こたえは テンキーで 入力（v73で 4たく から 変更）。3けたまで／「けす」は 1文字ずつ／「こたえる」で 判定。
  v74：テンキーを 画面の 右よこに たてに ならべた（電たくと 同じ ならび）。図は そのぶん 少し 細くなる。
  v77：① 角度の 文字が 弧から はなれすぎ／2つが ぶつかる のを 直した。
          ・文字は 弧の すぐ そと（+6px）に おき、よけるのは 4回まで（すきま8px）に した。
          ・おいた 文字の 四角を PLACED に ためて、文字どうしも 11px あけるように した。
          ・弧の 半径を 50→44 に した。
       ② よこに つぶれた 形（よこ÷たて>2.6）を 出さないように した。ひし形の 140°も やめた。
          ※つぶれた 形だと 角の 中に 文字を 書く すきまが なく、まん中まで おし出されて いた。
  v76：①「もう一回」ボタンを 廃止。下の行は メッセージだけ。
       ② 白い わくを 図の 形（700:420）に そろえて、左右の むだな あきを なくした。
          図と テンキーは まとめて まん中よせ（.body の justify-content:center）。
  v75：①「こたえる」ボタンを なくし、けた数が そろったら その場で 判定（答えの けた数は _ で 見せる）。
       ②「ランダム」→「図形をかえる」に して テンキーの 下へ。③ はなまる 2秒 → 消えたら 次の 図に 自動で かわる。
       ④ 辺の 長さの 文字が 線に かぶらないよう、辺に「垂直」な むきへ にがす（putText/boxClear）。
          それでも ぶつかる ときは 4pxずつ 外へ ずらして、すきま10pxが とれる ところに おく。
  ※「作図」タブの 平行四辺形・ひし形とは 別もの。こちらは かき方では なく
    「向かい合った 辺・角は 等しい」「ひし形の 4辺は みんな 等しい」を 使って 答える 問題。
  平行四辺形 … 辺AB(a cm)・辺BC(b cm)・角A・角B を 見せて、辺AD(または DC)と 角C(または D)を きく。
  ひし形     … 辺AB(s cm)・角A・角B を 見せて、辺BC/AD/CD（向かい合った辺 だけに ならないように）と
                角C(または D)を きく。
  音・はなまるは base64 埋めこみ（ネット不要）。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>辺と角</title>
<style>
  :root{ --green:#4a9e5c; --green-d:#3b824a; --green-l:#eaf5ea; --green-ll:#f4faf3;
    --paper:#ffffff; --ink:#2b2b2b; --sub:#5b6b5e; --red:#e23c3c; --blue:#2f7dd1; --ok:#2b9b47; --ask:#e8820e; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{height:100vh; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--green-ll); color:var(--ink); display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent}
  header{flex:0 0 auto; background:var(--green); color:#fff; padding:7px 14px; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap}
  header h1{font-size:clamp(16px,4vw,23px); margin:0}
  /* 小タブ（白）。※「作図」の 小タブは 黄色。色で 見分けられるように している */
  .hnav{display:flex; gap:6px; margin-left:14px}
  .hnb{font-family:inherit; border:3px solid #fff; background:rgba(255,255,255,.18); color:#fff;
    font-size:clamp(12px,3vw,16px); font-weight:800; padding:5px 16px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .hnb.on{background:#fff; color:var(--green-d)}
  header .sub{font-size:clamp(11px,2.6vw,14px); font-weight:700; opacity:.95}

  .pane{flex:1 1 auto; min-height:0; display:none; flex-direction:column}
  .pane.show{display:flex}

  .qtext{flex:0 0 auto; background:var(--green-l); border-bottom:2px solid #cfe3cf; padding:7px 14px;
    font-size:clamp(12px,3vw,16px); font-weight:700; line-height:1.35}
  .qtext b{color:var(--green-d)}
  .qtext .ask{color:var(--red)}

  /* 左＝図 ／ 右＝テンキー。まん中に よせて ならべる */
  .body{flex:1 1 auto; min-height:0; display:flex; gap:14px; padding:6px 10px; justify-content:center}
  /* 白い わくは 図の 形（700:420）に あわせる ＝ 左右に むだな あきが 出ない */
  main{flex:0 1 auto; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; position:relative}
  .stage{height:100%; width:auto; aspect-ratio:700/420; max-width:100%;
    background:var(--paper); border:3px solid var(--green); border-radius:14px; overflow:hidden}
  svg{width:100%; height:100%; display:block}
  .side{flex:0 0 auto; width:clamp(184px,24vw,244px); display:flex; flex-direction:column; justify-content:center; gap:8px}

  footer{flex:0 0 auto; background:var(--green-l); border-top:3px solid var(--green); padding:7px 12px 9px}
  .panel{margin:0 auto; display:flex; flex-direction:column; gap:8px}
  .msg{font-size:clamp(13px,3.4vw,17px); font-weight:800; min-height:1.4em; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .msg.good{color:var(--ok)} .msg.bad{color:var(--red)}
  /* こたえ を 入れる ところ ＋ テンキー */
  .ansbox{height:clamp(44px,9vh,60px); padding:0 12px; display:flex; align-items:center; justify-content:center; gap:3px;
    background:#fff; border:3px solid var(--green); border-radius:12px; color:var(--green-d);
    font-size:clamp(19px,4.4vh,28px); font-weight:800}
  .ansbox .v{letter-spacing:.02em}
  .ansbox .ph{color:#c3d2c4; letter-spacing:.02em}   /* まだ 入れていない けたの しるし */
  .ansbox .u{font-size:.78em; margin-left:2px}
  .ansbox.ng{border-color:var(--red); color:var(--red)}
  .ansbox.ok{border-color:var(--ok); color:var(--ok)}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .key{font-family:inherit; font-size:clamp(16px,3.4vh,23px); font-weight:800; height:clamp(38px,8vh,56px); padding:0;
    border-radius:12px; background:#fff; color:var(--green-d); border:2px solid var(--green); box-shadow:0 4px 0 #cfe3cf; cursor:pointer}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #cfe3cf}
  .key.zero{grid-column:2}                    /* 0は まん中 */
  .key.del{grid-column:3; font-size:clamp(13px,2.3vh,17px); border-color:#b9bdb9; color:#6b706b; box-shadow:0 4px 0 #dcdfdc}
  .pad.lock{opacity:.42; pointer-events:none}
  .sidebtn{width:100%; height:clamp(34px,6.5vh,46px); padding:0}
  .hbtn{font-family:inherit; font-size:clamp(13px,3.4vw,17px); font-weight:800; padding:9px 15px; border-radius:12px;
    border:3px solid var(--ask); background:#fff; color:#b5640a; cursor:pointer; white-space:nowrap}
  .hbtn:active{transform:translateY(2px)}

  .hana{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(150px,42vw,230px);
    pointer-events:none; opacity:0; filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
  .hana.show{opacity:1; transition:opacity .15s}
  .hana.fade{opacity:0; transition:opacity .8s ease}
</style>

    const s=pick([4,5,6,7]);
    const angA=pick([110,120,130]), angB=180-angA;   // 140°は つぶれるので やめた
    // 向かい合った辺(DC)ばかりに ならないよう、となりの辺(BC・AD)を 出やすくする
    return { kind:'R', s:s, angA:angA, angB:angB,
      askS:pick(['BC','AD','CD','BC','AD']), askA:pick(['C','D']) };
  }

  // 頂点：平行四辺形 A(左上) D(右上) C(右下) B(左下) ／ ひし形 A(上) D(右) C(下) B(左)
  function points(q){
    if(q.kind==='P'){
      const th=q.angB*RAD;
      const B=[0,0], C=[q.b,0], A=[q.a*Math.cos(th), -q.a*Math.sin(th)];
      const D=[A[0]+q.b, A[1]];
      return {A:A,B:B,C:C,D:D};
    }else{
      const h=(q.angA/2)*RAD, sx=q.s*Math.sin(h), sy=q.s*Math.cos(h);
      return { A:[0,0], D:[sx,sy], C:[0,2*sy], B:[-sx,sy] };
    }
  }
  const ORDER=['A','D','C','B'];                 // まわる 順番（どちらの 形も 同じ）
  const NEXT={A:['B','D'], D:['A','C'], C:['D','B'], B:['C','A']};   // 各頂点の となり2つ

  function sideKey(x,y){ return [x,y].sort().join(''); }
  function sideOf(q, name){ return [name[0], name[1]]; }

  // 答え・相手
  function answerSide(q){
    if(q.kind==='P') return q.askS==='AD' ? {v:q.b, mate:'BC'} : {v:q.a, mate:'AB'};
    return {v:q.s, mate:'AB'};
  }
  function answerAngle(q){
    return q.askA==='C' ? {v:q.angA, mate:'A'} : {v:q.angB, mate:'B'};
  }

  // ── 1つの もんだいページ ──
  function makeQuiz(o){
    const svg=$(o.svg), msgEl=$(o.msg), qEl=$(o.q), hana=$(o.hana);
    const ansBox=$(o.ans), numEl=$(o.num), phEl=$(o.ph), unitEl=$(o.unit), keysEl=$(o.keys);
    hana.src=HANA_B64;
    let q=null, phase=0, okS=false, okA=false, hTimer=null, tTimer=null;
    let typed='', ng=false, need=1;

    function say(t,k){ msgEl.textContent=t; msgEl.className='msg'+(k?(' '+k):''); }
    // はなまるを 2秒 出す → すっと 消す → 次の もんだいへ
    function showHana(after){
      if(hTimer)clearTimeout(hTimer);
      hana.classList.remove('fade'); hana.classList.add('show');
      hTimer=setTimeout(()=>{
        hana.classList.remove('show'); hana.classList.add('fade'); hTimer=null;
        if(after) tTimer=setTimeout(after, 800);
      },2000);
    }
    function hideHana(){ if(hTimer){clearTimeout(hTimer);hTimer=null;} hana.classList.remove('show','fade'); }

    function draw(){
      while(svg.firstChild) svg.removeChild(svg.firstChild);
      const W=700,H=420;
      const p=fit(points(q), W, H, 92, 74);   // 左右・上下の あき（文字の ぶん）
      const cx=(p.A[0]+p.B[0]+p.C[0]+p.D[0])/4, cy=(p.A[1]+p.B[1]+p.C[1]+p.D[1])/4;
      const askS=q.askS, askA=q.askA;
      const aS=answerSide(q), aA=answerAngle(q);

      // 面
      svg.appendChild(mk('polygon',{ points:ORDER.map(k=>p[k].join(',')).join(' '),
        fill:(q.kind==='P'?'#e7efc3':'#d8e9f6'), stroke:'none' }));

      // 辺（ぜんぶ 黒）
      const sides=[['A','D'],['D','C'],['C','B'],['B','A']];
      sides.forEach(sd=>{ svg.appendChild(mk('line',{x1:p[sd[0]][0],y1:p[sd[0]][1],x2:p[sd[1]][0],y2:p[sd[1]][1],
        stroke:'#1f2430','stroke-width':4,'stroke-linecap':'round'})); });

      function paintSide(name,color,w){
        const u=sideOf(q,name);
        svg.appendChild(mk('line',{x1:p[u[0]][0],y1:p[u[0]][1],x2:p[u[1]][0],y2:p[u[1]][1],
          stroke:color,'stroke-width':(w||8),'stroke-linecap':'round'}));
      }
      // ── 文字が 線に かぶらないように おく しくみ ──
      // 4つの 辺の 上に 点を ばらまいて おき、文字の 四角が その どれにも 近づかない ところまで ずらす
      const EDGEPTS=[];
      [['A','D'],['D','C'],['C','B'],['B','A']].forEach(sd=>{
        const S=p[sd[0]], E=p[sd[1]];
        for(let t=0;t<=1.0001;t+=0.02) EDGEPTS.push([S[0]+(E[0]-S[0])*t, S[1]+(E[1]-S[1])*t]);
      });
      const GAP=14;                                   // 線から あける すきま
      const TGAP=11;                                  // 文字どうしで あける すきま
      const PLACED=[];                                // もう おいた 文字の 四角
      function boxClear(x,y,hw,hh,gap){
        const g=(gap===undefined?GAP:gap);
        for(let i=0;i<EDGEPTS.length;i++){
          const Q=EDGEPTS[i];
          const dx=Math.max(x-hw-Q[0], 0, Q[0]-(x+hw));
          const dy=Math.max(y-hh-Q[1], 0, Q[1]-(y+hh));
          if(dx*dx+dy*dy < g*g) return false;
        }
        for(let i=0;i<PLACED.length;i++){
          const B=PLACED[i];
          const dx=Math.max(B[0]-(x+hw), (x-hw)-B[2], 0);
          const dy=Math.max(B[1]-(y+hh), (y-hh)-B[3], 0);
          if(dx*dx+dy*dy < TGAP*TGAP) return false;
        }
        return true;
      }
      // (ox,oy) から (dx,dy) の むきへ start だけ 出した ところに 文字。ぶつかるなら もっと 出す
      function putText(ox,oy,dx,dy,text,fs,start,color,steps,gap){
        const hw=text.length*fs*0.36, hh=fs*0.52;
        let off=start;
        for(let k=0;k<(steps||12);k++){
          if(boxClear(ox+dx*off, oy+dy*off, hw, hh, gap)) break;
          off+=4;
        }
        const x=ox+dx*off, y=oy+dy*off;
        PLACED.push([x-hw, y-hh, x+hw, y+hh]);
        const t=mk('text',{x:x, y:y+fs*0.35, 'text-anchor':'middle',
          'font-size':fs,'font-weight':800, fill:color});
        t.textContent=text; svg.appendChild(t);
      }
      // 文字の 四角の 大きさぶん、はじめから 出しておく 量
      function outset(dx,dy,text,fs,margin){
        return Math.abs(dx)*(text.length*fs*0.36) + Math.abs(dy)*(fs*0.52) + margin;
      }
      function sideLabel(name,text,color,size){
        const u=sideOf(q,name), A=p[u[0]], B=p[u[1]];
        const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2;
        // ★ 辺に「垂直」な むき（中心から 遠ざかる ほう）に にがす
        let nx=-(B[1]-A[1]), ny=(B[0]-A[0]);
        const d=Math.hypot(nx,ny)||1; nx/=d; ny/=d;
        if((mx-cx)*nx + (my-cy)*ny < 0){ nx=-nx; ny=-ny; }
        const fs=size||27;
        putText(mx,my,nx,ny,text,fs,outset(nx,ny,text,fs,GAP+4),color);
      }
      function angleArc(v,color,w){
        const n=NEXT[v], r=Math.min(44, 0.30*Math.min(len(p[v],p[n[0]]), len(p[v],p[n[1]])));
        svg.appendChild(mk('path',{d:arcPath(p[v],p[n[0]],p[n[1]],r), fill:'none',
          stroke:color,'stroke-width':(w||3.5),'stroke-linecap':'round'}));
        return r;
      }
      // 角度の 文字は 弧の すぐ そと（6px）に おく。あまり 動かさない（4回まで・すきま8px）
      function angleLabel(v,text,color,r,size){
        const n=NEXT[v], b=bisect(p[v],p[n[0]],p[n[1]]);
        const fs=size||26;
        putText(p[v][0],p[v][1],b[0],b[1],text,fs, r+outset(b[0],b[1],text,fs,6), color, 4, 8);
      }

      // わかっている 角（A と B）
      const givenAngleColor = c => c;
      ['A','B'].forEach(v=>{
        const isMate = (phase>=1) && okA===false ? false : (aA.mate===v && okA);
        const col = isMate ? '#2f7dd1' : '#1f2430';
        const r=angleArc(v, col, isMate?6:3.5);
        angleLabel(v, (v==='A'?q.angA:q.angB)+'°', col, r);
      });

      // わかっている 辺
      if(q.kind==='P'){
        const mateShown = okS && aS.mate==='AB';
        sideLabel('AB', q.a+'cm', mateShown?'#2f7dd1':'#1f2430');
        sideLabel('BC', q.b+'cm', (okS && aS.mate==='BC')?'#2f7dd1':'#1f2430');
        if(okS) paintSide(aS.mate, '#2f7dd1', 8);
      }else{
        sideLabel('AB', q.s+'cm', okS?'#2f7dd1':'#1f2430');
        if(okS){ ['AD','DC','CB','BA'].forEach(nm=>paintSide(nm,'#2f7dd1',7)); }
      }

      // きいている 辺
      paintSide(askS, '#e23c3c', 9);
      sideLabel(askS, okS ? (aS.v+'cm') : '?', '#e23c3c', okS?29:34);

      // きいている 角（辺の 問題が おわってから）
      if(phase>=1){
        const r=angleArc(askA, '#e23c3c', 7);
        angleLabel(askA, okA ? (aA.v+'°') : '?', '#e23c3c', r, okA?28:32);
      }

      // 頂点の 名前
      ORDER.forEach(v=>{
        const n=NEXT[v], b=bisect(p[v],p[n[0]],p[n[1]]);
        putText(p[v][0],p[v][1],-b[0],-b[1],v,30,outset(b[0],b[1],v,30,GAP+6),'#1f2430');
      });
    }

    // ── テンキー（けた数が そろったら その場で 判定。「こたえる」ボタンは なし）──
    function showTyped(){
      numEl.textContent = typed;
      phEl.textContent  = '_'.repeat(Math.max(0, need - typed.length));
    }
    function clearAns(){ typed=''; ng=false; ansBox.className='ansbox'; showTyped(); }
    function lockPad(on){ keysEl.classList.toggle('lock', !!on); }
    function buildPad(){
      // 1 2 3 ／ 4 5 6 ／ 7 8 9 ／ （あき）0 けす
      keysEl.textContent='';
      function add(label, cls, arg){
        const b=document.createElement('button');
        b.className='key'+(cls?(' '+cls):''); b.textContent=label;
        b.addEventListener('click',()=>press(arg));
        keysEl.appendChild(b);
      }
      '123456789'.split('').forEach(d=>add(d,'',d));
      add('0','zero','0');
      add('けす','del','del');
    }
    function press(x){
      if(keysEl.classList.contains('lock')) return;
      if(x==='del'){
        if(ng){ typed=''; ng=false; ansBox.className='ansbox'; }  // まちがえた あとは ぜんぶ 消す
        else typed=typed.slice(0,-1);
        showTyped(); return;
      }
      if(ng){ typed=''; ng=false; ansBox.className='ansbox'; }     // まちがえた あとは 入れなおし
      if(typed.length>=need) return;
      if(typed==='' && x==='0') return;                            // 0から 始めない
      typed+=x; showTyped();
      if(typed.length===need){                                     // けたが そろった → 判定
        const v=parseInt(typed,10);
        if(phase===0) checkSide(v); else if(phase===1) checkAngle(v);
      }
    }
    function wrong(t){ ng=true; ansBox.className='ansbox ng'; say(t,'bad'); }

    function checkSide(v){
      const aS=answerSide(q);
      if(v!==aS.v){
        wrong(q.kind==='P' ? 'ちがうよ。向かい合った 辺を 見てみよう。' : 'ちがうよ。ひし形の 辺は ぜんぶ 同じ 長さ だよ。');
        return;
      }
      ansBox.className='ansbox ok'; lockPad(true); okS=true; draw();
      say(q.kind==='P'
        ? '正解！ 辺'+q.askS+' は 向かい合った 辺'+aS.mate+' と 同じ 長さ だね。'
        : '正解！ ひし形の 4つの 辺は みんな 同じ 長さ。だから '+aS.v+'cm。', 'good');
      tTimer=setTimeout(askAngleQ, 1900);
    }

    function checkAngle(v){
      const aA=answerAngle(q);
      if(v!==aA.v){ wrong('ちがうよ。向かい合った 角を 見てみよう。'); return; }
      ansBox.className='ansbox ok'; lockPad(true); okA=true; phase=2; draw();
      say('正解！ 角'+q.askA+' は 向かい合った 角'+aA.mate+' と 同じ 大きさ だね。','good');
      playOK();
      showHana(()=>{ start(true); });      // はなまるが 消えたら 次の 図へ
    }

    function askSideQ(){
      phase=0; okS=false; okA=false;
      qEl.textContent='① 辺'+q.askS+' の 長さは 何cm ですか。';
      unitEl.textContent='cm'; need=String(answerSide(q).v).length; clearAns(); lockPad(false);
      say('');
      draw();
    }

    function askAngleQ(){
      phase=1;
      qEl.textContent='② 角'+q.askA+' の 大きさは 何度 ですか。';
      unitEl.textContent='°'; need=String(answerAngle(q).v).length; clearAns(); lockPad(false);
      say('');
      draw();
    }

    function start(newQ){
      if(tTimer){ clearTimeout(tTimer); tTimer=null; }
      hideHana();
      if(newQ || !q) q = (o.kind==='P') ? genPara() : genRhom();
      askSideQ();
    }
    $(o.rand).addEventListener('click',()=>{ start(true); });
    buildPad();
    KEYPRESS[o.kind]=press;      // パソコンの キーボードからも 入れられるように
    start(true);
  }

  const KEYPRESS={};
  makeQuiz({kind:'P', svg:'svgP', msg:'msgP', q:'qP', hana:'hanaP', rand:'randP',
            ans:'ansP', num:'numP', ph:'phP', unit:'unitP', keys:'keysP'});
  makeQuiz({kind:'R', svg:'svgR', msg:'msgR', q:'qR', hana:'hanaR', rand:'randR',
            ans:'ansR', num:'numR', ph:'phR', unit:'unitR', keys:'keysR'});

  // パソコンの 数字キー／BackSpace／Enter でも 入れられる（今 見えている ほうへ）
  document.addEventListener('keydown', e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const f = KEYPRESS[$('paneP').classList.contains('show') ? 'P' : 'R'];
    if(!f) return;
    if(e.key>='0' && e.key<='9'){ f(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ f('del'); e.preventDefault(); }
  });

  // 小タブ（平行四辺形／ひし形）
  document.querySelectorAll('.hnb').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.hnb').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      $('paneP').classList.toggle('show', b.dataset.k==='P');
      $('paneR').classList.toggle('show', b.dataset.k==='R');
    });
  });
})();
<\/script>
</script>
<script type="text/html" id="srcRenshu">
<!--
  練習問題（小4 算数）／ v1（アプリ v64 で 新設）
  ------------------------------------------------------------------
  △2 … 長方形から 直角三角形（ABE）を BE で 切りとり、うら返さずに 辺ABを 辺DCに 合わせる。
        下の 選択肢を えらぶ → はさみで 切る→三角を 右へ すべらせて くっつける アニメ→正誤。
        こたえ … 平行四辺形（むかい合う 辺が 等しく 平行に なるから）。
  △4 … 3点A・B・Cを 頂点に する 平行四辺形の 4つ目の点を さがす。
        グリッドを タップ → 正しい点なら そこに点＋平行四辺形を 色つきで 描く。
        4つ目の点は 3か所（A・B・Cの どれかが 対角に なる）。1つ できるたび「あと○こ」を へらす。
        3つ そろったら はなまる＋正解音。まちがいは ✗を 出して やりなおし。
  音・はなまる … 特ちょうタブと 同じく base64 埋めこみ（ネット不要）。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>練習問題</title>
<style>
  :root{ --green:#4a9e5c; --green-d:#3b824a; --green-l:#eaf5ea; --green-ll:#f4faf3;
    --paper:#ffffff; --line:#1f2430; --red:#e23c3c; --blue:#2f7dd1; --ok:#2b9b47; --ink:#2b2b2b; --sub:#5b6b5e; --ask:#e8820e;
    --paperY:#fdf3cf; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{height:100vh; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--green-ll); color:var(--ink); display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent}
  header{flex:0 0 auto; background:var(--green); color:#fff; padding:7px 14px; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap}
  header h1{font-size:clamp(16px,4vw,23px); margin:0}
  .pnav{display:flex; gap:8px; margin:0 auto}      /* 真ん中に よせる */
  .pbtn{border:3px solid #fff; background:rgba(255,255,255,.18); color:#fff; font-size:clamp(12px,3vw,16px); font-weight:800; padding:6px 14px; border-radius:11px; cursor:pointer; font-family:inherit; white-space:nowrap}
  .pbtn.active{background:#fff; color:var(--green-d)}

  .prob{flex:1 1 auto; min-height:0; display:none; flex-direction:column}
  .prob.show{display:flex}

  .qtext{flex:0 0 auto; background:var(--green-l); border-bottom:2px solid #cfe3cf; padding:7px 14px;
    font-size:clamp(12px,3vw,16px); font-weight:700; line-height:1.35; color:var(--ink)}
  .qtext b{color:var(--green-d)}

  main{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 10px; position:relative}
  .stage{width:100%; max-width:900px; height:100%; background:var(--paper); border:3px solid var(--green); border-radius:14px; overflow:hidden}
  svg{width:100%; height:100%; touch-action:manipulation}

  footer{flex:0 0 auto; background:var(--green-l); border-top:3px solid var(--green); padding:9px 12px 11px}
  .panel{max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:8px}
  .msg{font-size:clamp(13px,3.4vw,17px); font-weight:800; color:var(--ink); min-height:1.4em}
  .msg.good{color:var(--ok)} .msg.bad{color:var(--red)}
  .row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
  .choices{display:flex; gap:9px; flex-wrap:wrap}
  .choice{font-family:inherit; font-size:clamp(15px,3.9vw,20px); font-weight:800; padding:10px 18px; border-radius:12px; cursor:pointer;
    background:#fff; color:var(--green-d); border:2px solid var(--green); box-shadow:0 4px 0 #cfe3cf}
  .choice:active{transform:translateY(3px); box-shadow:0 1px 0 #cfe3cf}
  .choice.cok{background:var(--ok); color:#fff; border-color:var(--ok); box-shadow:0 4px 0 #1f7a37}
  .choice.cng{background:var(--red); color:#fff; border-color:var(--red); box-shadow:0 4px 0 #a82727}
  .choices.lock .choice{cursor:default}
  .again{margin-left:auto; font-family:inherit; font-size:clamp(14px,3.6vw,18px); font-weight:800; padding:9px 16px; border-radius:12px;
    border:3px solid var(--green); background:#fff; color:var(--green-d); cursor:pointer}

  #hana{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(150px,42vw,230px); pointer-events:none; opacity:0; filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}

  /* △4 */
  #hana4{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(150px,42vw,230px); pointer-events:none; opacity:0; filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
  #hana4.show{opacity:1; transition:opacity .15s}
  #hana4.fade{opacity:0; transition:opacity .8s ease}
  .row .msg{flex:1 1 auto}
  #msg4{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}   /* 1行で 固定（下に ずれない） */
  .p4row{flex-wrap:nowrap; justify-content:flex-end}                    /* ボタンは 1行のまま 右よせ */
  .count{font-size:clamp(14px,3.6vw,18px); font-weight:800; color:var(--green-d); background:#fff; border:2px solid var(--green); border-radius:11px; padding:6px 14px; white-space:nowrap}
  .count b{font-size:1.25em; color:var(--red); margin:0 2px}
  .p4btn{font-family:inherit; font-size:clamp(13px,3.4vw,17px); font-weight:800; padding:9px 15px; border-radius:12px; border:3px solid var(--green); background:#fff; color:var(--green-d); cursor:pointer}
  .p4btn:active{transform:translateY(2px)}
  .p4btn.b-show{border-color:#2f7dd1; color:#1f5fa8}
  .p4btn.b-rand{border-color:#e8820e; color:#b5640a}

<header>

  const SE=(function(){ try{ const a=new Audio(SE_B64); a.preload='auto'; return a; }catch(e){ return null; } })();
  function beepOK(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      const ac=new AC(), t0=ac.currentTime;
      [523.25,659.25,783.99].forEach((f,i)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.value=f;
        const s=t0+i*0.10;

        g.gain.exponentialRampToValueAtTime(0.25,s+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,s+0.35);
        o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+0.4);

    }catch(e){}
  }

  const CORRECT='para';

  function runAnim(done){
    const sci=$('sci'), bA=$('bladeA'), bB=$('bladeB'), tri=$('tri'), labels=$('labels'), result=$('result'), resName=$('resName');
    const B=[180,400], E=[320,120], DX=500;
    const angDeg=Math.atan2(E[1]-B[1], E[0]-B[0])*180/Math.PI;   // BE の 向き（刃を 進む向きに）
    sci.setAttribute('opacity','1');
    // ① はさみで BE を 切る（B→E）。進みながら 刃を パチパチ 開閉（折り紙タブと同じ）
    animate(1350,(p)=>{
      const x=B[0]+(E[0]-B[0])*p, y=B[1]+(E[1]-B[1])*p;
      sci.setAttribute('transform','translate('+x+','+y+') rotate('+angDeg+')');
      const snapDeg=(1 - (p % 0.2)/0.2) * 0.2 * 180/Math.PI;      // 0.2rad→0 の のこぎり波 ×5＝チョキチョキ
      bA.setAttribute('transform','rotate('+snapDeg+')');
      bB.setAttribute('transform','rotate('+(-snapDeg)+')');
    },()=>{
      sci.setAttribute('opacity','0');
      // ② 三角を 右へ すべらせる（AB→DC）／ラベルは うすく ※ゆっくりめ
      animate(2000,(p)=>{

        const same=(p,q)=>p[0]===q[0]&&p[1]===q[1];
        if(same(a,b)||same(a,c)||same(b,c)) continue;
        const d2=(p,q)=>(p[0]-q[0])*(p[0]-q[0])+(p[1]-q[1])*(p[1]-q[1]);
        if(d2(a,b)<4||d2(a,c)<4||d2(b,c)<4) continue;   // 点どうしが 近すぎない
        const cross=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
        if(Math.abs(cross)<8) continue;           // つぶれた（細い）形を さける
        const ds=[[b[0]+c[0]-a[0],b[1]+c[1]-a[1]],
                  [a[0]+c[0]-b[0],a[1]+c[1]-b[1]],
                  [a[0]+b[0]-c[0],a[1]+b[1]-c[1]]];
        if(ds.every(p=>p[0]>=0&&p[0]<=NC&&p[1]>=0&&p[1]<=NR)) return [a,b,c];
      }
      return [[5,1],[2,4],[6,4]];
    }
    const NS='http://www.w3.org/2000/svg';
    const svg=$('stage4'), gGrid=$('grid4'), gPar=$('paras4'), gDots=$('dots4'), gPts=$('pts4'), gFx=$('fx4');
    const msg4=$('msg4'), count4=$('count4'), hana4=$('hana4');
    hana4.src=HANA_B64;
    let found={}, done4=0, hTimer=null;
    let locked=false, gen=0, holdTimer=null;
    const SIDE_MS=420;   // 1辺を ひく 時間
    const HOLD_MS=2000;  // ひき終わってから 消すまで（2秒）

    function mk(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

    // グリッド（1回だけ 描く）
    for(let c=0;c<=NC;c++){ const a=px(c,0), b=px(c,NR);
      gGrid.appendChild(mk('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#bfe0ef','stroke-width':1.5})); }
    for(let r=0;r<=NR;r++){ const a=px(0,r), b=px(NC,r);
      gGrid.appendChild(mk('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#bfe0ef','stroke-width':1.5})); }

    function dot(c,r,color,label,layer){
      const g=layer||gPts, p=px(c,r);
      g.appendChild(mk('circle',{cx:p[0],cy:p[1],r:8,fill:color}));
      if(label){ const right=(c>=NC-1);
        const t=mk('text',{x:p[0]+(right?-15:13), y:p[1]-13, 'font-size':26,'font-weight':800, fill:color, 'text-anchor':(right?'end':'start')});
        t.textContent=label; g.appendChild(t); }
    }
    function placeABC(){ dot(A[0],A[1],'#1f2430','A'); dot(B[0],B[1],'#1f2430','B'); dot(C[0],C[1],'#1f2430','C'); }
    placeABC();

    function updateCount(){ count4.innerHTML='あと <b>'+(3-done4)+'</b>こ'; }
    function say(t,kind){ msg4.textContent=t; msg4.className='msg'+(kind?(' '+kind):''); }

    // 4つ目の点（D）は 別レイヤー（gDots）に 置く。辺は 1本ずつ ひいて、2秒後に 辺だけ 消す。
    function dotD(t){ dot(t.d[0],t.d[1],t.color,'D',gDots); }

    function drawParaSeq(t, myGen, onErased){
      const P=t.poly.map(p=>px(p[0],p[1]));
      const sides=[[P[0],P[1]],[P[1],P[2]],[P[2],P[3]],[P[3],P[0]]];
      const g=mk('g',{}); gPar.appendChild(g);
      let i=0;
      (function next(){
        if(myGen!==gen) return;                 // リセットされたら 中止
        if(i>=4){                               // 4辺 ひき終わり → 2秒 まって 消す
          holdTimer=setTimeout(()=>{
            holdTimer=null; if(myGen!==gen) return;
            g.style.transition='opacity .4s ease'; g.style.opacity='0';
            setTimeout(()=>{ try{ if(g.parentNode) g.parentNode.removeChild(g); }catch(e){}
              if(myGen!==gen) return; if(onErased) onErased(); }, 430);
          }, HOLD_MS);
          return;
        }
        const s=sides[i][0], e=sides[i][1];
        const ln=mk('line',{x1:s[0],y1:s[1],x2:s[0],y2:s[1],stroke:t.color,'stroke-width':4,'stroke-linecap':'round'});
        g.appendChild(ln);
        animate(SIDE_MS,(p)=>{
          ln.setAttribute('x2', s[0]+(e[0]-s[0])*p);
          ln.setAttribute('y2', s[1]+(e[1]-s[1])*p);
        },()=>{ i++; next(); });
      })();
    }
    function flashX(c,r){
      const p=px(c,r), g=mk('g',{});
      g.appendChild(mk('line',{x1:p[0]-12,y1:p[1]-12,x2:p[0]+12,y2:p[1]+12,stroke:'#e23c3c','stroke-width':5,'stroke-linecap':'round'}));
      g.appendChild(mk('line',{x1:p[0]-12,y1:p[1]+12,x2:p[0]+12,y2:p[1]-12,stroke:'#e23c3c','stroke-width':5,'stroke-linecap':'round'}));
      gFx.appendChild(g); setTimeout(()=>{ try{gFx.removeChild(g);}catch(e){} },700);
    }
    function showHana4(){ if(hTimer)clearTimeout(hTimer); hana4.classList.remove('fade'); hana4.classList.add('show');
      hTimer=setTimeout(()=>{ hana4.classList.remove('show'); hana4.classList.add('fade'); hTimer=null; },2200); }
    function hideHana4(){ if(hTimer){clearTimeout(hTimer);hTimer=null;} hana4.classList.remove('show','fade'); }

    const eq=(p,c,r)=>p[0]===c&&p[1]===r;

    function onTap(e){
      if(done4>=3 || locked) return;            // 線を ひいている間は うけつけない
      const pt=svg.createSVGPoint(), s=(e.touches&&e.touches[0])||e;
      pt.x=s.clientX; pt.y=s.clientY;
      const m=svg.getScreenCTM(); if(!m) return;
      const q=pt.matrixTransform(m.inverse());
      const c=Math.round((q.x-OX)/G), r=Math.round((q.y-OY)/G);
      if(c<0||c>NC||r<0||r>NR) return;
      if(eq(A,c,r)||eq(B,c,r)||eq(C,c,r)){ say('そこは もう 頂点だよ。ちがう ところを さがそう。','bad'); return; }
      const hit=targets.find(t=>eq(t.d,c,r));
      if(hit && !found[hit.key]){
        if(revealed){ setReveal(false); gPar.textContent=''; }   // 表示中なら 通常モードへ
        found[hit.key]=true; done4++;
        locked=true; const myGen=gen;
        dotD(hit); updateCount(); playOK();
        say('正解！ 1辺ずつ 線を ひくよ…','good');
        drawParaSeq(hit, myGen, ()=>{           // 辺を 消し終えてから 次へ
          if(myGen!==gen) return;
          locked=false;
          if(done4>=3){ say('ぜんぶ できた！ 平行四辺形は 3つ かけるね。','good'); showHana4(); }
          else{ say('いいね！ あと '+(3-done4)+'つ さがそう。','good'); }
        });
      } else if(hit && found[hit.key]){
        say('そこは もう できているよ。');
      } else {
        flashX(c,r); say('うーん、そこでは 平行四辺形に ならないよ。もう一度！','bad');
      }
    }
    svg.addEventListener('click', onTap);

    const btnShow=$('btnShow4');
    let revealed=false;                            // いま 平行四辺形を 出しているか
    function setReveal(on){ revealed=on; btnShow.textContent = on ? '非表示' : '表示'; }

    function clearBoard(m){
      gen++;                                     // 進行中の アニメ・タイマーを 無効に
      if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
      locked=false; found={}; done4=0; setReveal(false);
      gPar.textContent=''; gDots.textContent=''; gFx.textContent=''; gPts.textContent='';
      placeABC(); hideHana4(); updateCount();
      say(m||'あと 1つの 点を さがして タップしてね。');
    }
    function reset4(){ clearBoard(); }

    // 「表示」：できている 平行四辺形を 全部 静止で 出す（辺・面・Dの点）
    function showAll(){
      gen++; if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } locked=false;
      gPar.textContent=''; gDots.textContent=''; let n=0;
      targets.forEach(t=>{ if(found[t.key]){ n++;
        const pts=t.poly.map(p=>px(p[0],p[1]).join(',')).join(' ');
        gPar.appendChild(mk('polygon',{points:pts, fill:t.color,'fill-opacity':0.16, stroke:t.color,'stroke-width':4,'stroke-linejoin':'round'}));
        dotD(t);
      }});
      if(n>0){ setReveal(true); say('できている 平行四辺形（'+n+'つ）を ぜんぶ 出したよ。','good'); }
      else say('まだ できていないよ。点を タップして つくってね。');
    }
    // 「非表示」：平行四辺形の 線・面だけ 消す。点（A・B・C と D）は のこす＝「表示」前の状態。
    function hideAll(){
      gen++; if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } locked=false;
      gPar.textContent=''; gFx.textContent='';
      setReveal(false);
      say('平行四辺形を かくしたよ。');
    }
    function toggleShow(){ revealed ? hideAll() : showAll(); }

    // 「ランダム」：A・B・C を おきなおして 新しい もんだいに する
    function randomProblem(){
      const p=pickPoints(); A=p[0]; B=p[1]; C=p[2]; buildTargets();
      clearBoard('ランダムに 点を おいたよ。平行四辺形を つくろう！');
    }
    $('btnAgain4').addEventListener('click', reset4);
    $('btnShow4').addEventListener('click', toggleShow);
    $('btnRandom4').addEventListener('click', randomProblem);
    updateCount();
  })();
<\/script>

</script>

<script>
(function(){
  function load(srcId, frameId){ var raw = document.getElementById(srcId).textContent.replace(/<\\\/script>/g, '<\/script>'); document.getElementById(frameId).srcdoc = raw; }
  load('srcSagasu','fSagasu'); load('srcKakudo','fKakudo'); load('srcSui','fSui'); load('srcHei','fHei'); load('srcPg','fPg'); load('srcHishi','fHishi'); load('srcHenKaku','fHenKaku'); load('srcTokucho','fTokucho'); load('srcRenshu','fRenshu');
  var ids=['fSagasu','fKakudo','fSui','fHei','fPg','fHishi','fHenKaku','fTokucho','fRenshu'];
  var SAKUZU={fSui:1,fHei:1,fPg:1,fHishi:1};   // 「作図」の 中の 4つ
  var sakuzuCur='fSui';                        // 「作図」で さいごに 見ていた ページ
  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
  function show(id){
    if(!id || ids.indexOf(id)<0) return;
    if(SAKUZU[id]) sakuzuCur=id;
    ids.forEach(function(x){ document.getElementById(x).classList.toggle('show', x===id); });
    tabs.forEach(function(t){
      var on = SAKUZU[id] ? (t.dataset.g==='sakuzu') : (t.dataset.f===id);
      t.classList.toggle('active', !!on);
    });
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){
    show(t.dataset.g==='sakuzu' ? sakuzuCur : t.dataset.f);
  }); });
  // 「作図」の 中の 小さいタブ（各ページの header）から とどく メッセージ
  window.addEventListener('message', function(ev){
    var d=ev.data; if(!d || d.type!=='sub') return; show(d.id);
  });
})();
</script>
