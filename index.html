HP={junbi:P_junbi, compass:P_compass, ruler:P_ruler, heikou:P_heikou};
}
function HPnow(){ return HP[method] || HP.junbi; }
function handOn(m){ m=m||method; return m==='junbi'||m==='compass'||m==='ruler'||m==='heikou'; }   // ★v38：4モードぜんぶ
const curPh =()=>HPnow()[hand.phase];
const curAct=()=>{ const a=curPh().acts; return hand.ai<a.length? a[hand.ai] : null; };

/* ★v41：枠は 文字の 長さに 合わせて のびる（左右に OK_PAD ずつ あける）。
   せまくて せせこましく 見えたため。中心は x=440 のまま。 */
const OK_PAD=48, OK_MINW=240, OK_CX=440;
function badge(msg,ms){ const b=$('okBadge'), t=$('okText'); t.textContent=msg||'';
  if(msg){ const r=$('okRect');
    let w=OK_MINW;
    try{ w=Math.max(OK_MINW, t.getBBox().width+OK_PAD*2); }catch(e){}
    r.setAttribute('x', OK_CX-w/2); r.setAttribute('width', w); }
  b.style.transition='opacity .3s ease'; b.style.opacity=msg?1:0;
  if(msg&&ms) setTimeout(()=>{ if(!hand||!hand.done) b.style.opacity=0; }, ms); }

function handUI(){
  if(!hand) return; const ph=curPh(), a=curAct(), N=HPnow().length-1;
  $('stepNo').textContent = hand.done?'✓':hand.phase;
  $('progress').textContent = hand.done?'':`${hand.phase} / ${N}`;
  $('stepText').innerHTML = hand.done ? (method==='junbi'?'じゅんび かんりょう！ よく できました。'
                                                        :'平行四辺形ABCD の できあがり！ よく できました。')
                          : (a? a.say : ph.say);
  const btn=$('btnDo');
  const ready=!a && !!ph.label;                 // やること 全部すんで、ボタンが ある
  btn.style.display = ready?'':'none';
  btn.innerHTML = ph.label||'';
  btn.disabled = !ready;
}
function handHint(open){ const b=$('hintBox'); if(!hand) return; const a=curAct();
  b.innerHTML = hand.done ? 'できたね！「はじめから」で もう一かい できるよ。'
              : a ? a.hint : (curPh().hint||'ボタンを おそう。');
  b.classList.toggle('show',open); }

/* いまの ようすを 画面に 出す */
function handPlace(){
  const ph=curPh(), a=curAct();
  if(ph.ruler){ dojo.setAttribute('transform',`matrix(${ph.ruler.u.x} ${ph.ruler.u.y} ${ph.ruler.away.x} ${ph.ruler.away.y} ${ph.ruler.at.x} ${ph.ruler.at.y})`);
                dojo.style.opacity=1; dojo.style.visibility='visible'; }
  if(!a) return;
  if(a.kind==='prot'){ placeProt(hand.pos,0); prot.style.opacity=0.82; }
  else if(a.kind==='open'){ hand.t=openingForRadius(hand.pos.r);
      setPose(STAGE,hand.t,STAGE_DIR-pencilAngleAt(hand.t),SCALE); }
  else if(a.kind==='move'){ setPose(hand.pos,hand.t,(a.mid-SPAN)-pencilAngleAt(hand.t),SCALE); }
  else if(a.kind==='slide'){ setPgDraw(0,-hand.pos.d); }
  else if(a.kind==='place'){ setPgDraw(hand.pos.lx, hand.pos.ly); }
  else if(a.kind==='place2'){ buildGuide(hand.fm.dist, hand.gpos.gx, hand.gpos.gy); }
}
/* ★v40：吸着＝正しい位置まで すべりこませる（パッと とばない ように） */
async function glideHome(a){
  const two=(a.kind==='place2'), s=two? {...hand.gpos} : {...hand.pos};
  const far=two? Math.hypot(s.gx,s.gy) : Math.hypot(s.lx,s.ly);
  const dur=Math.max(220, Math.min(520, far*1.1));   // ★v41：遠くから 来たら ゆっくり
  hand.busy=true;                       // すべりこみ中は つかめない
  await animate(1,0,dur, k=>{
    if(two) hand.gpos={gx:s.gx*k, gy:s.gy*k}; else hand.pos={lx:s.lx*k, ly:s.ly*k};
    handPlace();
  }, ease);
  if(two) hand.gpos={gx:0,gy:0}; else hand.pos={lx:0,ly:0};
  handPlace(); hand.busy=false;
}
/* ★v38：フレームの ローカルy（＝②に そった 向き）。①は ローカル(0,-d) に 置いてある。
   点T は ローカルy=-dist に あるので、d=dist で ぴったり。
   ローカルy=0 の 線＝基準の 辺 そのもの。だから place の あては (0,0)。 */
function lyOfPt(fm,p){ return (p.x-fm.R0.x)*fm.mx + (p.y-fm.R0.y)*fm.my; }
function lxOfPt(fm,p){ return (p.x-fm.R0.x)*fm.ux + (p.y-fm.R0.y)*fm.uy; }
/* その act の さいしょの ようす */
/* その act の さいしょの ようす。★v33：hand.pos を 決めてから かならず handPlace() する。
   （v31は handGo が pos=null のまま handPlace() を 呼んでいて、コンパスの 1つ目で エラーに なっていた） */
function actInit(){
  const a=curAct();
  stageLbl(null);
  if(a){
    if(a.kind==='prot'){ prot.classList.add('grab'); hand.pos={x:a.start.x,y:a.start.y}; }
    else if(a.kind==='open'){ compass.classList.add('grab'); stageRuler(true); hand.pos={r:val(a.r0)}; }
    else if(a.kind==='move'){ compass.classList.add('grab'); stageRuler(false); hand.pos={x:STAGE.x,y:STAGE.y}; }
    else if(a.kind==='place'){ pgDraw.classList.add('grab');
      hand.fm=setupParallel(val(a.ref1),val(a.ref2),val(a.T));
      show(pgGuide,false);                       // ②は ①が 辺に つくまで 出さない
      hand.pos={lx:PG_START.lx, ly:PG_START.ly}; }
    else if(a.kind==='place2'){ pgGuide.classList.add('grab');   // ★v40：②は 子どもが あてる
      hand.gpos={gx:PG_G_START.gx, gy:PG_G_START.gy}; show(pgGuide,true); }
    else if(a.kind==='slide'){ pgDraw.classList.add('grab');
      if(a.ref1) hand.fm=setupParallel(val(a.ref1),val(a.ref2),val(a.T));   // place の あとは そのまま つかう
      show(pgGuide,true); hand.pos={d:0}; }
  }
  handPlace();                 // やること が ない 回（定規だけ）でも 呼ぶ
}
function handGo(n){
  hand.phase=n; hand.ai=0;
  dojo.style.visibility='hidden'; prot.style.visibility='hidden';
  compass.style.visibility='hidden'; handDot.style.opacity=0;
  rulerFrame.style.visibility='hidden'; rulerFrame.style.opacity=1;   // ★v38
  prot.classList.remove('grab'); compass.classList.remove('grab');
  pgDraw.classList.remove('grab'); pgGuide.classList.remove('grab');
  actInit(); handUI(); handHint(false);
  /* ★v35：やること も ボタン も ない フェーズ（定規を あてて ひくだけ）は、
     そのまま つづける。これが ないと 止まってしまう。 */
  const ph=curPh();
  if(!ph.acts.length && !ph.label) runAct();
}
async function actDone(){
  hand.ai++; badge('いい ちょうし！',1300);
  if(curAct()){ actInit(); handUI(); handHint(false); return; }
  handUI(); handHint(false);
  if(!curPh().label) await runAct();            // ボタンが ない フェーズは そのまま すすむ
}
async function runAct(){
  const ph=curPh(); hand.busy=true; $('btnDo').disabled=true; badge('',0);
  await ph.act();
  hand.busy=false;
  if(hand.phase>=HPnow().length-1){ hand.done=true; handUI(); handHint(false);
    badge('正解！できあがり！',0); }
  else handGo(hand.phase+1);
}
function handStart(){
  render(0); badge('',0); handDot.style.opacity=0; stageLbl(null);
  hand={phase:1, ai:0, pos:null, t:T_REST, busy:false, done:false};
  handGo(1);
}
function setUIMode(m){
  uiMode=m; stopPlay(); $('hintBox').classList.remove('show'); badge('',0);
  $('demoControls').style.display = (m==='demo')?'flex':'none';
  $('handControls').style.display = (m==='hand')?'flex':'none';
  if(m==='demo'){ hand=null; stageLbl(null);
    dojo.classList.remove('grab'); prot.classList.remove('grab'); compass.classList.remove('grab');
    pgDraw.classList.remove('grab'); pgGuide.classList.remove('grab'); show(pgGuide,true);
    render(0); }
  else handStart();
}
$('btnHand').onclick=()=>setUIMode('hand');
$('btnDemo').onclick=()=>setUIMode('demo');
$('btnHReset').onclick=()=>handStart();
$('btnHint').onclick=()=>{ const b=$('hintBox'); handHint(!b.classList.contains('show')); };

/* ---------------- ドラッグ／クリック ---------------- */
function toBoardXY(e){ const p=board.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  const q=p.matrixTransform(board.getScreenCTM().inverse()); return {x:q.x,y:q.y}; }
let hdrag=null;
function handDown(e){
  if(uiMode!=='hand' || !hand || hand.busy || hand.done) return;
  const a=curAct(); if(!a) return;
  const p=toBoardXY(e);
  if(a.kind==='dot'){                 // 点は 道具の 外に つける → 盤面ぜんたいで 受ける
    e.preventDefault(); const at=val(a.at);
    if(Math.hypot(p.x-at.x, p.y-at.y)<HAND_DOT) putDot(at);
    else badge('もうすこし ちかくを クリック！',1300);
    return;
  }
  const grabbed = (a.kind==='prot')? onTool(e)
                : (a.kind==='slide'||a.kind==='place')? onPgDraw(e)
                : (a.kind==='place2')? onPgGuide(e) : onCompass(e);
  if(!grabbed) return;
  e.preventDefault();
  hdrag = (a.kind==='open')? {dx:p.x-(STAGE.x+hand.pos.r)}
        : (a.kind==='slide')? {ly0:lyOfPt(hand.fm,p), d0:hand.pos.d}
        : (a.kind==='place')? {lx0:lxOfPt(hand.fm,p), ly0:lyOfPt(hand.fm,p), plx:hand.pos.lx, ply:hand.pos.ly}
        : (a.kind==='place2')? {lx0:lxOfPt(hand.fm,p), ly0:lyOfPt(hand.fm,p), plx:hand.gpos.gx, ply:hand.gpos.gy}
        : {dx:p.x-hand.pos.x, dy:p.y-hand.pos.y};
  try{ board.setPointerCapture(e.pointerId); }catch(err){}
}
function handMove(e){
  if(!hdrag||!hand) return; const a=curAct(); if(!a) return;
  const p=toBoardXY(e);
  if(a.kind==='open'){ const lo=radiusAt(0), hi=radiusAt(T_MAX);
      hand.pos={r:Math.max(lo,Math.min(hi, p.x-hdrag.dx-STAGE.x))}; }
  else if(a.kind==='slide'){ const d=hdrag.d0-(lyOfPt(hand.fm,p)-hdrag.ly0);   // ★v38：②にそって だけ
      hand.pos={d:Math.max(0, Math.min(hand.fm.dist+40, d))}; }
  else if(a.kind==='place'){ hand.pos={lx:hdrag.plx+(lxOfPt(hand.fm,p)-hdrag.lx0),   // ★v39：自由に うごく
                                       ly:hdrag.ply+(lyOfPt(hand.fm,p)-hdrag.ly0)}; }
  else if(a.kind==='place2'){ hand.gpos={gx:hdrag.plx+(lxOfPt(hand.fm,p)-hdrag.lx0),  // ★v40：②も 自由に うごく
                                         gy:hdrag.ply+(lyOfPt(hand.fm,p)-hdrag.ly0)}; }
  else hand.pos={x:p.x-hdrag.dx, y:p.y-hdrag.dy};
  handPlace();
}
async function handUp(){
  if(!hdrag||!hand) return; hdrag=null; const a=curAct(); if(!a) return;
  let ok=false, glide=false;
  if(a.kind==='open'){ if(Math.abs(hand.pos.r-a.targR)<HAND_OPEN){ hand.pos={r:a.targR}; ok=true; } }
  else if(a.kind==='slide'){ if(Math.abs(hand.pos.d-hand.fm.dist)<PG_SNAP_Y){ hand.pos={d:hand.fm.dist}; ok=true; } }
  /* ★v41：①＝ly が「へんに 接したか」／②＝gx が「①に 接したか」。
     辺に そった 向き（① lx ／② gy）は 接触に かんけいないので 大きく ゆるす。 */
  else if(a.kind==='place'){ if(Math.abs(hand.pos.ly)<PG_SNAP_FIT && Math.abs(hand.pos.lx)<PG_SNAP_ALONG){ ok=true; glide=true; } }
  else if(a.kind==='place2'){ if(Math.abs(hand.gpos.gx)<PG_SNAP_FIT && touchLen()>=PG_TOUCH){ ok=true; glide=true; } }
  else { const t=val(a.targ); if(Math.hypot(hand.pos.x-t.x, hand.pos.y-t.y)<HAND_SNAP){ hand.pos={x:t.x,y:t.y}; ok=true; } }
  handPlace();
  if(!ok){ handHint(false); return; }
  if(glide) await glideHome(a);
  if(a.kind==='open') stageLbl({cm:a.cm, R:a.targR});   // ぴったり ひらけたら 「4cm」と 出す
  actDone();
}
async function putDot(at){
  handDot.setAttribute('cx',at.x); handDot.setAttribute('cy',at.y);
  handDot.style.transition='opacity .25s ease'; handDot.style.opacity=1;
  badge('点が ついた！',1300);
  await actDone();
}
board.addEventListener('pointerdown', handDown);
board.addEventListener('pointermove', handMove);
board.addEventListener('pointerup', handUp);
board.addEventListener('pointercancel', handUp);
$('btnDo').onclick=()=>{ if(!$('btnDo').disabled && hand && !hand.busy) runAct(); };

/* 分度器は もう置いてあるので、線をひくところだけ（お手本の drawProtRay から 置く動きを ぬいたもの） */
async function drawRayOnly(){
  setLine(ray70,V.B,RAYEND); show(ray70,true);   // ★v46：dim70 は しるしの あと
  const len=Math.hypot(RAYEND.x-V.B.x,RAYEND.y-V.B.y);
  ray70.style.strokeDasharray=len+' '+len; ray70.style.strokeDashoffset=len;
  await animate(len,0,800,v=>{ray70.style.strokeDashoffset=v;},ease); ray70.style.strokeDasharray='';
  angMark.setAttribute('d', arcPath(V.B,36,0,-ANG)); show(angMark,true);
  await animate(0,1,420,()=>{},ease);
  showEl('dim70',true);                    // ★v46：線→しるし→角度 の順（角度が先に出ていた）
  await animate(0,1,350,()=>{},ease); await fadeHide(prot,300,0.82);
}

setShape(SHAPES.find(s=>s.ang===70 && s.bc===4 && s.ab===3) || SHAPES[0]);   // ★v44：はじめは もとの 70°/4cm/3cm
baseSetup();
setMethod('junbi');
<\/script>

<script type="text/html" id="srcHishi">
<!--
  ひし形のかき方（小4 算数）／ v1（アプリ v51 で 新設）
  ■ 考えかた
   ・点Aと 点B（2つの てん）が はじめから ある。この 2点は ひし形の 「たいかくせん」の 両はし。
   ・コンパスを ものさしに あてて へんの 長さ r cm に ひらき、点A・点B から 大きく こ（弧）を かく。
   ・2つの こ が 交わる ところが 点C・点D。A→C→B→D→A を むすぶと 4つの へんが みんな r cm ＝ ひし形。
  ■ 作り
   ・コンパスの エンジン（P / geom / setPose / pencilTip / openingForRadius …）は「平行四辺形」タブから そのまま 移植。
   ・ものさし（dojo）も 同じ。外の URL に たよる 画像は ひとつも つかって いない。
   ・SHAPES は 直書きせず、道具の 上限と 画面に 入るかで しぼって いる（10通り）。🎲で かわる。
   ・RCM=55（平行四辺形タブは 85）。ひし形は こ が 大きく ふくらむので、cm を 小さめに しないと 画面に 入らない。
     ものさしの めもりも コンパスも RCM から 作って いるので、そろって いる。
-->

  add('rect',{x:x0-16,y:0,width:len+32,height:44,rx:7,fill:'#FBEAC6',stroke:'#D7B36A','stroke-width':2,opacity:0.97});
  add('line',{x1:x0-16,y1:0,x2:x0+len+16,y2:0,stroke:'#B8923F','stroke-width':2.5});   // めもりの 辺（上）
  for(let i=0;i<=6;i++){ const X=x0+i*RCM;
    add('line',{x1:X,y1:0,x2:X,y2:17,stroke:'#5d4d28','stroke-width':2});
    const t=add('text',{x:X,y:34,'font-size':15,'font-weight':700,fill:'#5d4d28','text-anchor':'middle'}); t.textContent=i;
    if(i<6) for(let j=1;j<10;j++){ const xm=X+j*RCM/10; add('line',{x1:xm,y1:0,x2:xm,y2:(j===5?11:7),stroke:'#9a854f','stroke-width':1}); }
  }
}
const RULER_GAP=7;
function placeRuler(p1,u,away){ const ox=p1.x+away.x*RULER_GAP, oy=p1.y+away.y*RULER_GAP;
  dojo.setAttribute('transform',`matrix(${u.x} ${u.y} ${away.x} ${away.y} ${ox} ${oy})`); dojo.style.visibility='visible'; }
function awayPerp(atP,u){ let pr={x:-u.y,y:u.x}; if((atP.x-Gc.x)*pr.x+(atP.y-Gc.y)*pr.y<0)pr={x:u.y,y:-u.x}; return pr; }
function awaySide(p1,p2){ const u={x:p2.x-p1.x,y:p2.y-p1.y}; const L=Math.hypot(u.x,u.y); u.x/=L; u.y/=L;
  const M={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2}; let pr={x:-u.y,y:u.x};
  if((M.x-Gc.x)*pr.x+(M.y-Gc.y)*pr.y<0) pr={x:u.y,y:-u.x}; return {u,pr}; }
function belowPerp(u){ let pr={x:-u.y,y:u.x}; if(pr.y<0) pr={x:u.y,y:-u.x}; return pr; }
async function fadeHide(el,dur,from){ from=(from==null?1:from);
  await animate(from,0,dur||300, v=>{ el.style.opacity=v; }, ease);
  el.style.visibility='hidden'; el.style.opacity=from; }
function setLine(el,p1,p2){ el.setAttribute('x1',p1.x); el.setAttribute('y1',p1.y); el.setAttribute('x2',p2.x); el.setAttribute('y2',p2.y); }
function show(el,on){ el.classList.toggle('hidden',!on); }
async function drawSideAnim(el,p1,p2,dur){ setLine(el,p1,p2); show(el,true);
  const len=Math.hypot(p2.x-p1.x,p2.y-p1.y); el.style.strokeDasharray=len+' '+len; el.style.strokeDashoffset=len;
  await animate(len,0,dur||900, v=>{ el.style.strokeDashoffset=v; }, ease);
  el.style.strokeDasharray=''; el.style.strokeDashoffset=''; }
async function drawSideWithRuler(el,p1,p2,dur){ const dx=p2.x-p1.x,dy=p2.y-p1.y,L=Math.hypot(dx,dy),u={x:dx/L,y:dy/L},pr=belowPerp(u);
  placeRuler(p1,u,pr); await animate(0,1,420,()=>{},easeOut);
  await drawSideAnim(el,p1,p2,dur||750); await animate(0,1,200,()=>{},ease); await fadeHide(dojo,260); }

/* ============ コンパスの 動き ============ */
/* まわる 向きを 近いほうに そろえる（162°→-162° を -324°まわり に しない） */
function near(from,target){ let t=target; while(t-from>180)t-=360; while(t-from<-180)t+=360; return t; }
// ものさしを 置いて、コンパスを 半径Rまで 開いて はかる。開き具合tを かえす
async function measureRadius(stage,Rp,txt){
  const a0=STAGE_DIR, u={x:Math.cos(a0*RAD),y:Math.sin(a0*RAD)}, pp=awayPerp(stage,u);
  placeRuler(stage,u,pp);
  const tT=openingForRadius(Rp);
  setPose(stage,T_REST, a0-pencilAngleAt(T_REST), SCALE);
  await animate(0,1,450,()=>{},easeOut);
  await animate(T_REST,tT,1150, t=>{ setPose(stage,t,a0-pencilAngleAt(t),SCALE); }, ease);
  const ml=$('measLbl');
  ml.setAttribute('x',stage.x+Rp*0.5*u.x+pp.x*24); ml.setAttribute('y',stage.y+Rp*0.5*u.y+pp.y*24+8);
  ml.textContent=txt; ml.style.opacity=1;
  await animate(0,1,650,()=>{},easeOut);
  ml.style.opacity=0; await fadeHide(dojo,300);
  return tT;
}
// 開いた まま fromPt→toPt へ 運ぶ（向きも dirFrom→dirTo へ）
async function moveCompass(fromPt,toPt,t,dirFrom,dirTo){
  const dT=near(dirFrom,dirTo);
  await animate(0,1,900, k=>{ const x=fromPt.x+(toPt.x-fromPt.x)*k, y=fromPt.y+(toPt.y-fromPt.y)*k, d=dirFrom+(dT-dirFrom)*k;
    setPose({x,y}, t, d-pencilAngleAt(t), SCALE); }, ease);
  return dT;
}
// cen を 中心に、開き t で 半径Rp の こ を かく。mid＝まん中の 向き、sp＝半分の 開き
async function drawArcOpen(cen,Rp,t,mid,sp,arcEl,hideAfter){
  const a0=mid-sp, a1=mid+sp, th0=a0-pencilAngleAt(t);
  setPose(cen,t,th0,SCALE); await animate(0,1,260,()=>{},ease);
  await animate(0,a1-a0,1500, sw=>{ setPose(cen,t,th0+sw,SCALE); arcEl.setAttribute('d',arcPath(cen,Rp,a0,a0+Math.max(0.001,sw))); }, ease);
  if(hideAfter!==false) compass.style.visibility='hidden';
  return a1;
}

/* ============ 点（頂点） ============ */
function vtxOn(id,on){ const d=$('dot'+id), l=$('lbl'+id); if(d)d.style.opacity=on?1:0; if(l)l.style.opacity=on?1:0; }
function buildVtx(){
  const g=$('vtx'); g.innerHTML='';
  const mk=(p,label,dx,dy,id)=>{
    const c=document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',5.5); c.setAttribute('fill','var(--red)');
    c.setAttribute('id','dot'+id); c.setAttribute('class','fade'); g.appendChild(c);
    const t=document.createElementNS(SVGNS,'text');
    t.setAttribute('x',p.x+dx); t.setAttribute('y',p.y+dy); t.setAttribute('id','lbl'+id); t.setAttribute('class','fade');
    t.textContent=label; g.appendChild(t);
  };
  mk(V.A,'A',0,-14,'A'); mk(V.B,'B',0,32,'B'); mk(V.C,'C',20,10,'C'); mk(V.D,'D',-20,10,'D');
}

/* ============ 説明文（全角29字いない！ 2行を こえると 図が 縮む） ============ */
let TXT={};
function buildTXT(){
  const r=SH.r;
  TXT={
    0:`点Aと 点Bから ${r}cmの こを かいて、ひし形を つくろう。`,
    1:`ものさしで コンパスを ${r}cmに ひらき、点Aから こを かく。`,
    2:`ひらきは そのまま。点Bからも ${r}cmの こを かく。`,
    3:`2つの こが 交わった ところが、点Cと 点D。`,
    4:`A→C→B→D→A を むすぶ。4つの へんが ${r}cm＝ひし形！`
  };
}
function nstep(){ return 4; }

/* ============ 見本（右上） ============ */
function buildRefFig(){
  const g=$('refInner'); if(!g) return; g.innerHTML='';
  const add=(tag,at,txt)=>{ const e=document.createElementNS(SVGNS,tag);
    for(const k in at) e.setAttribute(k,at[k]); if(txt!=null) e.innerHTML=txt; g.appendChild(e); return e; };
  const BOX={x:596,y:40,w:266,h:192};                 // 枠（SVGの rect と 同じ）
  const AREA={w:168, h:98};                           // 図に つかう ところ（まわりは ラベル用）
  const sc=Math.min(AREA.w/(SH.h*RCM), AREA.h/(SH.d*RCM));
  const Pt=k=>({x:BOX.x+BOX.w/2 + (V[k].x-Gc.x)*sc, y:BOX.y+BOX.h/2+22 + (V[k].y-Gc.y)*sc});
  const A=Pt('A'), B=Pt('B'), C=Pt('C'), D=Pt('D');
  add('polygon',{points:`${A.x},${A.y} ${C.x},${C.y} ${B.x},${B.y} ${D.x},${D.y}`,
    fill:'none', stroke:'var(--line)', 'stroke-width':2.5, 'stroke-linejoin':'round'});
  /* 4つの へんが 同じ 長さ ＝ ひし形。しるし（すじ）を 4つの へんに 1本ずつ */
  [[A,C],[C,B],[B,D],[D,A]].forEach(([p,q])=>{
    const M={x:(p.x+q.x)/2, y:(p.y+q.y)/2};
    let ux=q.x-p.x, uy=q.y-p.y; const L=Math.hypot(ux,uy); ux/=L; uy/=L;
    add('line',{x1:M.x+uy*5, y1:M.y-ux*5, x2:M.x-uy*5, y2:M.y+ux*5, stroke:'var(--line)', 'stroke-width':2});
  });
  [A,B,C,D].forEach(p=>add('circle',{cx:p.x, cy:p.y, r:4, fill:'var(--red)'}));
  const lbl=(p,t,dx,dy)=>add('text',{x:p.x+dx, y:p.y+dy, 'font-size':19, fill:'var(--red)', 'text-anchor':'middle'}, t);
  lbl(A,'A',0,-9); lbl(B,'B',0,22); lbl(C,'C',14,17); lbl(D,'D',-14,17);
  /* へんの 長さは へんACに 1つだけ（4つとも 同じ なので） */
  const ac=awaySide(V.A,V.C);
  add('text',{x:(A.x+C.x)/2 + ac.pr.x*22, y:(A.y+C.y)/2 + ac.pr.y*22+5, 'font-size':15, fill:'#444',
    'text-anchor':'middle'}, cmTxt(SH.r));
}

/* ============ 画面を 作る ============ */
function baseSetup(){
  buildRuler(); buildVtx(); buildRefFig(); buildPhases();
}
function render(n){   // アニメなしで 状態nを 出す
  step=n;
  compass.style.visibility='hidden'; dojo.style.visibility='hidden';
  $('measLbl').style.opacity=0;
  ['sAC','sCB','sBD','sDA'].forEach(id=>{ const e=$(id); e.style.strokeDasharray=''; e.style.strokeDashoffset=''; show(e,false); });
  $('arcA').setAttribute('d',''); $('arcB').setAttribute('d','');
  vtxOn('A',true); vtxOn('B',true); vtxOn('C',false); vtxOn('D',false);
  if(n>=1) $('arcA').setAttribute('d', arcPath(V.A,R,90-SPAN,90+SPAN));
  if(n>=2) $('arcB').setAttribute('d', arcPath(V.B,R,-90-SPAN,-90+SPAN));
  if(n>=3){ vtxOn('C',true); vtxOn('D',true); }
  if(n>=4){ setLine($('sAC'),V.A,V.C); setLine($('sCB'),V.C,V.B); setLine($('sBD'),V.B,V.D); setLine($('sDA'),V.D,V.A);
    ['sAC','sCB','sBD','sDA'].forEach(id=>show($(id),true)); }
  setPlayText();
}
function setPlayText(){
  $('stepNo').textContent=(step===0?'▶':step);
  $('stepText').innerHTML=TXT[step];
  $('progress').textContent=`${step} / ${nstep()}`;
  $('btnPrev').disabled=(step<=0); $('btnNext').disabled=(step>=nstep());
}

/* ============ すすめる ============ */
let step=0, playing=false, animating=false;
let tOpen=0, curDir=0;    // コンパスの 開き具合と、いまの 向き
async function goNext(auto){
  if(animating || step>=nstep()) return;
  animating=true; $('btnNext').disabled=true; $('btnPrev').disabled=true;
  const n=step+1;
  try{
    if(n===1){
      tOpen=await measureRadius(STAGE, R, cmTxt(SH.r));
      curDir=await moveCompass(STAGE, V.A, tOpen, STAGE_DIR, 90-SPAN);
      curDir=await drawArcOpen(V.A, R, tOpen, 90, SPAN, $('arcA'), false);
    }else if(n===2){
      if(!tOpen){ tOpen=openingForRadius(R); curDir=90+SPAN; setPose(V.A,tOpen,curDir-pencilAngleAt(tOpen),SCALE); await animate(0,1,260,()=>{},ease); }
      curDir=await moveCompass(V.A, V.B, tOpen, curDir, -90-SPAN);
      curDir=await drawArcOpen(V.B, R, tOpen, -90, SPAN, $('arcB'), true);
    }else if(n===3){
      vtxOn('C',true); vtxOn('D',true); await animate(0,1,650,()=>{},ease);
    }else if(n===4){
      await drawSideWithRuler($('sAC'),V.A,V.C);
      await drawSideWithRuler($('sCB'),V.C,V.B);
      await drawSideWithRuler($('sBD'),V.B,V.D);
      await drawSideWithRuler($('sDA'),V.D,V.A);
    }
  }catch(e){}
  step=n; animating=false; setPlayText();
  if(auto && playing && step<nstep()){ setTimeout(()=>goNext(true), 600); }
  else if(step>=nstep()) stopPlay();
}
function goPrev(){ if(animating||step<=0) return; render(step-1); }
function restart(){ playing=true; render(0); $('btnPause').style.display=''; setTimeout(()=>goNext(true), 700); }
function stopPlay(){ playing=false; $('btnPause').style.display='none'; }
function newShape(){
  stopPlay();
  let s=SH; if(SHAPES.length>1){ while(s===SH) s=SHAPES[Math.floor(Math.random()*SHAPES.length)]; }
  setShape(s); baseSetup(); render(0);
  if(uiMode==='hand') handStart();      // 手動中なら 新しい 形で やりなおし
}
$('btnRestart').onclick=()=>restart();
$('btnPrev').onclick=()=>{ stopPlay(); goPrev(); };
$('btnNext').onclick=()=>{ stopPlay(); goNext(false); };
$('btnPause').onclick=()=>stopPlay();
$('btnRnd').onclick=()=>newShape();

/* ============================================================
   自分でやってみる（手動モード）  ★v53
   ながれ：
     フェーズ1  コンパスを ものさしで r cm に ひらく → はりを 点A へ → こ が かかれる
     フェーズ2  ひらきは そのまま → はりを 点B へ → こ が かかれ、点C・点D が 出る
     フェーズ3  点C・点D を クリックで なぞる（2回）
     フェーズ4  4つの へんは ものさしで じどうで むすぶ（見て いてね）
   道具は 平行四辺形タブと 同じ コンパス・ものさし。open/move/dot は 同じ しくみ。
   ============================================================ */
let uiMode='demo';
let hand=null;
const HAND_SNAP=60;      // はりを 点に 合わせる 許容（px）
const HAND_DOT=60;       // 点を なぞる クリックの 許容（px）
const HAND_OPEN=26;      // コンパスの ひらき具合の 許容（px）＝ やく0.5cm
const handDot=$('handDot');
const val=v=>(typeof v==='function'? v() : v);
const onCompass=e=>compass.contains(e.target);
const onTool=e=>dojo.contains(e.target);

/* はかる場所（STAGE）に ものさしを 置く／どける */
const stageU={x:Math.cos(STAGE_DIR*RAD), y:Math.sin(STAGE_DIR*RAD)};
function stageRuler(on){
  if(!on){ dojo.style.visibility='hidden'; return; }
  const pp=awayPerp(STAGE,stageU); placeRuler(STAGE,stageU,pp);
  dojo.style.opacity=1;
}
function stageLbl(txt){ const ml=$('measLbl'); if(!ml) return;
  if(!txt){ ml.style.opacity=0; return; }
  const pp=awayPerp(STAGE,stageU);
  ml.setAttribute('x',STAGE.x+val(txt.R)*0.5*stageU.x+pp.x*24);
  ml.setAttribute('y',STAGE.y+val(txt.R)*0.5*stageU.y+pp.y*24+8);
  ml.textContent=txt.cm; ml.style.opacity=1; }

/* 手動の 表は 図の 値から 組み立てる。setShape が 呼ぶ（V を つかむため）。 */
let HP=[];
function buildPhases(){
  const rT=cmTxt(SH.r);
  HP=[null,
  /* フェーズ1：コンパスを ひらいて、点A か 点B に はりを さす → さした 瞬間に こ */
  { acts:[
      {kind:'open', targR:R, r0:()=>radiusAt(T_REST), cm:rT,
       say:`コンパスを ものさしで ${rT}に ひらこう。（えんぴつを 右へ）`,
       hint:`ものさしの ${SH.r}の ところまで えんぴつを うごかそう。`},
      {kind:'stick',
       say:'ひらいたまま、はりを 点A か 点B に さそう。',
       hint:'点A でも 点B でも いいよ。はりの さきを 点に くっつけよう。'}],
    label:'',
    act:async()=>{}      // こ は はりを さした 瞬間（handUp）に かく
  },
  /* フェーズ2：もう ひとつの 点に さす → こ → 交点C・D → 4つの へん（ぜんぶ じどう） */
  { acts:[
      {kind:'stick', keepOpen:true,
       say:'ひらきは そのまま！ もう ひとつの 点に さそう。',
       hint:`${rT}の まま。まだ さして いない 点に はりを くっつけよう。`}],
    label:'',
    act:async()=>{
      /* 2本目の こ は handUp で かき終わって いる。交点C・D を おいて、そのまま 線を ひく */
      vtxOn('C',true); vtxOn('D',true); await animate(0,1,500,()=>{},ease);
      await drawSideWithRuler($('sAC'),V.A,V.C);
      await drawSideWithRuler($('sCB'),V.C,V.B);
      await drawSideWithRuler($('sBD'),V.B,V.D);
      await drawSideWithRuler($('sDA'),V.D,V.A);
    } }];
}
const curPh =()=>HP[hand.phase];
const curAct=()=>{ const a=curPh().acts; return hand.ai<a.length? a[hand.ai] : null; };

/* 正解！の ふきだし（文字の 長さに 合わせて のびる） */
const OK_PAD=40, OK_MINW=240, OK_CX=440;
function badge(msg,ms){ const b=$('okBadge'), t=$('okText'); t.textContent=msg||'';
  if(msg){ const r=$('okRect'); let w=OK_MINW;
    try{ w=Math.max(OK_MINW, t.getBBox().width+OK_PAD*2); }catch(e){}
    r.setAttribute('x', OK_CX-w/2); r.setAttribute('width', w); }
  b.style.transition='opacity .3s ease'; b.style.opacity=msg?1:0;
  if(msg&&ms) setTimeout(()=>{ if(!hand||!hand.done) b.style.opacity=0; }, ms); }

function handUI(){
  if(!hand) return; const ph=curPh(), a=curAct(), N=HP.length-1;
  $('stepNo').textContent = hand.done?'✓':hand.phase;
  $('progress').textContent = hand.done?'':`${hand.phase} / ${N}`;
  $('stepText').innerHTML = hand.done ? 'ひし形ABCD の できあがり！ よく できました。'
                          : (a? a.say : ph.say);
  const btn=$('btnDo');
  if(btn){ const ready=!a && !!ph.label;
    btn.style.display = ready?'':'none'; btn.innerHTML = ph.label||''; btn.disabled = !ready; }
}
function handHint(open){ const b=$('hintBox'); if(!hand) return; const a=curAct();
  b.innerHTML = hand.done ? 'できたね！「はじめから」で もう一かい できるよ。'
              : a ? a.hint : (curPh().hint||'ボタンを おそう。');
  b.classList.toggle('show',open); }

/* いまの ようすを 画面に 出す */
function midFor(vtxKey){ return vtxKey==='A' ? 90 : -90; }   // A＝下向きの こ／B＝上向きの こ
function nearestFree(p){   // まだ さして いない 点の うち、近い ほう
  const free=['A','B'].filter(k=>!hand.stuck.includes(k));
  let best=free[0], bd=Infinity;
  for(const k of free){ const d=Math.hypot(p.x-V[k].x, p.y-V[k].y); if(d<bd){ bd=d; best=k; } }
  return best;
}
function handPlace(){
  const a=curAct();
  if(!a) return;
  if(a.kind==='open'){ hand.t=openingForRadius(hand.pos.r);
      setPose(STAGE,hand.t,STAGE_DIR-pencilAngleAt(hand.t),SCALE); }
  else if(a.kind==='stick'){
      const mid=midFor(hand.aimKey||'A');
      setPose(hand.pos,hand.t,(mid-SPAN)-pencilAngleAt(hand.t),SCALE); }
}
/* その act の さいしょの ようす */
function actInit(){
  const a=curAct();
  stageLbl(null);
  if(a){
    if(a.kind==='open'){ compass.classList.add('grab'); stageRuler(true); hand.pos={r:val(a.r0)}; handPlace(); }
    else if(a.kind==='stick'){ compass.classList.add('grab'); stageRuler(false);
      /* 1本目は はかった STAGE から、2本目は 1本目に さした 点から うごかしはじめる */
      const startPt = hand.stuck.length ? V[hand.stuck[hand.stuck.length-1]] : STAGE;
      hand.pos={x:startPt.x, y:startPt.y};
      hand.aimKey=nearestFree(hand.pos);
      handPlace(); }
    else if(a.kind==='dot'){ compass.style.visibility='hidden'; }
  }
}
function handGo(n){
  hand.phase=n; hand.ai=0;
  dojo.style.visibility='hidden'; compass.style.visibility='hidden'; handDot.style.opacity=0;
  compass.classList.remove('grab');
  actInit(); handUI(); handHint(false);
  const ph=curPh();
  if(!ph.acts.length && !ph.label) runAct();     // じどうで ひく フェーズ
}
async function actDone(){
  hand.ai++; badge('いい ちょうし！',1300);
  if(curAct()){ actInit(); handUI(); handHint(false); return; }
  handUI(); handHint(false);
  if(!curPh().label) await runAct();
}
async function runAct(){
  const ph=curPh(); hand.busy=true; const _bd=$('btnDo'); if(_bd)_bd.disabled=true; badge('',0);
  await ph.act();
  hand.busy=false;
  if(hand.phase>=HP.length-1){ hand.done=true; handUI(); handHint(false);
    badge('正解！できあがり！',0); playHishiOK(); }
  else handGo(hand.phase+1);
}
/* 正解音（探すタブと 同じ mp3。読めなければ 鳴らないだけ） */
function playHishiOK(){ try{ const a=new Audio('https://raw.githubusercontent.com/byakusen/gogelige.quiz/main/quiz_seikai.mp3'); a.play&&a.play().catch(()=>{}); }catch(e){} }
function handStart(){
  render(0); badge('',0); handDot.style.opacity=0; stageLbl(null);
  $('arcA').setAttribute('d',''); $('arcB').setAttribute('d','');
  vtxOn('C',false); vtxOn('D',false);
  hand={phase:1, ai:0, pos:null, t:T_REST, busy:false, done:false, stuck:[], aimKey:null};
  handGo(1);
}
function setUIMode(m){
  uiMode=m; stopPlay(); $('hintBox').classList.remove('show'); badge('',0);
  $('demoControls').style.display = (m==='demo')?'flex':'none';
  $('handControls').style.display = (m==='hand')?'flex':'none';
  if(m==='demo'){ hand=null; stageLbl(null); compass.classList.remove('grab'); render(0); }
  else handStart();
}
$('btnHand').onclick=()=>setUIMode('hand');
$('btnDemo').onclick=()=>setUIMode('demo');
$('btnHReset').onclick=()=>handStart();
$('btnHint').onclick=()=>{ const b=$('hintBox'); handHint(!b.classList.contains('show')); };
const _btnDo=$('btnDo'); if(_btnDo) _btnDo.onclick=()=>{ if(!_btnDo.disabled && hand && !hand.busy) runAct(); };

/* ---------------- ドラッグ／クリック ---------------- */
function toBoardXY(e){ const p=board.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  const q=p.matrixTransform(board.getScreenCTM().inverse()); return {x:q.x,y:q.y}; }
let hdrag=null;
function handDown(e){
  if(uiMode!=='hand' || !hand || hand.busy || hand.done) return;
  const a=curAct(); if(!a) return;
  const p=toBoardXY(e);
  if(a.kind==='dot'){
    e.preventDefault(); const at=val(a.at);
    if(Math.hypot(p.x-at.x, p.y-at.y)<HAND_DOT) putDot(at);
    else badge('もうすこし ちかくを クリック！',1300);
    return;
  }
  if(!onCompass(e)) return;
  e.preventDefault();
  hdrag = (a.kind==='open')? {dx:p.x-(STAGE.x+hand.pos.r)}
        : {dx:p.x-hand.pos.x, dy:p.y-hand.pos.y};
  try{ board.setPointerCapture(e.pointerId); }catch(err){}
}
function handMove(e){
  if(!hdrag||!hand) return; const a=curAct(); if(!a) return;
  const p=toBoardXY(e);
  if(a.kind==='open'){ const lo=radiusAt(0), hi=radiusAt(T_MAX);
      hand.pos={r:Math.max(lo,Math.min(hi, p.x-hdrag.dx-STAGE.x))}; }
  else { hand.pos={x:p.x-hdrag.dx, y:p.y-hdrag.dy};
      if(a.kind==='stick') hand.aimKey=nearestFree(hand.pos); }   // 近い ほうの 点へ 向く
  handPlace();
}
async function handUp(){
  if(!hdrag||!hand) return; hdrag=null; const a=curAct(); if(!a) return;
  if(a.kind==='open'){
    if(Math.abs(hand.pos.r-a.targR)<HAND_OPEN){ hand.pos={r:a.targR}; handPlace(); stageLbl({cm:a.cm, R:a.targR}); actDone(); }
    else { handPlace(); handHint(false); }
    return;
  }
  if(a.kind==='stick'){
    const key=hand.aimKey, t=V[key];
    if(Math.hypot(hand.pos.x-t.x, hand.pos.y-t.y)<HAND_SNAP){
      hand.pos={x:t.x, y:t.y}; handPlace();
      hand.busy=true;                                    // かいて いる あいだは つかめない
      const arcEl=$(key==='A'?'arcA':'arcB'), lastArc=(hand.stuck.length===1);
      await drawArcOpen(t, R, hand.t, midFor(key), SPAN, arcEl, lastArc);  // さした 瞬間に こ
      hand.stuck.push(key);
      hand.busy=false;
      actDone();                                         // 1本目→フェーズ2へ／2本目→act（C・D・線）
    } else { handPlace(); handHint(false); }
    return;
  }
}
async function putDot(at){
  handDot.setAttribute('cx',at.x); handDot.setAttribute('cy',at.y);
  handDot.style.transition='opacity .25s ease'; handDot.style.opacity=1;
  vtxOn(at===V.C?'C':(at===V.D?'D':''),true);
  badge('点が ついた！',1300);
  await actDone();
  handDot.style.opacity=0;
}
board.addEventListener('pointerdown', handDown);
board.addEventListener('pointermove', handMove);
board.addEventListener('pointerup', handUp);
board.addEventListener('pointercancel', handUp);


setShape(SHAPES.find(s=>s.r===4 && s.d===4) || SHAPES[0]);
baseSetup();
render(0);

<\/script>

<script type="text/html" id="srcKakudo">
<!--
  角度をもとめる（小4 算数）／ v1（アプリ v55 で 新設）
  ■ 問題
   ・カ∥キ（横の 平行線）、ク∥ケ（斜めの 平行線）。片方の 角（60°など）を もとに あ〜お を 計算で もとめる。
   ・分度器は つかわない。同位角・錯角・対頂角・一直線(180°) の 考えで もとめる。
  ■ こたえ（斜めの 鋭角を t とする）
   ・あ ＝ t     （60°と 同位角）
   ・い ＝ 180-t （あと 一直線）
   ・う ＝ t     （あの 対頂角）
   ・え ＝ 180-t （いの 対頂角）
   ・お ＝ 180-t （いと 同位角、ク∥ケ）
  ■ 作り
   ・図は buildFig(t,sgn) が 座標から 作る。t＝斜めの 鋭角、sgn＝斜めの 向き（右上がり/左上がり）。
   ・タップした 角の こたえを 下の 4つの ボタンから えらぶ。正解で 緑＋わけ、5つ そろうと はなまる＋音。
   ・外の URL は 音だけ（読めなければ 鳴らないだけ）。図・はなまるは その場で 描く。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>角度をもとめる</title>
<style>
  :root{ --green:#4a9e5c; --green-d:#3b824a; --green-l:#eaf5ea; --green-ll:#f4faf3;
    --paper:#ffffff; --line:#1f2430; --red:#e23c3c; --blue:#2f7dd1; --ask:#e8820e; --ok:#2b9b47; --ink:#2b2b2b; --sub:#5b6b5e; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{height:100vh; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--green-ll); color:var(--ink); display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent}
  header{flex:0 0 auto; background:var(--green); color:#fff; padding:7px 14px; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap}

  .modes{display:flex; gap:8px; margin-left:auto}

  .mode-btn.rnd{border-color:#d9a441; color:#8a5b00; background:#fff7e6}
  .mode-btn.rnd:hover{background:#ffefcc}
  /* 左＝図 ／ 右＝テンキー。まん中に よせて ならべる */
  .body{flex:1 1 auto; min-height:0; display:flex; gap:14px; padding:6px 10px; justify-content:center}
  main{flex:0 1 auto; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; padding:0}
  .stage{height:100%; width:auto; aspect-ratio:880/600; max-width:100%;
    background:var(--paper); border:3px solid var(--green); border-radius:14px; overflow:hidden; display:flex}
  svg{width:100%; height:100%; touch-action:manipulation}

  /* テンキー（辺と角タブと 同じ つくり） */
  .side{flex:0 0 auto; width:clamp(184px,24vw,244px); display:flex; flex-direction:column; justify-content:center; gap:8px}
  .ansbox{height:clamp(44px,9vh,60px); padding:0 12px; display:flex; align-items:center; justify-content:center; gap:3px;
    background:#fff; border:3px solid var(--green); border-radius:12px; color:var(--green-d);
    font-size:clamp(19px,4.4vh,28px); font-weight:800}
  .ansbox .ph{color:#c3d2c4}
  .ansbox .u{font-size:.78em; margin-left:2px}
  .ansbox.ng{border-color:var(--red); color:var(--red)}
  .ansbox.ok{border-color:var(--ok); color:var(--ok)}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .key{font-family:inherit; font-size:clamp(16px,3.4vh,23px); font-weight:800; height:clamp(38px,8vh,56px); padding:0;
    border-radius:12px; background:#fff; color:var(--green-d); border:2px solid var(--green); box-shadow:0 4px 0 #cfe3cf; cursor:pointer}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #cfe3cf}
  .key.zero{grid-column:2}
  .key.del{grid-column:3; font-size:clamp(13px,2.3vh,17px); border-color:#b9bdb9; color:#6b706b; box-shadow:0 4px 0 #dcdfdc}
  .pad.lock{opacity:.42; pointer-events:none}
  footer{flex:0 0 auto; background:var(--green-l); border-top:3px solid var(--green); padding:9px 14px 11px}
  .panel{max-width:900px; margin:0 auto}
  .steprow{display:flex; align-items:center; gap:11px}
  .stepno{flex:none; width:46px; height:46px; border-radius:50%; background:var(--green); color:#fff; font-size:22px; font-weight:800; display:flex; align-items:center; justify-content:center}
  /* display:grid だと <b>あ</b> と つづきの 文字が べつの マスに 入って 2行に なる。block に する */
  .steptext{font-size:clamp(15px,3.7vw,20px); font-weight:700; line-height:1.4; min-height:1.5em}
  .progress{margin-left:auto; font-size:14px; color:var(--sub); font-weight:700; white-space:nowrap}
  .hintbox{margin-top:7px; background:#fffbe8; border:2px dashed #e6c65a; border-radius:12px; padding:7px 12px;
    font-size:clamp(13px,3vw,15px); font-weight:700; color:#7a5c00; visibility:hidden; min-height:1.4em}
  .hintbox.show{visibility:visible}
  .clk{cursor:pointer}
</style>

const $=(id)=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const RAD=Math.PI/180;
const board=$('board');
function el(par,tag,at,txt){ const e=document.createElementNS(NS,tag);
  for(const k in at) e.setAttribute(k,at[k]); if(txt!=null) e.textContent=txt; par.appendChild(e); return e; }
function clr(g){ while(g.firstChild) g.removeChild(g.firstChild); }
const polar=(c,r,deg)=>({x:c.x+r*Math.cos(deg*RAD), y:c.y+r*Math.sin(deg*RAD)});
function shortDelta(a0,a1){ let d=a1-a0; while(d>180)d-=360; while(d<=-180)d+=360; return d; }
function arcPath(c,r,a0,a1){ const d=shortDelta(a0,a1); a1=a0+d;   // かならず 短いほう（内がわ＝180°以下）の こ
  const p0=polar(c,r,a0), p1=polar(c,r,a1);
  const sweep=d>0?1:0;
  return `M ${p0.x} ${p0.y} A ${r} ${r} 0 0 ${sweep} ${p1.x} ${p1.y}`; }

/* ============ 図の 形（t＝斜めの 鋭角、sgn＝斜めの 向き） ============ */
const TS=[40,45,50,55,60,65,70,75,80];
let t=60, sgn=1;                 // sgn=+1：右上がり／-1：左上がり
let yKa=195, yKi=425;            // カ（上）・キ（下）の y
let dirv={x:0,y:0};              // 斜め線の 上向き 単位ベクトル
let P={};                        // 交点など
let items=[];                    // あ〜お の 問題
let done=0, sel=null, locked={};

function setFig(nt,ns){
  t=nt; sgn=ns;
  dirv={x:sgn*Math.cos(t*RAD), y:-Math.sin(t*RAD)};   // 上向き（画面yは下）
  // ク が キ を 横切る x、ケ が キ を 横切る x
  const xKu = sgn>0? 410 : 470, xKe = sgn>0? 630 : 250;
  const onKi=(x)=>({x, y:yKi});
  const up=(base,y)=>{ const s=(y-yKi)/dirv.y; return {x:base.x+s*dirv.x, y}; };  // 交点(base,yKi)から yへ
  const KuKi=onKi(xKu), KeKi=onKi(xKe);
  P={
    KuKi, KeKi,
    KuKa: up(KuKi, yKa),          // ク∩カ ← 60°表示
    KeKa: up(KeKi, yKa),
    kuTop: up(KuKi,120), kuBot: up(KuKi,565),
    keTop: up(KeKi,120), keBot: up(KeKi,565),
    xL:60, xR:820
  };
  buildItems();
}

/* あ〜お の 角。答えは 図から 計算する（斜めの 向きが どちらでも 正しい／180°を こえない）。
   base ＝ キの右 と 斜めの上 が つくる 角（＝ク∩カ に 見せる 手がかりの 角、あ と 同位角）。 */
let baseAng=60;                       // 手がかりに 見せる 角（drawGiven が つかう）
function buildItems(){
  const angOf=(v)=>Math.atan2(v.y,v.x)/RAD;
  const R={x:1,y:0}, L={x:-1,y:0};
  const U={x:dirv.x,y:dirv.y}, D={x:-dirv.x,y:-dirv.y};   // 斜めの 上・下
  // ある 角を 2つの むきで 決める。答えは その 内がわの 角（=|shortDelta|、180°以下）。
  function wedge(center,d1,d2){ const a0=angOf(d1), del=shortDelta(a0,angOf(d2));
    return {center, a0, a1:a0+del, mid:a0+del/2, ans:Math.round(Math.abs(del))}; }
  const c=P.KuKi;
  baseAng = Math.round(Math.abs(shortDelta(angOf(R),angOf(U))));   // = t か 180-t
  items=[
    {key:'あ', why:'手がかりの 角と 同位角（カ∥キ）', ...wedge(c,R,U)},   // キ右 と 斜め上
    {key:'い', why:'あと 一直線 で 180°',            ...wedge(c,U,L)},   // 斜め上 と キ左
    {key:'う', why:'あの 対頂角',                    ...wedge(c,L,D)},   // キ左 と 斜め下
    {key:'え', why:'いの 対頂角',                    ...wedge(c,D,R)},   // 斜め下 と キ右
    {key:'お', why:'いと 同位角（ク∥ケ）',           ...wedge(P.KeKi,U,L)}, // ケ∩キ、いと 同じ 位置
  ];
  done=0; sel=null; locked={};
}

/* ============ 描く ============ */
function drawFig(){
  const g=$('fig'); clr(g);
  const L=(p1,p2,w)=>el(g,'line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:'var(--line)','stroke-width':w||4,'stroke-linecap':'round'});
  // 横線 カ・キ
  L({x:P.xL,y:yKa},{x:P.xR,y:yKa}); L({x:P.xL,y:yKi},{x:P.xR,y:yKi});
  // 斜め線 ク・ケ
  L(P.kuTop,P.kuBot); L(P.keTop,P.keBot);
  // ラベル カキクケ
  const lab=(p,txt,dx,dy)=>el(g,'text',{x:p.x+dx,y:p.y+dy,'font-size':26,'font-weight':800,fill:'var(--green-d)','text-anchor':'middle'},txt);
  lab({x:P.xL,y:yKa},'カ',-6,8); lab({x:P.xL,y:yKi},'キ',-6,8);
  lab(P.kuTop,'ク',0,-12); lab(P.keTop,'ケ',0,-12);
}
function drawGiven(){
  // ク∩カ の 手がかりの 角（あ と 同位角）。キ右 と 斜め上 の あいだ
  const g=$('marks');
  const c=P.KuKa;
  const angOf=(v)=>Math.atan2(v.y,v.x)/RAD;
  const R={x:1,y:0}, U={x:dirv.x,y:dirv.y};
  const a0=angOf(R), del=shortDelta(a0,angOf(U));
  el(g,'path',{d:arcPath(c,30,a0,a0+del),fill:'none',stroke:'var(--red)','stroke-width':3});
  const lp=polar(c,54,a0+del/2);
  el(g,'text',{x:lp.x,y:lp.y+8,'font-size':24,'font-weight':800,fill:'var(--red)','text-anchor':'middle'},`${baseAng}°`);
}
function drawMarks(){
  const g=$('marks'); clr(g); drawGiven();
  items.forEach((it,idx)=>{
    const solved=locked[it.key];
    const isSel=(sel===idx);
    const col = solved?'var(--ok)': isSel?'var(--ask)':'#9aa6a0';
    // 弧
    el(g,'path',{d:arcPath(it.center,26,it.a0,it.a1),fill:'none',stroke:col,'stroke-width':solved?3.5:3, 'data-i':idx, class:'clk'});
    // 数字 or かな。正解後も かな を のこす（ヒントで「あと…」と 言うため）
    const solvedR=54, unsolvedR=46;
    const lp=polar(it.center, solved?solvedR:unsolvedR, it.mid);
    const txt = solved? `${it.key}=${it.ans}°` : it.key;
    el(g,'text',{x:lp.x,y:lp.y+7,'font-size':solved?18:22,'font-weight':800,fill:col,'text-anchor':'middle','data-i':idx, class:'clk'}, txt);
    // タップ しやすい 透明の まる（まだ とけて いない ものだけ）
    if(!solved){ const tp=polar(it.center,unsolvedR,it.mid);
      el(g,'circle',{cx:tp.x,cy:tp.y-4,r:30,fill:'transparent','data-i':idx, class:'clk'}); }
  });
}

/* ============ テンキー（けた数が そろったら その場で 判定）============ */
const ansBoxK=$('ansK'), numK=$('numK'), phK=$('phK'), keysK=$('keysK');
let typed='', ngK=false, need=2;
function showTyped(){ numK.textContent=typed; phK.textContent='_'.repeat(Math.max(0,need-typed.length)); }
function clearAns(){ typed=''; ngK=false; ansBoxK.className='ansbox'; showTyped(); }
function lockPad(on){ keysK.classList.toggle('lock', !!on); }
function buildPad(){
  keysK.textContent='';
  function add(label,cls,arg){
    const b=document.createElement('button');
    b.className='key'+(cls?(' '+cls):''); b.textContent=label;
    b.addEventListener('click',()=>press(arg)); keysK.appendChild(b);
  }
  '123456789'.split('').forEach(d=>add(d,'',d));
  add('0','zero','0'); add('けす','del','del');
}
function press(x){
  if(keysK.classList.contains('lock')) return;
  if(x==='del'){
    if(ngK){ typed=''; ngK=false; ansBoxK.className='ansbox'; }
    else typed=typed.slice(0,-1);
    showTyped(); return;
  }
  if(ngK){ typed=''; ngK=false; ansBoxK.className='ansbox'; }
  if(typed.length>=need) return;
  if(typed==='' && x==='0') return;
  typed+=x; showTyped();
  if(typed.length===need) answer(parseInt(typed,10));
}
document.addEventListener('keydown', e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key>='0' && e.key<='9'){ press(e.key); e.preventDefault(); }
  else if(e.key==='Backspace'){ press('del'); e.preventDefault(); }
});
function say(msg){ $('stepText').innerHTML='<span>'+msg+'</span>'; }   // 1つの かたまりに して 1行に
function setProgress(){ $('progress').textContent = `${done} / 5 正解`; $('stepNo').textContent = done>=5?'✓':(done+1); }

/* あ→い→う→え→お の じゅんばんに、じどうで 出す */
let nextTimer=null;
function pick(idx){
  sel=idx; drawMarks();
  const it=items[idx];
  say(`<b style="color:var(--ask)">${it.key}</b> は 何度？ 右の キーで 入れよう。`);
  $('hintBox').classList.remove('show');
  need=String(it.ans).length; clearAns(); lockPad(false);
}
function nextItem(){
  if(nextTimer){ clearTimeout(nextTimer); nextTimer=null; }
  const i=items.findIndex(it=>!locked[it.key]);
  if(i<0){ finish(); return; }
  pick(i);
}
function answer(v){
  if(sel==null) return; const it=items[sel];
  if(v===it.ans){
    locked[it.key]=true; done++; sel=null;
    ansBoxK.className='ansbox ok'; lockPad(true);
    drawMarks();
    say(`正解！ ${it.key} = ${it.ans}° （${it.why}）`);
    $('hintBox').classList.remove('show');
    setProgress();
    hanamaru(440, 300, 130); playOK();
    // はなまるが 消えたら 次の 角へ（さいごの 1問なら おしまいの メッセージ）
    nextTimer=setTimeout(()=>{ nextTimer=null; nextItem(); }, 2800);
  }else{
    ngK=true; ansBoxK.className='ansbox ng';
    say(`ちがうよ。もう いちど ${it.key} を 考えよう。`);
    $('hintBox').innerHTML = hintFor(it);
    $('hintBox').classList.add('show');
  }
}
function hintFor(it){
  if(it.key==='あ') return `カとキは 平行。${baseAng}°の 角と 同じ 位置（同位角）だよ。`;
  if(it.key==='い') return `あ と い を あわせると 一直線＝180°。`;
  if(it.key==='う') return `あ の ちょうど 向かい（対頂角）は 同じ 角。`;
  if(it.key==='え') return `い の 向かい（対頂角）は 同じ 角。`;
  return `クとケは 平行。い と 同じ 位置（同位角）だよ。`;
}

/* ============ はなまる（わたされた 画像）＋音 ============ */
const HANA_URL=HANA_B64;
let hanaTimer=null;
function hanamaru(cx,cy,R){          // R＝およその 半径。画像を 2R の 大きさで まん中に
  const g=$('hana'); clr(g);
  if(hanaTimer){ clearTimeout(hanaTimer); hanaTimer=null; }
  g.style.transition='none'; g.style.opacity=1;
  const w=2*R, h=2*R*264/272;        // 画像の たてよこ比（272×264）
  const e=el(g,'image',{x:cx-w/2, y:cy-h/2, width:w, height:h});
  e.setAttributeNS('http://www.w3.org/1999/xlink','href',HANA_URL);
  e.setAttribute('href',HANA_URL);
  hanaTimer=setTimeout(()=>{ g.style.transition='opacity .8s ease'; g.style.opacity=0; hanaTimer=null; }, 2000);
}

<!--
  四角形の 特ちょう（小4 算数）／ v3（アプリ v63）
  ------------------------------------------------------------------
  ・列 … 台形／平行四辺形／ひし形／長方形／正方形（名前＋形。形を もっと 大きく）
  ・行 … 辺・角（3つ）＋ 対角線（2つ）。※「まん中で 交わる」の 行は 先生の 指示で 削除。
  ・区切り線は ほかと 同じ 太さ（特別な 太線は なし）。
  ・ヒント … 見出しの 形を タップ すると 対角線が 2本 引かれる（対角線は むずかしいので）。
  ・あてはまる ますを タップ → ○。「こたえあわせ」で みどり○／あかい✕／たりない ますは あかく。
  ・25こ そろうと はなまる＋音。音は 先生から もらった mp3 を base64 で 埋めこみ（ネット不要）。
    読めない ときだけ ネット不要の ドミソ が 代わりに 鳴る。外の URL には たよらない。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>四角形の特ちょう</title>
<style>
  :root{ --green:#4a9e5c; --green-d:#3b824a; --green-l:#eaf5ea; --green-ll:#f4faf3;
    --paper:#ffffff; --line:#1f2430; --red:#e23c3c; --blue:#2f7dd1; --ok:#2b9b47; --ink:#2b2b2b; --sub:#5b6b5e; --ask:#e8820e; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{height:100vh; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--green-ll); color:var(--ink); display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent}
  header{flex:0 0 auto; background:var(--green); color:#fff; padding:6px 14px; display:flex; align-items:baseline; gap:6px 14px; flex-wrap:wrap}
  header h1{font-size:clamp(16px,4vw,23px); margin:0}
  header .sub{font-size:clamp(11px,2.9vw,14px); font-weight:700; color:#e7f3e7}
  header .sub b{color:#fff}
  main{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 8px; position:relative}
  .wrap{width:100%; max-width:820px; height:100%; display:flex}
  table{width:100%; height:100%; border-collapse:collapse; table-layout:fixed; background:var(--paper);
    border:3px solid var(--green); border-radius:12px; overflow:hidden}
  th,td{border:1.5px solid #c7d8c7; padding:0; text-align:center; vertical-align:middle}

  /* 左上の ななめ見出し */
  .corner{position:relative; background:
    linear-gradient(to top right, transparent calc(50% - 1px), #9bb59b calc(50% - 1px), #9bb59b calc(50% + 1px), transparent calc(50% + 1px));}
  .corner .t1{position:absolute; top:5px; right:7px; font-size:clamp(9px,2.3vw,13px); font-weight:800; color:var(--green-d)}
  .corner .t2{position:absolute; bottom:5px; left:7px; font-size:clamp(9px,2.3vw,13px); font-weight:800; color:var(--green-d)}

  /* 上の 見出し（形＋名前）… 形を 大きく */
  thead th.head{background:var(--green-l); cursor:pointer; height:clamp(122px,24vh,205px); transition:background .12s}
  thead th.head:hover{background:#e2f0e2}
  thead th.head.dshow{background:#e8f2fb}
  .colhead{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:7px 2px; height:100%}
  .colhead svg{width:clamp(66px,17vw,124px); height:clamp(50px,13vw,95px); display:block}
  .colhead .nm{font-size:clamp(12px,3vw,17px); font-weight:800; color:var(--ink); line-height:1.1}
  .diag{opacity:0; transition:opacity .12s}
  thead th.head.dshow .diag{opacity:1}

  /* 特ちょうの 見出し（左） */
  td.rowhead{background:#f3f8f2; text-align:left; padding:6px 9px; font-size:clamp(12px,2.9vw,15px);
    font-weight:700; color:var(--ink); line-height:1.3}

  /* ○を つける ます */
  td.cell{cursor:pointer; position:relative; transition:background .1s}
  td.cell:hover{background:#f2faf3}
  .ring{display:block; margin:auto; width:clamp(22px,5.6vw,30px); height:clamp(22px,5.6vw,30px); border-radius:50%;
    border:4px solid var(--green-d); opacity:0; transform:scale(.7); transition:opacity .1s, transform .1s}
  td.cell.on .ring{opacity:1; transform:scale(1)}
  td.cell.ok{background:#e9f7ec}
  td.cell.ok .ring{border-color:var(--ok)}
  td.cell.ng{background:#fdeaea}
  td.cell.ng .ring{border-color:var(--red)}
  td.cell.ng::after{content:"✕"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--red); font-size:clamp(24px,6.4vw,34px); font-weight:900}
  td.cell.need{background:#fdeaea; box-shadow:inset 0 0 0 3px var(--red)}

  footer{flex:0 0 auto; background:var(--green-l); border-top:3px solid var(--green); padding:9px 12px 11px;
    display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
  .msg{flex:1 1 210px; font-size:clamp(13px,3.4vw,17px); font-weight:800; color:var(--ink); min-height:1.4em}
  .msg.good{color:var(--ok)} .msg.bad{color:var(--red)}
  .btns{display:flex; gap:10px; margin-left:auto}
  .btns button{font-family:inherit; font-weight:800; font-size:clamp(14px,3.6vw,18px); padding:9px 18px; border-radius:12px; cursor:pointer}
  #btnCheck{border:none; background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-d)}
  #btnCheck:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-d)}
  #btnReset{border:3px solid var(--green); background:#fff; color:var(--green-d)}

  #hana{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(150px,44vw,230px);
    pointer-events:none; opacity:0; filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}

  /* 「表」「図形」の 小さいタブ */
  .tnav{display:flex; gap:6px; margin-left:14px}
  .tnb{font-family:inherit; border:3px solid #fff; background:rgba(255,255,255,.18); color:#fff;
    font-size:clamp(12px,3vw,16px); font-weight:800; padding:5px 16px; border-radius:999px; cursor:pointer}
  .tnb.on{background:#fff; color:var(--green-d)}
  .pane{flex:1 1 auto; min-height:0; display:none; flex-direction:column}
  .pane.show{display:flex}
  .ph{flex:1 1 auto; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    color:var(--sub); font-weight:800; font-size:clamp(15px,3.8vw,21px); line-height:1.8}

  /* ── 「図形」ページ ── */
  .zq{flex:0 0 auto; background:var(--green-l); border-bottom:2px solid #cfe3cf; padding:6px 14px;
    font-size:clamp(12px,3vw,17px); font-weight:700; line-height:1.4}
  .zq b{color:var(--green-d)}
  .zq .qq{color:#c22; font-weight:800}
  .zgrid{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);
    gap:clamp(4px,1.2vh,11px); width:100%; max-width:860px; height:100%}
  .zcard{background:#fff; border:3px solid #cfe3cf; border-radius:14px; padding:3px 3px 10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:0; overflow:hidden}
  .zsv{flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center}
  .zsv svg{width:100%; height:100%}
  .zcard .nm{flex:0 0 auto; font-size:clamp(14px,3.6vh,24px); font-weight:800; color:var(--ink); line-height:1.05}
  .zcard.sel{border-color:var(--green); background:#eef8ee}
  .zcard.ok{border-color:var(--ok); background:#eefaf0}
  .zcard.ng{border-color:var(--red); background:#fdeeee}
  .zcard .mk{position:absolute; right:7px; top:2px; font-size:clamp(15px,3vh,24px); font-weight:900; line-height:1; color:var(--green)}
  .zcard.ok .mk{color:var(--ok)}
  .zcard.ng .mk{color:var(--red)}
  #hanaZ{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(140px,38vw,215px);
    pointer-events:none; opacity:0; filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
  #hanaZ.show{opacity:1; transition:opacity .15s}
  #hanaZ.fade{opacity:0; transition:opacity .8s ease}
  #btnZCheck{border:none; background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-d)}
  #btnZCheck:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-d)}
  #btnZNext{border:3px solid var(--ask); background:#fff; color:#b5640a}
  #hana.show{opacity:1; transition:opacity .15s}
  #hana.fade{opacity:0; transition:opacity .8s ease}

  /* ── 「点を移動」ページ（v86）── */
  .twrap{width:100%; max-width:920px; height:100%; display:flex; gap:clamp(6px,1.6vw,16px); align-items:stretch}
  .tfig{flex:1 1 auto; min-width:0; background:#fff; border:3px solid #cfe3cf; border-radius:14px;
    display:flex; align-items:center; justify-content:center; padding:5px;
    touch-action:none; -webkit-user-select:none; user-select:none}
  .tfig svg{width:100%; height:100%; display:block}
  .tside{flex:0 0 clamp(198px,30vw,286px); min-height:0; display:flex; flex-direction:column; gap:clamp(4px,1.3vh,11px)}

  .tname{flex:0 0 auto; background:var(--green-l); border:3px solid var(--green); border-radius:12px;
    text-align:center; padding:4px 6px; line-height:1.1;
    font-size:clamp(17px,4.6vh,30px); font-weight:800; color:var(--green-d)}
  .tname.none{background:#f3f3f3; border-color:#cfcfcf; color:#7d867f; font-size:clamp(13px,3.1vh,20px)}

  /* 対角線の トグル */
  .tgl{flex:0 0 auto; font-family:inherit; display:flex; align-items:center; gap:10px; width:100%;
    border:3px solid #d5ded6; background:#fff; border-radius:999px; padding:4px 8px; cursor:pointer;
    font-size:clamp(12px,2.6vh,17px); font-weight:800; color:#8d978f; -webkit-tap-highlight-color:transparent}
  .tgl.on{border-color:var(--green); color:var(--green-d)}
  .tgl .sw{flex:0 0 auto; width:48px; height:27px; border-radius:99px; background:#d7ded8;
    position:relative; transition:background .15s}
  .tgl.on .sw{background:var(--green)}
  .tgl .sw i{position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.32); transition:left .15s}
  .tgl.on .sw i{left:24px}

  .tchk{flex:0 0 auto; background:#fff; border:2px solid #dbe8db; border-radius:10px; padding:5px 10px}
  .tchk div{font-size:clamp(11px,2.4vh,16px); font-weight:700; color:#a3aea5; line-height:1.62}
  .tchk div.on{color:var(--green-d)}
  .tchk i{font-style:normal; font-weight:900; margin-right:6px; color:#ccd5cd}
  .tchk div.on i{color:var(--ok)}

  #hanaT{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(140px,38vw,215px);
    pointer-events:none; opacity:0; filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
  #hanaT.show{opacity:1; transition:opacity .15s}
  #hanaT.fade{opacity:0; transition:opacity .8s ease}
  #btnTGoal{border:none; background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-d)}
  #btnTGoal:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-d)}
  #btnTReset{border:3px solid var(--green); background:#fff; color:var(--green-d)}

  /* たてに ならぶ 画面（スマホなど） */
  @media (max-width:620px){
    .twrap{flex-direction:column; gap:5px}
    .tfig{flex:1 1 46%}
    .tside{flex:0 0 auto}
    .tname{font-size:clamp(16px,3.6vh,24px)}
    .tchk div{line-height:1.45}
  }
</style>
