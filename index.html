<script type="text/html" id="srcSagasu">
<!--
  平行・垂直な直線を さがす（小4 算数）学習アプリ ／ v1
  ------------------------------------------------------------------
  6本の直線に ㋐〜㋕ の しるしを つけ、「㋐に平行な直線は？」などを 出す。
  線を クリック → 正解は はなまる／まちがいは ✗（まちがいは 何回でも やりなおせる）。

  ■ 図の 作り（教科書の図と 同じ 組み立て）
    g1 … 水平な 2本（たがいに 平行）
    g2 … 垂直な 1本（g1 と 垂直）
    g3 … ななめの 2本（たがいに 平行。どれとも 垂直に ならない 角度に する）
    g4 … おとり 1本（どの 線とも 平行でも 垂直でも ない）
    ㋐〜㋕ は 毎回 ランダムに わりあてる。

  ■ 問題は「図から」作る（決め打ちしない）
    QS() が 実際の 角度を 見て、答えが 1つ以上 ある 問いだけを 出す。
    答えが 2つ ある とき（例：垂直な 1本 に 垂直な 線＝水平な 2本）は どちらでも 正解。
------------------------------------------------------------------
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>平行・垂直な直線をさがす</title>
<style>
  :root{ --green:#4a9e5c; --green-d:#3b824a; --green-l:#eaf5ea; --green-ll:#f4faf3;
    --paper:#ffffff; --line:#1f2430; --red:#e23c3c; --blue:#2f7dd1; --ink:#2b2b2b; --sub:#5b6b5e;
    --ask:#f0993a; --ok:#2f9e4a; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{height:100vh; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--green-ll); color:var(--ink); display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent}
  header{flex:0 0 auto; background:var(--green); color:#fff; padding:7px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  header h1{font-size:clamp(16px,4vw,23px); margin:0}
  .modes{display:flex; gap:8px; margin-left:auto}
  .mode-btn{border:3px solid #fff; background:rgba(255,255,255,.18); color:#fff; font-size:clamp(13px,3.4vw,17px); font-weight:800;
    padding:6px 14px; border-radius:999px; cursor:pointer; font-family:inherit}
  .mode-btn.active{background:#fff; color:var(--green-d)}
  .mode-btn.rnd{border-color:#d9a441; color:#8a5b00; background:#fff7e6}
  .mode-btn.rnd:hover{background:#ffefcc}
  main{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 10px}

  svg{width:100%; height:100%; touch-action:none}

  .hidden{opacity:0}

  /* 説明文が 1行→2行 に なると フッターが のびて 図が 縮む。つねに 2行ぶんの 高さを とる（他タブと 同じ） */

<header>

    <button class="mode-btn active" id="btnPerp">垂直</button>

    <button class="mode-btn" id="btnMix">まぜる</button>

<main>

    <svg id="board" viewBox="0 0 880 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="min" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8f0e8" stroke-width="1"/></pattern>
      </defs>

      <rect id="paper" fill="none" stroke="#c9d6c9" stroke-width="2.5" rx="6"/>

      <g id="labels"></g>    <!-- ㋐〜㋕ -->
      <g id="askRing"></g>   <!-- 「どの線について きかれて いるか」の しるし -->
      <g id="hits"></g>      <!-- クリックを うける ふとい 透明な 線 -->

    </svg>
  </div>
</main>

    <div class="steprow">
      <div class="stepno">?</div>

    </div>
    <div class="controls">
      <button class="act ghost" id="btnAgain">この もんだいを やりなおす</button>
      <button class="act warm" id="btnTeach">おしえて</button>
    </div>
  </div>
</footer>

<script>
const $=id=>document.getElementById(id);
const RAD=Math.PI/180, NS='http://www.w3.org/2000/svg';
const PAPER={x:78, y:74, w:724, h:400};        // 教科書の わく（この 中を 線が よこぎる）
const MARKS='アイウエオカ';                     // ★v49：まるは 自分で かくので、字は ただの アイウエオカ
                                                //        ㋐ を つかうと まるが 二じゅうに なる
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=d=>{ d%=180; return d<0? d+180 : d; };               // 直線の 向きは 180°で 一まわり
const dAng=(a,b)=>{ const d=Math.abs(norm(a)-norm(b)); return Math.min(d,180-d); };   // 2直線の なす角
const TOL=0.5;                                                   // 平行・垂直と みなす ずれ（度）

/* ============ 図を つくる ============
   g1：水平 2本 ／ g2：垂直 1本 ／ g3：ななめ 2本（平行）／ g4：おとり 1本
   ぐうぜん 平行・垂直に なって しまわない ように、角度は たがいに 12°以上 はなす。 */
let L=[];        // {ang, P:{x,y}, a:{x,y}, b:{x,y}, lab, end:{x,y}, out:{x,y}}
function makeFigure(){
  for(let guard=0; guard<200; guard++){
    const a3=pick([25,30,35,40,45,50,55,60,115,120,125,130,135,140,145,150,155]);
    // おとり：0°(g1)・90°(g2)・a3(g3)・a3+90 の どれからも 12°以上 はなれた 向き
    const cand=[];
    for(let a=5;a<180;a+=5){
      const bad=[0,90,a3,a3+90].some(x=>dAng(a,x)<12);
      if(!bad) cand.push(a);
    }
    if(!cand.length) continue;
    const a4=pick(cand);

    const P=PAPER, R=(t,u)=>({x:P.x+P.w*t, y:P.y+P.h*u});
    const lines=[
      {ang:0,  P:R(0.5, rnd(0.14,0.30))},   // g1
      {ang:0,  P:R(0.5, rnd(0.70,0.88))},   // g1
      {ang:90, P:R(rnd(0.38,0.62), 0.5)},   // g2
      {ang:a3, P:R(rnd(0.14,0.34), 0.5)},   // g3
      {ang:a3, P:R(rnd(0.66,0.88), 0.5)},   // g3
      {ang:a4, P:R(0.5, rnd(0.34,0.66))}    // g4
    ];
    for(const l of lines) if(!clipLine(l)) { lines.ok=false; break; }
    if(lines.ok===false) continue;

    // しるしが かさならない ように
    let ok=true;
    for(let i=0;i<6&&ok;i++) for(let j=i+1;j<6;j++)
      if(Math.hypot(lines[i].out.x-lines[j].out.x, lines[i].out.y-lines[j].out.y)<46){ ok=false; break; }
    if(!ok) continue;

    // ㋐〜㋕ を ランダムに わりあて
    const idx=[0,1,2,3,4,5]; for(let i=5;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    lines.forEach((l,i)=>l.lab=MARKS[idx[i]]);
    L=lines;
    return true;
  }
  return false;
}

/* 直線を わくで 切って、線の 両はしと しるしの 位置を 出す */
function clipLine(l){
  const u={x:Math.cos(l.ang*RAD), y:Math.sin(l.ang*RAD)}, P=PAPER;
  let t0=-1e9, t1=1e9;
  const slab=(p,d,lo,hi)=>{               // わくの たてよこ 2方向で はさむ
    if(Math.abs(d)<1e-9) return (p>=lo&&p<=hi);
    let a=(lo-p)/d, b=(hi-p)/d; if(a>b)[a,b]=[b,a];
    t0=Math.max(t0,a); t1=Math.min(t1,b); return true;
  };
  if(!slab(l.P.x,u.x,P.x,P.x+P.w)) return false;
  if(!slab(l.P.y,u.y,P.y,P.y+P.h)) return false;
  if(t1-t0<120) return false;             // わくの 中を じゅうぶん よこぎる こと
  const EXT=16;                            // わくから 少し はみ出させる（教科書の図と 同じ）
  l.a={x:l.P.x+u.x*(t0-EXT), y:l.P.y+u.y*(t0-EXT)};
  l.b={x:l.P.x+u.x*(t1+EXT), y:l.P.y+u.y*(t1+EXT)};
  /* しるしは「上の はし。水平なら 左の はし」に つける（教科書の図と 同じ ルール） */
  const A=l.a, B=l.b;
  l.end = (Math.abs(A.y-B.y)<4)? (A.x<B.x?A:B) : (A.y<B.y?A:B);
  const other = (l.end===A)? B : A;
  const d=Math.hypot(l.end.x-other.x, l.end.y-other.y);
  l.out={x:l.end.x+(l.end.x-other.x)/d*30, y:l.end.y+(l.end.y-other.y)/d*30};
  return true;
}

/* ============ 問題を つくる（図から 作る。決め打ちしない） ============ */
function QS(kind){
  const out=[];
  for(let i=0;i<L.length;i++){
    const par=[], per=[];
    for(let j=0;j<L.length;j++){ if(i===j) continue;
      const d=dAng(L[i].ang, L[j].ang);
      if(d<TOL) par.push(j); else if(Math.abs(d-90)<TOL) per.push(j);
    }
    if(par.length && kind!=='perp') out.push({i, rel:'para', ans:par});
    if(per.length && kind!=='para') out.push({i, rel:'perp', ans:per});
  }
  return out;
}

/* ============ 絵を かく ============ */
function el(p,tag,at){ const e=document.createElementNS(NS,tag); for(const k in at) e.setAttribute(k,at[k]); p.appendChild(e); return e; }
function draw(){
  const P=PAPER, pr=$('paper');
  pr.setAttribute('x',P.x); pr.setAttribute('y',P.y); pr.setAttribute('width',P.w); pr.setAttribute('height',P.h);
  $('lines').innerHTML=''; $('labels').innerHTML=''; $('hits').innerHTML=''; $('marks').innerHTML=''; $('askRing').innerHTML='';
  L.forEach((l,i)=>{
    l.el=el($('lines'),'line',{x1:l.a.x, y1:l.a.y, x2:l.b.x, y2:l.b.y, stroke:'var(--line)',
      'stroke-width':3.5, 'stroke-linecap':'round'});
    const g=el($('labels'),'g',{});
    l.ring=el(g,'circle',{cx:l.out.x, cy:l.out.y, r:16, fill:'#fff', stroke:'var(--line)', 'stroke-width':2.2});
    l.txt=el(g,'text',{x:l.out.x, y:l.out.y+7, 'text-anchor':'middle', 'font-size':20, 'font-weight':800,
      fill:'var(--line)'}); l.txt.textContent=l.lab;
    /* クリックは ふとい 透明な 線で うける（細い 線は 指では 押せない）。しるしも 押せる。 */
    const hit=el($('hits'),'g',{class:'hit'});
    el(hit,'line',{x1:l.a.x, y1:l.a.y, x2:l.b.x, y2:l.b.y, stroke:'transparent', 'stroke-width':26});
    el(hit,'circle',{cx:l.out.x, cy:l.out.y, r:19, fill:'transparent'});
    hit.addEventListener('click', ()=>choose(i));
  });
}

/* ★v50：はなまるは わたされた 画像を base64 で 埋めこみ（272×264／64色に して 52KB→11KB）。
   GitHub から 読んで いた のを やめた。ネットに つながらない 教室でも、リポジトリを 消しても 消えない。

  hanamaruDraw(g,cx,cy,R);
}
/* 代わりの はなまる：まるの まわりに 花びら。1本の 線で ぐるっと */
function hanamaruDraw(g,cx,cy,R){
  const n=9; let d='';
  for(let i=0;i<n;i++){
    const a0=i/n*2*Math.PI, a1=(i+1)/n*2*Math.PI, am=(a0+a1)/2;
    const p0={x:cx+R*Math.cos(a0), y:cy+R*Math.sin(a0)};
    const p1={x:cx+R*Math.cos(a1), y:cy+R*Math.sin(a1)};
    const c={x:cx+R*1.62*Math.cos(am), y:cy+R*1.62*Math.sin(am)};
    if(!i) d+=`M${p0.x.toFixed(1)} ${p0.y.toFixed(1)}`;
    d+=` Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
  }
  el(g,'path',{d:d+'Z', fill:'#fff', 'fill-opacity':.9, stroke:'var(--red)', 'stroke-width':6, 'stroke-linejoin':'round'});
  el(g,'circle',{cx, cy, r:R*0.62, fill:'none', stroke:'var(--red)', 'stroke-width':6});
}
function batsu(g,cx,cy,R){
  el(g,'circle',{cx, cy, r:R*1.25, fill:'#fff', 'fill-opacity':.85});
  const o={stroke:'var(--red)', 'stroke-width':7, 'stroke-linecap':'round'};
  el(g,'line',Object.assign({x1:cx-R, y1:cy-R, x2:cx+R, y2:cy+R},o));
  el(g,'line',Object.assign({x1:cx+R, y1:cy-R, x2:cx-R, y2:cy+R},o));
}

/* ============ すすめる ============ */
let kind='perp', q=null, pool=[], done=0, tries=0, locked=false;
let goTimer=null;                     /* ★v51：正解後に 次へ うつる タイマー */
function stopGo(){ if(goTimer){ clearTimeout(goTimer); goTimer=null; } }
const say=(t)=>{ $('stepText').innerHTML=t; };

function newFigure(){ makeFigure(); draw(); pool=[]; done=0; nextQ(); }
function nextQ(){
  stopGo();
  if(!pool.length){ pool=QS(kind); for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; } }
  q=pool.pop(); tries=0; locked=false;
  resetLook(); askQ();
}
function resetLook(){
  $('marks').innerHTML=''; $('askRing').innerHTML='';
  L.forEach(l=>{ l.el.setAttribute('stroke','var(--line)'); l.el.setAttribute('stroke-width',3.5);
    l.ring.setAttribute('stroke','var(--line)'); l.ring.setAttribute('stroke-width',2.2);
    l.txt.setAttribute('fill','var(--line)'); });
}
function askQ(){
  const l=L[q.i];
  l.el.setAttribute('stroke','var(--ask)'); l.el.setAttribute('stroke-width',6);
  l.ring.setAttribute('stroke','var(--ask)'); l.ring.setAttribute('stroke-width',3.5);
  l.txt.setAttribute('fill','var(--ask)');
  el($('askRing'),'circle',{cx:l.out.x, cy:l.out.y, r:23, fill:'none', stroke:'var(--ask)', 'stroke-width':2.5, 'stroke-dasharray':'5 4'});
  say(`${l.lab} に ${q.rel==='para'?'平行':'垂直'}な 直線は どれ？`);
  $('progress').textContent=`${q.rel==='para'?'平行':'垂直'}／${done}もん 正解`;
}
function choose(i){
  if(locked) return;
  if(i===q.i){ say(`それは ${L[i].lab} だよ。ほかの 直線を えらぼう。`); return; }
  const l=L[i], mid={x:(l.a.x+l.b.x)/2, y:(l.a.y+l.b.y)/2};
  if(q.ans.includes(i)){
    locked=true; done++;
    l.el.setAttribute('stroke','var(--ok)'); l.el.setAttribute('stroke-width',6);
    l.ring.setAttribute('stroke','var(--ok)'); l.ring.setAttribute('stroke-width',3.5);
    l.txt.setAttribute('fill','var(--ok)');
    $('marks').innerHTML=''; hanamaru($('marks'), mid.x, mid.y, 40);
    playOK();                          /* ★v51：はなまると いっしょに 正解の 音 */
    const more=q.ans.length>1? `（${q.ans.map(k=>L[k].lab).join('と')} の どちらでも 正解）` : '';
    say(`正解！ ${L[q.i].lab} と ${l.lab} は ${q.rel==='para'?'平行':'垂直'}。${more}`);
    $('progress').textContent=`${q.rel==='para'?'平行':'垂直'}／${done}もん 正解`;
    stopGo(); goTimer=setTimeout(()=>{ goTimer=null; nextQ(); }, 2000);   /* ★v51：2びょうで 次の もんだいへ */
  }else{
    tries++;
    $('marks').innerHTML=''; batsu($('marks'), mid.x, mid.y, 30);
    const d=dAng(L[q.i].ang, l.ang);
    say(tries>=3? `おしい！ ${L[q.i].lab} と ${l.lab} は ${d.toFixed(0)}度。「おしえて」を おしてみよう。`
                : 'ちがうよ。もう いちど さがそう。');
    setTimeout(()=>{ if(!locked) $('marks').innerHTML=''; }, 1100);
  }
}
function teach(){
  if(locked) return;
  const k=q.ans[0], l=L[k];
  l.el.setAttribute('stroke','var(--blue)'); l.el.setAttribute('stroke-width',6);
  l.ring.setAttribute('stroke','var(--blue)'); l.ring.setAttribute('stroke-width',3.5);
  l.txt.setAttribute('fill','var(--blue)');
  say(`${L[q.i].lab} に ${q.rel==='para'?'平行':'垂直'}なのは ${q.ans.map(j=>L[j].lab).join('と')} だよ。`);
}
function setKind(k){
  kind=k; pool=[];
  ['btnPara','btnPerp','btnMix'].forEach(id=>$(id).classList.remove('active'));
  $({para:'btnPara', perp:'btnPerp', mix:'btnMix'}[k]).classList.add('active');
  nextQ();
}
$('btnPara').onclick=()=>setKind('para');
$('btnPerp').onclick=()=>setKind('perp');
$('btnMix').onclick=()=>setKind('mix');
$('btnRnd').onclick=()=>newFigure();
$('btnAgain').onclick=()=>{ stopGo(); tries=0; locked=false; resetLook(); askQ(); };
$('btnTeach').onclick=()=>teach();
newFigure();
<\/script>

</script>
<script type="text/html" id="srcSui">
<!--

  ------------------------------------------------------------------

  ■v9の変更（追加4）
   ・手は向きによらず「画面の下から・指が上」で置く（右手＝右下／2まいをおさえる左手＝左下）。重なるときは右手が上。
  ■v9の変更（追加3）
   ・アが横・斜めのとき、上の三角じょうぎ（2まい目）を垂線の反対がわ（左）へ反転（縦のときは反転しない）。右手も反転側へ。
  ■v9の変更（追加2）
   ・説明文を「三角じょうぎを直線アに合わせて…」に統一（45°の長い辺…という言い方をやめた）。
   ・じぶんでやってみるの②を2動作に分割：まず直線アにのせる→アにそって点Aへスライド。
   ・手・えんぴつは向きが変わっても「下から・指が上」を保つ（sceneの回転を打ち消す）。
  ■v9の変更（追加）「🎲 むきをかえる」ボタン
   ・アを縦/横/ななめにランダムで変更（作図をsceneごと回転。三角じょうぎの向きも一緒に回る）。

  ■v9の変更（「じぶんでやってみる」を手順どおりの3フェーズに）

   ・左手は①の少し左に出しておく。①をアにのせても左手はそのまま残す。
   ・①がアにのると②が右下に出現。右手は最初から②の上に付く（下から出てくっつくのを廃止）。

  ■v8までの主な変更

   ・「線をひく」→ えんぴつを始点に置き0.5秒後に動かす

  ------------------------------------------------------------------
-->

<script>
const CONFIG = { LINE_X:290, A_X:530, A_Y:300, GUIDE_TOPY:150, SLIDER_STARTY:390, SLIDER_BELOW:4, SNAP_TOL:54, STEP_MS:1900 };
const LX=CONFIG.LINE_X, AX=CONFIG.A_X, AY=CONFIG.A_Y;
const SL_ALIGN = AY + CONFIG.SLIDER_BELOW; // （縦のときの基準）30°定規のよこの辺＝点Aの少し下
// 反転すると定規の本体が線の反対がわに来るので、辺（＝定規の位置）も線の反対がわへずらす
const slAlign = ()=> AY + CONFIG.SLIDER_BELOW * sliderFlip();
const MOVE_MS=1000, DRAW_DELAY=500, DRAW_MS=1200;

/* ★v43：手・えんぴつは base64 で ファイルに 埋めこみ（もとは GitHub から 読んでいた）。

function anchorImg(a,img,W,H){ if(a.anchor==='tip'){ img.setAttribute('x',a.ox||0); img.setAttribute('y',a.oy||0);} else { img.setAttribute('x',-W/2); img.setAttribute('y',-H/2);} }
function initAsset(a){
  const img=$(a.img),fb=$(a.fb); img.style.display='none'; fb.style.display='';
  const probe=new Image();
  probe.onload=()=>{ const W=a.width,H=W*(probe.naturalHeight/probe.naturalWidth||1);
    img.setAttribute('width',W); img.setAttribute('height',H); anchorImg(a,img,W,H);
    img.setAttribute('href',a.url); img.setAttributeNS('http://www.w3.org/1999/xlink','href',a.url);
    img.style.display=''; fb.style.display='none'; };
  probe.onerror=()=>{ img.style.display='none'; fb.style.display=''; };
  probe.src=a.url;
}
Object.values(ASSETS).forEach(initAsset);

/* ============================================================
   アの向き（ランダム）：作図はそのまま、sceneごと回転して見せる
   angle=0 が縦（もとの状態）。90=横、45/135/-45=ななめ。
   画面からはみ出さないよう縮小＋中央そろえ。文字は逆回転で立てる。
   ============================================================ */
const scene=$('scene');
const ORIENTS=[0, -90, -45];   // アの向き 3パターン：縦線 / 下の横線(Aは上) / 斜め線(画像どおり右下がり)
let sceneAngle=0;
const PIVOT={x:390,y:294};             // 作図のほぼ中心
const VBC={x:432,y:315};               // 作図エリアの中心
function fitScale(angle){
  const r=angle*Math.PI/180, c=Math.abs(Math.cos(r)), s=Math.abs(Math.sin(r));
  const W=500,H=532;                   // 作図のだいたいの大きさ
  const Wr=W*c+H*s, Hr=W*s+H*c;        // 回転後のはば・たかさ
  return Math.min(1, 0.95*644/Wr, 0.95*630/Hr);
}
function applyScene(angle){
  sceneAngle=angle;
  if(angle===0){ scene.removeAttribute('transform'); }
  else{
    const sc=fitScale(angle);
    scene.setAttribute('transform',
      `translate(${VBC.x-PIVOT.x} ${VBC.y-PIVOT.y}) rotate(${angle} ${PIVOT.x} ${PIVOT.y}) translate(${PIVOT.x} ${PIVOT.y}) scale(${sc.toFixed(4)}) translate(${-PIVOT.x} ${-PIVOT.y})`);
  }
  // ア・A は読めるように逆回転して立てる
  $('txtAr').setAttribute('transform',`rotate(${-angle} 290 50)`);
  $('txtPA').setAttribute('transform',`rotate(${-angle} 530 276)`);
}
function randomOrient(){
  const opts=ORIENTS.filter(a=>a!==sceneAngle);
  applyScene(opts[Math.floor(Math.random()*opts.length)]);
  // 向きがかわったら今のモードをやり直す
  if($('btnModeDemo').classList.contains('active')) resetDemo(); else setupPlay();
}

/* 手・えんぴつは向きが変わっても「下から・指が上」に見せる＝sceneの回転を打ち消す */
const HR=(rot=0)=>(rot||0)-sceneAngle;
const trH=(el,x,y,rot=0)=>tr(el,x,y,`rotate(${HR(rot)})`);

/* 上の三角じょうぎ（2まい目）：アが横・斜めのとき、垂線の反対がわ（左）へ反転 */
const sliderFlip=()=> sceneAngle!==0 ? -1 : 1;
const sliderExtra=()=> `scale(1 ${sliderFlip()})`;
/* 画面での「右にE・下にD」を canonical のずれに変換（手を向きによらず下から出すため） */
function screenOff(E,D){ const r=sceneAngle*Math.PI/180, c=Math.cos(r), s=Math.sin(r); return { dx:E*c+D*s, dy:-E*s+D*c }; }

/* 手のオフセット：縦のときは従来どおり、反転（横・斜め）のときは本体側に合わせる */
/* 向きごとの手の画面ずらし（E=画面右, D=画面下）。縦(0)は無し。 */
const HAND_NUDGE={ '-90':{guide:{E:-50,D:0}, slider:{E:50,D:0}},      // 横線：左手 左 / 右手 右
                   '-45':{guide:{E:30,D:-70}, slider:{E:40,D:0}} }; // 斜め：左手 右上 / 右手 右
const handGuideOff=()=>{ const b = sliderFlip()===1 ? {dx:-105,dy:195} : {dx:-130,dy:170};
  const n=HAND_NUDGE[String(sceneAngle)]; if(n){ const o=screenOff(n.guide.E,n.guide.D); return {dx:b.dx+o.dx, dy:b.dy+o.dy}; }
  return b; };   // 左手：1まい目（反転時は少し左下）
const handRPos=(sx,sy)=>{ const b = sliderFlip()===1 ? {x:sx+160,y:sy+100} : {x:sx+75,y:sy-74};
  const n=HAND_NUDGE[String(sceneAngle)]; if(n){ const o=screenOff(n.slider.E,n.slider.D); return {x:b.x+o.dx, y:b.y+o.dy}; }
  return b; };   // 右手：2まい目の本体
const HANDL_BOTH_V={x:235,y:410,rot:-30};   // 左手：2まいをおさえる（縦・反時計30°）
const HANDL_BOTH_F={E:-100,D:40,rot:-30};   // 左手：2まいをおさえる（反転・反時計30°／横などの既定）
const HANDL_BOTH_ORI={ '-45':{E:-100,D:-15,rot:-50} };   // 斜めだけ個別（さらに上・もう少し回転）
const handBothF=()=> HANDL_BOTH_ORI[String(sceneAngle)] || HANDL_BOTH_F;

function placeG(g, on, x, y, extra, animate){
  if(!on){ show(g,false); return; }
  const ex = extra||'';
  const wasHidden=g.classList.contains('hidden');
  const instant = !animate || wasHidden;
  if(instant){
    g.style.transition='none'; tr(g,x,y,ex); show(g,true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ g.style.transition=`transform ${MOVE_MS}ms ease`; }));
  }else{ g.style.transition=`transform ${MOVE_MS}ms ease`; tr(g,x,y,ex); }
}
function showBadge(on){ successBadge.classList.toggle('hidden',!on); successBadge.classList.toggle('show',on); }

/* えんぴつ＋線：始点に置いて DRAW_DELAY 後に動かし、線が追従して現れる */
function drawLineAnim(guardFn){
  gPencil.style.transition='none'; trH(gPencil,LX,AY); show(gPencil,true);
  drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',244);
  setTimeout(()=>{
    if(guardFn && !guardFn()) return;
    gPencil.style.transition=`transform ${DRAW_MS}ms ease`; trH(gPencil,AX,AY);
    drawnLine.style.transition=`stroke-dashoffset ${DRAW_MS}ms ease`; drawnLine.setAttribute('stroke-dashoffset',0);
    show(raMark,true);
  }, DRAW_DELAY);
}

/* ============================================================
   ステップ定義（1〜6）
   ============================================================ */
const S0=CONFIG.SLIDER_STARTY;
const STEPS=[
  { text:'三角じょうぎを直線アに合わせて、左手でおさえる。',
    guide:true, sliderY:null, handL:'guide', handR:false, pencil:false, mark:false, line:false },
  { text:'もう1まいの三角じょうぎを、右手で下から出す。',
    guide:true, sliderY:S0, handL:'guide', handR:true, pencil:false, mark:false, line:false },
  { text:'その三角じょうぎを、直線アにそって点Aまで動かす。（右手も一しょ）',
    guide:true, sliderY:'A', handL:'guide', handR:true, pencil:false, mark:false, line:false },
  { text:'点Aに来たら右手をどけ、左手で2まいをおさえる。',
    guide:true, sliderY:'A', handL:null, bothL:true, handR:false, pencil:false, mark:false, line:false },
  { text:'えんぴつで、直線アから点Aへ線をひく。',
    guide:true, sliderY:'A', handL:null, bothL:true, handR:false, pencil:true, mark:true, line:true },
  { text:'三角じょうぎと手をどけて…… 垂直な直線のできあがり！',
    guide:false, sliderY:null, handL:null, handR:false, pencil:false, mark:true, line:true },
];
const NSTEP=STEPS.length;

let currentStep=0;
function introState(){
  placeG(gGuide,false); placeG(gSlider,false); placeG(gHandL,false); placeG(gHandR,false); show(gPencil,false); show(raMark,false);
  drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',244); showBadge(false);
  $('stepNo').textContent='▶';
  $('stepText').innerHTML='はじめは 点Aとアの線だけ。「さいしょから」か「次へ ▶」でスタート。';
  $('progress').textContent=`0 / ${NSTEP}`;
  currentStep=0; updateNav();
}
function applyStep(n, animate=true){
  const s=STEPS[n-1];
  const sy = s.sliderY==='A' ? slAlign() : s.sliderY;   // 点Aの位置は反転に応じて決める
  placeG(gGuide, s.guide, GUIDE_POS.x, GUIDE_POS.y, '', animate);
  placeG(gSlider, sy!=null, LX, sy||0, sliderExtra(), animate);
  // 左手：1まい目をおさえる（'guide'）か、2まいをおさえる（bothL）
  if(s.bothL){
    if(sliderFlip()===1){ placeG(gHandL, true, HANDL_BOTH_V.x, HANDL_BOTH_V.y, `rotate(${HR(HANDL_BOTH_V.rot)})`, animate); }
    else { const hb=handBothF(); const o=screenOff(hb.E,hb.D); placeG(gHandL, true, LX+o.dx, slAlign()+o.dy, `rotate(${HR(hb.rot)})`, animate); }
  } else if(s.handL==='guide'){
    const g=handGuideOff(); placeG(gHandL, true, GUIDE_POS.x+g.dx, GUIDE_POS.y+g.dy, `rotate(${HR(30)})`, animate);
  } else { placeG(gHandL, false); }
  // 右手：2まい目の本体をおさえる
  const rp = handRPos(LX, sy||0);
  placeG(gHandR, !!s.handR, s.handR&&rp.x, s.handR&&rp.y, s.handR?`rotate(${HR(0)})`:'', animate);
  show(raMark, s.mark);

  if(s.pencil){
    if(n===5 && animate){ drawLineAnim(()=>currentStep===5); }
    else { show(gPencil,true); gPencil.style.transition='none'; trH(gPencil,AX,AY); drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',0); }
  }else{
    show(gPencil,false); drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset', s.line?0:244);
  }

  if(n===5){ successText.textContent='垂直な直線がひけたね！'; showBadge(true); }
  else if(n===6){ successText.textContent='できあがり！'; showBadge(true); }
  else showBadge(false);
  $('stepNo').textContent=n; $('stepText').innerHTML=s.text; $('progress').textContent=`${n} / ${NSTEP}`;
  currentStep=n; updateNav();
}

let playing=false, timer=null;
function goStep(n){ if(n<=0){ introState(); return; } applyStep(Math.min(n,NSTEP),true); }
function startAuto(){
  stopAuto(); applyStep(1,false); playing=true; $('btnPause').style.display='';
  const tick=()=>{ if(!playing) return; if(currentStep>=NSTEP){ stopAuto(); return; } goStep(currentStep+1); timer=setTimeout(tick,CONFIG.STEP_MS); };
  timer=setTimeout(tick,800);
}
function stopAuto(){ playing=false; clearTimeout(timer); $('btnPause').style.display='none'; }
function updateNav(){ $('btnPrev').disabled=currentStep<=0; $('btnNext').disabled=currentStep>=NSTEP; }
$('btnRestart').onclick=()=>startAuto();
$('btnPrev').onclick=()=>{ stopAuto(); goStep(currentStep-1); };
$('btnNext').onclick=()=>{ stopAuto(); goStep(currentStep+1); };
$('btnPause').onclick=()=>stopAuto();

function setMode(mode){
  const demo=mode==='demo';
  $('btnModeDemo').classList.toggle('active',demo); $('btnModePlay').classList.toggle('active',!demo);
  $('demoControls').style.display=demo?'flex':'none'; $('playControls').style.display=demo?'none':'flex';
  $('hintBox').classList.remove('show'); stopAuto();
  if(demo) resetDemo(); else setupPlay();
}
function resetDemo(){ gGuide.classList.remove('grab'); gSlider.classList.remove('grab'); introState(); }
$('btnModeDemo').onclick=()=>setMode('demo');
$('btnModePlay').onclick=()=>setMode('play');

/* ============================================================
   じぶんでやってみる  ※45°ドラッグ→左手、30°ドラッグ→右手
   ============================================================ */
let playState=null;
const GUIDE_START={x:210,y:150};      // ①1まい目 初期位置（アの左がわに出しておく）
const SLIDER_START={x:355,y:400};     // ②2まい目 初期位置（あとから右下に出す）
const SL_REST_OFF=110;                 // ②をまず直線アにのせる位置（点Aより下）
const slRest=()=>slAlign()+SL_REST_OFF;
/* 2まい目・手の配置 */
const placeSlider=(x,y)=>tr(gSlider, x, y, sliderExtra());
const placeHandR=(sx,sy)=>{ const p=handRPos(sx,sy); trH(gHandR, p.x, p.y, 0); };          // 右手：2まい目の本体
const placeHandGuide=(gx,gy)=>{ const g=handGuideOff(); trH(gHandL, gx+g.dx, gy+g.dy, 30); }; // 左手：1まい目（時計30°）
const placeHandBoth=()=>{                                                                   // 左手：2まいをおさえる
  if(sliderFlip()===1){ trH(gHandL, HANDL_BOTH_V.x, HANDL_BOTH_V.y, HANDL_BOTH_V.rot); }
  else { const hb=handBothF(); const o=screenOff(hb.E,hb.D); trH(gHandL, LX+o.dx, slAlign()+o.dy, hb.rot); }
};

function setupPlay(){
  showBadge(false);
  drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',244);
  show(raMark,false); show(gPencil,false);
  playState={ phase:1, guide:{x:GUIDE_START.x,y:GUIDE_START.y}, slider:{x:SLIDER_START.x,y:SLIDER_START.y},
              guideOk:false, sliderOnLine:false, sliderOk:false, drawn:false };
  // ①1まい目だけをアの左がわに表示（②2まい目はまだ出さない）
  gGuide.style.transition='none'; tr(gGuide, playState.guide.x, playState.guide.y); show(gGuide,true); gGuide.classList.add('grab');
  gSlider.style.transition='none'; show(gSlider,false); gSlider.classList.remove('grab');
  // 左手は1まい目の少し左に出しておく／右手は出さない
  gHandL.style.transition='none'; placeHandGuide(playState.guide.x, playState.guide.y); show(gHandL,true);
  show(gHandR,false);
  setPlayText();
  updatePlayHint(false); $('btnDraw').disabled=true;
}
function setPlayText(){
  if(!playState) return;
  const n=Math.min(playState.phase,3);
  $('stepNo').textContent = playState.drawn ? '✓' : n;
  $('progress').textContent = playState.drawn ? '' : n+' / 3';
  if(playState.drawn) return;
  const ph=playState.phase;
  if(ph===1) $('stepText').innerHTML='三角じょうぎを直線アに合わせて、左手でおさえよう。';
  else if(ph===2) $('stepText').innerHTML='もう1まいの三角じょうぎを、直線アに合わせよう。';
  else if(ph===3) $('stepText').innerHTML='三角じょうぎにそって、点Aまで すべらせよう。';
  else $('stepText').innerHTML='「線をひく」ボタンが おせるよ！';
}
function toSvgXY(evt){ const p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY; const q=p.matrixTransform(scene.getScreenCTM().inverse()); return {x:q.x,y:q.y}; }
let drag=null;
function startDrag(which,evt){
  if(!playState || playState.drawn) return;
  if(which==='guide'  && playState.phase!==1) return;              // ①はフェーズ1だけ
  if(which==='slider' && !(playState.phase===2||playState.phase===3)) return; // ②はフェーズ2・3だけ
  evt.preventDefault();
  const p=toSvgXY(evt), cur=playState[which];
  drag={which, dx:p.x-cur.x, dy:p.y-cur.y};
  if(which==='guide'){ gHandL.style.transition='none'; show(gHandL,true); }
  else { gHandR.style.transition='none'; show(gHandR,true); }      // 左手はそのまま残す
  gGuide.style.transition='none'; gSlider.style.transition='none';
  try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
}
function moveDrag(evt){
  if(!drag) return;
  const p=toSvgXY(evt), cur=playState[drag.which];
  cur.x=p.x-drag.dx; cur.y=p.y-drag.dy;
  if(drag.which==='guide'){
    tr(gGuide, cur.x, cur.y);
    placeHandGuide(cur.x, cur.y);   // 左手は1まい目と一体
  }else{
    if(playState.phase===3) cur.x=LX;                 // フェーズ3は直線アにそって（たてだけ）動く
    placeSlider(cur.x, cur.y);
    placeHandR(cur.x, cur.y);                          // 右手は2まい目と一体（反転側）
  }
}
function endDrag(){ if(!drag) return; const which=drag.which; drag=null; snapCheck(which); }
function snapCheck(which){
  const T=CONFIG.SNAP_TOL;
  if(which==='guide'){
    if(Math.abs(playState.guide.x-LX)<T*1.6){ playState.guide.x=LX; playState.guide.y=CONFIG.GUIDE_TOPY; playState.guideOk=true; } else playState.guideOk=false;
    gGuide.style.transition=`transform ${MOVE_MS}ms ease`; tr(gGuide, playState.guide.x, playState.guide.y);
    gHandL.style.transition=`transform ${MOVE_MS}ms ease`; placeHandGuide(playState.guide.x, playState.guide.y);
    if(playState.guideOk) enterPhase2();
  }
  else if(playState.phase===2){                       // ②をまず直線アにのせる
    if(Math.abs(playState.slider.x-LX)<T*1.6){ playState.slider.x=LX; playState.slider.y=slRest(); playState.sliderOnLine=true; }
    else playState.sliderOnLine=false;
    animSlider();
    if(playState.sliderOnLine) enterPhase3();
  }
  else{                                               // フェーズ3：アにそって点Aへスライド
    playState.slider.x=LX;
    if(Math.abs(playState.slider.y-slAlign())<T){ playState.slider.y=slAlign(); playState.sliderOk=true; }
    else playState.sliderOk=false;
    animSlider();
    if(playState.sliderOk) enterPhase4();
  }
  checkComplete(); updatePlayHint(false);
}
function animSlider(){
  gSlider.style.transition=`transform ${MOVE_MS}ms ease`; placeSlider(playState.slider.x, playState.slider.y);
  gHandR.style.transition=`transform ${MOVE_MS}ms ease`; placeHandR(playState.slider.x, playState.slider.y);
}
function enterPhase2(){
  playState.phase=2;
  gGuide.classList.remove('grab');                    // ①はもう動かさない
  // ②2まい目と右手を、最初から「②の上」に出す
  gSlider.style.transition='none'; placeSlider(playState.slider.x, playState.slider.y); show(gSlider,true); gSlider.classList.add('grab');
  gHandR.style.transition='none'; placeHandR(playState.slider.x, playState.slider.y); show(gHandR,true);
  setPlayText();
}
function enterPhase3(){ playState.phase=3; setPlayText(); }   // ②は直線アにのった。次はスライド
function enterPhase4(){
  playState.phase=4;
  gSlider.classList.remove('grab');                   // ②ももう動かさない
  show(gHandR,false);                                 // 右手を消す
  gHandL.style.transition=`transform ${MOVE_MS}ms ease`; // 左手を2まいをおさえる位置へ
  placeHandBoth(); show(gHandL,true);
  setPlayText();
}
function checkComplete(){
  const ok=playState.guideOk&&playState.sliderOk;
  $('btnDraw').disabled=!ok||playState.drawn;
  if(ok&&!playState.drawn){ successText.textContent='いい ちょうし！'; showBadge(true); setTimeout(()=>{ if(!playState.drawn) showBadge(false); },1400); }
}
function playHintMessage(){
  if(playState.drawn) return 'できたね！「はじめから」でもう一かいできるよ。';
  if(!playState.guideOk) return 'まず 三角じょうぎを、直線アに ぴったり合わせよう。';
  if(!playState.sliderOnLine) return 'もう1まいの三角じょうぎを、直線アに くっつけよう。';
  if(!playState.sliderOk) return '三角じょうぎにそって、点Aまで すべらせよう。';
  return '「線をひく」ボタンが おせるよ！';
}
function updatePlayHint(open){ const b=$('hintBox'); b.innerHTML=playHintMessage(); b.classList.toggle('show',open); }
$('btnHint').onclick=()=>{ const b=$('hintBox'); updatePlayHint(!b.classList.contains('show')); };
$('btnReset').onclick=()=>setupPlay();
$('btnDraw').onclick=()=>{
  if($('btnDraw').disabled) return;
  playState.drawn=true; $('btnDraw').disabled=true;
  show(gHandR,false); show(gHandL,true); gHandL.style.transition='none'; placeHandBoth();
  drawLineAnim(()=>playState&&playState.drawn);
  setTimeout(()=>{ show(gGuide,false); show(gSlider,false); show(gHandL,false); show(gPencil,false);
    successText.textContent='正解！できあがり！'; showBadge(true);
    $('stepText').innerHTML='三角じょうぎと手をどけて…… できあがり！'; }, DRAW_DELAY+DRAW_MS+400);
  updatePlayHint(false);
};

gGuide.addEventListener('pointerdown', e=>startDrag('guide',e));
gSlider.addEventListener('pointerdown', e=>startDrag('slider',e));
svg.addEventListener('pointermove', moveDrag);
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

$('btnRandomD').onclick=randomOrient;
$('btnRandomP').onclick=randomOrient;

applyScene(0);
setMode('demo');
<\/script>

</script>
<script type="text/html" id="srcHei">
<!--
  平行な直線のひき方（小4 算数）学習アプリ ／ v4
  ------------------------------------------------------------------
  ■v4：スクショの指摘を反映
   ・三角じょうぎ①(sankakujougi1)＝上下反転(fy:-1)して、横の辺を直線アに当てる。左の辺=レール。
   ・三角じょうぎ②(sankakujougi2)＝斜辺(赤の一番長い辺)がたてになるよう回転(rot:61)＋位置合わせ(tx,ty)＝①の青い辺(x=320)に面で当てる。本体は左。
     ※rot/tx/ty/size はスクショの赤い辺を実測して逆算した値。斜辺がまだ斜め→rot、位置ズレ→tx/ty、長さ→size で微調整。
   ・右手を下げ／②を押さえる左手をもっと左／2まいを押さえる左手をもっと左＆線にかからない位置。
  ■置き方は下の RULERS 定数で調整可：
   ・sizeBy 'h'=たて / 'w'=よこ / 'hyp'=斜辺 の長さ＝size（残りはPNGの比）
   ・ax,ay=合わせる角(0=左/上,1=右/下)  rot=回転  fx,fy=反転(-1)  ※合わせた角を中心に回転・反転
   ・②の斜辺の角度が合わない時は guide.rot を、大きさは size を変える。
  ------------------------------------------------------------------
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>平行な直線のひき方</title>
<style>
  :root{ --green:#4a9e5c; --green-d:#3b824a; --green-l:#eaf5ea; --green-ll:#f4faf3;
    --paper:#ffffff; --line:#1f2430; --red:#e23c3c; --tri:#cfe8f7; --tris:#14232e; --ink:#2b2b2b; --sub:#5b6b5e; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{height:100vh; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--green-ll); color:var(--ink); display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent}
  ruby rt{font-size:.55em; font-weight:600}
  header{flex:0 0 auto; background:var(--green); color:#fff; padding:7px 14px; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap}
  header h1{font-size:clamp(16px,4vw,23px); margin:0}
  .modes{display:flex; gap:8px; margin-left:auto}
  .mode-btn{border:3px solid #fff; background:rgba(255,255,255,.18); color:#fff; font-size:clamp(13px,3.4vw,17px); font-weight:700; padding:6px 13px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .mode-btn.active{background:#fff; color:var(--green-d)}
  main{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 10px}
  .stage{width:100%; max-width:800px; height:100%; background:var(--paper); border:3px solid var(--green); border-radius:14px; overflow:hidden; display:flex}
  svg{width:100%; height:100%; touch-action:none}
  .fade{transition:opacity .4s ease}
  .hidden{opacity:0; pointer-events:none}

function anchorImg(a,img,W,H){ if(a.anchor==='tip'){ img.setAttribute('x',a.ox||0); img.setAttribute('y',a.oy||0);} else { img.setAttribute('x',-W/2); img.setAttribute('y',-H/2);} }
function initAsset(a){
  const img=$(a.img),fb=$(a.fb); img.style.display='none'; fb.style.display='';
  const probe=new Image();
  probe.onload=()=>{ const W=a.width,H=W*(probe.naturalHeight/probe.naturalWidth||1);
    img.setAttribute('width',W); img.setAttribute('height',H); anchorImg(a,img,W,H);
    img.setAttribute('href',a.url); img.setAttributeNS('http://www.w3.org/1999/xlink','href',a.url);
    img.style.display=''; fb.style.display='none'; };
  probe.onerror=()=>{ img.style.display='none'; fb.style.display=''; };
  probe.src=a.url;
}
Object.values(ASSETS).forEach(initAsset);

/* 三角じょうぎPNGの読み込み（読めたら画像・ダメならSVGフォールバック） */
function initRuler(r){
  const img=$(r.img), fb=$(r.fb); img.style.display='none'; fb.style.display='';
  const probe=new Image();
  probe.onload=()=>{
    const nw=probe.naturalWidth||1, nh=probe.naturalHeight||1, ar=nw/nh;
    let W,H;
    if(r.sizeBy==='w'){ W=r.size; H=W/ar; }
    else if(r.sizeBy==='hyp'){ const L=Math.hypot(nw,nh); const sc=r.size/L; W=nw*sc; H=nh*sc; }
    else { H=r.size; W=H*ar; }
    img.setAttribute('width',W); img.setAttribute('height',H);
    img.setAttribute('x', -r.ax*W); img.setAttribute('y', -r.ay*H);
    let t=''; if(r.tx!==undefined||r.ty!==undefined) t+=`translate(${r.tx||0} ${r.ty||0}) `; if(r.rot) t+=`rotate(${r.rot}) `; if(r.fx!==1||r.fy!==1) t+=`scale(${r.fx} ${r.fy})`;
    if(t.trim()) img.setAttribute('transform',t.trim()); else img.removeAttribute('transform');
    img.setAttribute('href',r.url); img.setAttributeNS('http://www.w3.org/1999/xlink','href',r.url);
    img.style.display=''; fb.style.display='none';
  };
  probe.onerror=()=>{ img.style.display='none'; fb.style.display=''; };
  probe.src=r.url;
}
Object.values(RULERS).forEach(initRuler);

/* ============================================================
   アの向き（ランダム）：作図はそのまま、sceneごと回転して見せる
   0=もとの横のア（下）／90=縦のア。手・えんぴつ・文字は打ち消して読める向きに。
   ============================================================ */
const scene=$('scene');
const ORIENTS=[0, 90];                 // 0=横のア / 90=縦のア
let sceneAngle=0;
const PIVOT={x:400,y:390};             // 作図のほぼ中心
const VBC={x:432,y:315};               // 作図エリアの中心
function fitScale(angle){ const r=angle*Math.PI/180, c=Math.abs(Math.cos(r)), s=Math.abs(Math.sin(r));
  const W=580,H=560; const Wr=W*c+H*s, Hr=W*s+H*c; return Math.min(1, 0.95*644/Wr, 0.95*630/Hr); }
function applyScene(angle){
  sceneAngle=angle;
  if(angle===0){ scene.removeAttribute('transform'); }
  else{ const sc=fitScale(angle);
    scene.setAttribute('transform', `translate(${VBC.x-PIVOT.x} ${VBC.y-PIVOT.y}) rotate(${angle} ${PIVOT.x} ${PIVOT.y}) translate(${PIVOT.x} ${PIVOT.y}) scale(${sc.toFixed(4)}) translate(${-PIVOT.x} ${-PIVOT.y})`); }
  $('txtAr').setAttribute('transform',`rotate(${-angle} 180 400)`);   // ア は立てて読めるように
  $('txtPA').setAttribute('transform',`rotate(${-angle} 490 127)`);   // A も立てる
}
/* 手・えんぴつは向きが変わっても「指が上」に見せる＝sceneの回転を打ち消す */
const HR=(rot=0)=>(rot||0)-sceneAngle;
function randomOrient(){ const opts=ORIENTS.filter(a=>a!==sceneAngle); applyScene(opts[Math.floor(Math.random()*opts.length)]);
  if($('btnModeDemo').classList.contains('active')) resetDemo(); else setupPlay(); }

  drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',290);
  setTimeout(()=>{ if(guard && !guard()) return;
    gPencil.style.transition=`transform ${DRAW_MS}ms ease`; tr(gPencil,640,AY,`rotate(${HR(0)})`);
    drawnLine.style.transition=`stroke-dashoffset ${DRAW_MS}ms ease`; drawnLine.setAttribute('stroke-dashoffset',0);
  },DRAW_DELAY);
}

/* ============================================================
   お手本を見る（1〜5）
   ============================================================ */
const STEPS=[
 { text:'右手で 三角じょうぎ①を、直線アに合わせる。（アの下におく）',
   drawY:LY, guide:false, handL:null,   handR:true,  pencil:false, line:false },
 { text:'左手で 三角じょうぎ②の 長いほうの辺を、①に合わせる。',
   drawY:LY, guide:true,  handL:'guide',handR:true,  pencil:false, line:false },
 { text:'①を②にそって、点Aまで 上にあげる。（右手で）',
   drawY:AY, guide:true,  handL:'guide',handR:true,  pencil:false, line:false },
 { text:'手をどけて、えんぴつで 点Aを通る、アに平行な直線をひく。',
   drawY:AY, guide:true,  handL:'both', handR:false, pencil:true,  line:true },
 { text:'三角じょうぎと手をどけて…… アに平行な直線のできあがり！',
   drawY:null, guide:false, handL:null, handR:false, pencil:false, line:true },
];
const NSTEP=STEPS.length;

let currentStep=0;
function setHandL(kind,animate){
  if(kind==='guide'){ placeG(gHandL,true,HAND_GUIDE.x,HAND_GUIDE.y,`rotate(${HR(HAND_GUIDE.rot||0)})`,animate); }
  else if(kind==='both'){ placeG(gHandL,true,handBoth().x,handBoth().y,`rotate(${HR(handBoth().rot)})`,animate); }
  else placeG(gHandL,false);
}
function introState(){
  placeG(gDraw,false); show(gGuide,false); placeG(gHandL,false); placeG(gHandR,false); show(gPencil,false); show(raMark,false);
  drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',290); showBadge(false);
  $('stepNo').textContent='▶';
  $('stepText').innerHTML='はじめは 点Aとアの線だけ。「さいしょから」か「次へ ▶」でスタート。';
  $('progress').textContent=`0 / ${NSTEP}`;
  currentStep=0; updateNav();
}
function applyStep(n,animate=true){
  const s=STEPS[n-1], dy=s.drawY;
  placeG(gDraw, dy!=null, RX, dy||0, '', animate);
  show(gGuide, s.guide);
  setHandL(s.handL, animate);
  const rp=handRight(RX, dy||0);
  placeG(gHandR, s.handR, s.handR&&rp.x, s.handR&&rp.y, s.handR?`rotate(${HR(0)})`:'', animate);

  if(s.pencil){
    if(n===4 && animate){ setTimeout(()=>{ if(currentStep===4) drawLineAnim(()=>currentStep===4); }, MOVE_MS); }  // 手を動かしてから
    else { show(gPencil,true); gPencil.style.transition='none'; tr(gPencil,640,AY,`rotate(${HR(0)})`); drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',0); }
  }else{
    show(gPencil,false); drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset', s.line?0:290);
  }

  if(n===4){ successText.textContent='平行な直線がひけたね！'; }
  else if(n===5){ successText.textContent='できあがり！'; showBadge(true); }
  else showBadge(false);
  if(n===4) setTimeout(()=>{ if(currentStep===4) showBadge(true); }, MOVE_MS+DRAW_DELAY+DRAW_MS);
  $('stepNo').textContent=n; $('stepText').innerHTML=s.text; $('progress').textContent=`${n} / ${NSTEP}`;
  currentStep=n; updateNav();
}

let playing=false, timer=null;
function goStep(n){ if(n<=0){ introState(); return; } applyStep(Math.min(n,NSTEP),true); }
function startAuto(){
  stopAuto(); applyStep(1,false); playing=true; $('btnPause').style.display='';
  const tick=()=>{ if(!playing) return; if(currentStep>=NSTEP){ stopAuto(); return; }
    const wait = currentStep===3 ? CONFIG.STEP_MS + MOVE_MS + DRAW_DELAY + DRAW_MS : CONFIG.STEP_MS;  // 4→描画を待つ
    goStep(currentStep+1); timer=setTimeout(tick, wait); };
  timer=setTimeout(tick,800);
}
function stopAuto(){ playing=false; clearTimeout(timer); $('btnPause').style.display='none'; }
function updateNav(){ $('btnPrev').disabled=currentStep<=0; $('btnNext').disabled=currentStep>=NSTEP; }
$('btnRestart').onclick=()=>startAuto();
$('btnPrev').onclick=()=>{ stopAuto(); goStep(currentStep-1); };
$('btnNext').onclick=()=>{ stopAuto(); goStep(currentStep+1); };
$('btnPause').onclick=()=>stopAuto();

function setMode(mode){
  const demo=mode==='demo';
  $('btnModeDemo').classList.toggle('active',demo); $('btnModePlay').classList.toggle('active',!demo);
  $('demoControls').style.display=demo?'flex':'none'; $('playControls').style.display=demo?'none':'flex';
  $('hintBox').classList.remove('show'); stopAuto();
  if(demo) resetDemo(); else setupPlay();
}
function resetDemo(){ playState=null; gDraw.classList.remove('grab'); introState(); }
$('btnModeDemo').onclick=()=>setMode('demo');
$('btnModePlay').onclick=()=>setMode('play');

/* ============================================================
   じぶんでやってみる（3フェーズ）
   ============================================================ */
let playState=null;
const DRAW_START={x:RX+85,y:LY+35};
function setupPlay(){
  showBadge(false);
  drawnLine.style.transition='none'; drawnLine.setAttribute('stroke-dashoffset',290);
  show(raMark,false); show(gPencil,false);
  playState={ phase:1, draw:{x:DRAW_START.x,y:DRAW_START.y}, onLine:false, atA:false, drawn:false };
  gDraw.style.transition='none'; placeDraw(playState.draw.x,playState.draw.y); show(gDraw,true); gDraw.classList.add('grab');
  show(gGuide,false); show(gHandL,false);
  const r=handRight(playState.draw.x,playState.draw.y);
  gHandR.style.transition='none'; tr(gHandR,r.x,r.y,`rotate(${HR(0)})`); show(gHandR,true);
  setPlayText(); updatePlayHint(false); $('btnDraw').disabled=true;
}
function setPlayText(){
  if(!playState) return;
  const n=Math.min(playState.phase,3);
  $('stepNo').textContent=playState.drawn?'✓':n;
  $('progress').textContent=playState.drawn?'':`${n} / 3`;
  if(playState.drawn) return;
  const ph=playState.phase;
  if(ph===1) $('stepText').innerHTML='三角じょうぎ①を、直線アに合わせよう。（アの下）';
  else if(ph===2) $('stepText').innerHTML='①を 上にすべらせて、点Aに合わせよう。';
  else $('stepText').innerHTML='「線をひく」ボタンが おせるよ！';
}
function toSvgXY(evt){ const p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY; const q=p.matrixTransform(scene.getScreenCTM().inverse()); return {x:q.x,y:q.y}; }
let drag=null;
function startDrag(evt){
  if(!playState || playState.drawn) return;
  evt.preventDefault();
  const p=toSvgXY(evt), cur=playState.draw;
  drag={dx:p.x-cur.x, dy:p.y-cur.y};
  gDraw.style.transition='none'; gHandL.style.transition='none'; gHandR.style.transition='none';
  try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
}
function moveDrag(evt){
  if(!drag || !playState) return;
  const p=toSvgXY(evt), cur=playState.draw;
  let nx=p.x-drag.dx, ny=p.y-drag.dy;
  if(playState.phase===2){ nx=RX; if(ny>LY) ny=LY; if(ny<AY-40) ny=AY-40; }
  cur.x=nx; cur.y=ny; placeDraw(cur.x,cur.y);
  const r=handRight(cur.x,cur.y); tr(gHandR,r.x,r.y,`rotate(${HR(0)})`);
}
function endDrag(){ if(!drag) return; drag=null; snapCheck(); }
function snapCheck(){
  const d=playState.draw;
  if(playState.phase===1){
    if(Math.abs(d.x-RX)<CONFIG.SNAP2D && Math.abs(d.y-LY)<CONFIG.SNAP2D){ d.x=RX; d.y=LY; playState.onLine=true; }
    else playState.onLine=false;
    gDraw.style.transition=`transform ${MOVE_MS}ms ease`; placeDraw(d.x,d.y);
    const r=handRight(d.x,d.y); gHandR.style.transition=`transform ${MOVE_MS}ms ease`; tr(gHandR,r.x,r.y,`rotate(${HR(0)})`);
    if(playState.onLine) enterPhase2();
  }else{
    d.x=RX;
    if(Math.abs(d.y-AY)<CONFIG.SNAP_Y){ d.y=AY; playState.atA=true; } else playState.atA=false;
    gDraw.style.transition=`transform ${MOVE_MS}ms ease`; placeDraw(d.x,d.y);
    const r=handRight(d.x,d.y); gHandR.style.transition=`transform ${MOVE_MS}ms ease`; tr(gHandR,r.x,r.y,`rotate(${HR(0)})`);
    if(playState.atA) enterPhase3();
  }
  updatePlayHint(false);
}
function enterPhase2(){
  playState.phase=2;
  gDraw.classList.add('grab');
  show(gGuide,true);
  gHandL.style.transition='none'; tr(gHandL,HAND_GUIDE.x,HAND_GUIDE.y,`rotate(${HR(HAND_GUIDE.rot||0)})`); show(gHandL,true);
  setPlayText();
}
function enterPhase3(){
  playState.phase=3;
  show(gHandR,false);
  gHandL.style.transition=`transform ${MOVE_MS}ms ease`; tr(gHandL,handBoth().x,handBoth().y,`rotate(${HR(handBoth().rot)})`);  // 手を動かす（線にかからない位置へ）
  $('btnDraw').disabled=false;
  successText.textContent='いい ちょうし！'; showBadge(true); setTimeout(()=>{ if(!playState.drawn) showBadge(false); },1400);
  setPlayText();
}
function playHintMessage(){
  if(playState.drawn) return 'できたね！「はじめから」で もう一かい できるよ。';
  if(!playState.onLine) return 'まず 三角じょうぎ①を、直線アに ぴったり合わせよう。';
  if(!playState.atA) return '①を 上にすべらせて、点Aに 合わせよう。';
  return '「線をひく」ボタンを おそう。';
}
function updatePlayHint(open){ const b=$('hintBox'); b.innerHTML=playHintMessage(); b.classList.toggle('show',open); }
$('btnHint').onclick=()=>{ const b=$('hintBox'); updatePlayHint(!b.classList.contains('show')); };
$('btnReset').onclick=()=>setupPlay();
$('btnDraw').onclick=()=>{
  if($('btnDraw').disabled) return;
  playState.drawn=true; $('btnDraw').disabled=true;
  show(gHandR,false); gHandL.style.transition='none'; tr(gHandL,handBoth().x,handBoth().y,`rotate(${HR(handBoth().rot)})`); show(gHandL,true);
  drawLineAnim(()=>playState&&playState.drawn);
  setTimeout(()=>{ show(gDraw,false); show(gGuide,false); show(gHandL,false); show(gPencil,false);
    successText.textContent='正解！できあがり！'; showBadge(true);
    $('stepText').innerHTML='三角じょうぎと手をどけて…… できあがり！'; }, DRAW_DELAY+DRAW_MS+400);
  updatePlayHint(false);
};

gDraw.addEventListener('pointerdown', startDrag);
svg.addEventListener('pointermove', moveDrag);
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

document.querySelectorAll('.rnd').forEach(b=>b.onclick=randomOrient);
applyScene(0);
setMode('demo');
<\/script>

</script>
<script type="text/html" id="srcPg">
<!--
  平行四辺形のかき方（小4 算数）学習アプリ ／ v11
  ■v11の変更（三角じょうぎ 平行モード ほか）
   ・冒頭の説明文から「へんBCと70°のへんABはかいてあります。」を削除（図で分かるので）。コンパスも同様に統一。
   ・三角じょうぎ①②を、渡された画像 sankakujougi1.png / sankakujougi2.png に置き換え（平行タブと同じ画像・大きさ。読めなければSVGにフォールバック）。
     置き方は PGR 定数（sizeBy/size/ax/ay/rot/fx/fy/tx/ty）で調整可。初期値は平行タブの値。実機で向き・位置を見て要微調整。
   ・SVGフォールバックも大きさを他タブに合わせて拡大（②のスライダー 158×100→316×200）。
  ■v8の変更（コンパス）
   ・作図手順に合わせて動きを作り直し。中心ではからず、STAGE（赤枠のあたり）で定規をあてて長さをはかる →
     コンパスは開いたまま中心（A/C）へ移動 → そこで こ（弧）をかく、の3段。
     関数を drawArcWithMeasure から measureRadius / moveCompass / drawArcOpen（通しは measureMoveDraw）に分割。
     はかる場所と向きは STAGE / STAGE_DIR で調整可（実機を見て要微調整）。
  ■v3の変更（じゅんび）
   ・ツール（定規・分度器）を「パッ」ではなくフェードアウトで消すようにした（fadeHideヘルパーを追加。
     ステップ1のBC後の定規／ステップ2の分度器／ステップ3の3cmの定規に適用。render()の一括リセットは従来どおり即時）。
  辺BC・辺AB(70°)を前提に、頂点Dを「コンパス」または「三角じょうぎ(平行)」で見つける お手本アニメ。
  コンパスの画像(P)・エンジンは konpasu_en_app_v3 から移植。1ファイル完結。
  ■v2の変更（じゅんびステップ1）
   ・はじめは点Bだけ表示。定規をおいて4cmまで線をひき、定規をどけてから点Cと「4cm」を表示するようにした。
   （以前は点C・線・4cmが定規ではかる前から出ていた。render()に vtxOn('C') を追加し、goNextのn===1で線をひいた後に4cm・点Cを出す順に変更。）
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>平行四辺形のかき方</title>
<style>
  :root{ --green:#4a9e5c; --green-d:#3b824a; --green-l:#eaf5ea; --green-ll:#f4faf3;
    --paper:#ffffff; --line:#1f2430; --red:#e23c3c; --blue:#2f7dd1; --ink:#2b2b2b; --sub:#5b6b5e; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{height:100vh; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--green-ll); color:var(--ink); display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent}
  ruby rt{font-size:.55em; font-weight:600}
  header{flex:0 0 auto; background:var(--green); color:#fff; padding:7px 14px; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap}
  header h1{font-size:clamp(16px,4vw,23px); margin:0}
  .modes{display:flex; gap:8px; margin-left:auto}
  .mode-btn{border:3px solid #fff; background:rgba(255,255,255,.18); color:#fff; font-size:clamp(13px,3.4vw,17px); font-weight:700; padding:6px 13px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .mode-btn.active{background:#fff; color:var(--green-d)}
  main{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 10px}
  .stage{width:100%; max-width:900px; height:100%; background:var(--paper); border:3px solid var(--green); border-radius:14px; overflow:hidden; display:flex}
  svg{width:100%; height:100%; touch-action:none}
  .fade{transition:opacity .4s ease}
  .hidden{opacity:0}
  footer{flex:0 0 auto; background:var(--green-l); border-top:3px solid var(--green); padding:9px 14px 11px}
  .panel{max-width:900px; margin:0 auto}
  .steprow{display:flex; align-items:center; gap:11px}
  .stepno{flex:none; width:46px; height:46px; border-radius:50%; background:var(--green); color:#fff; font-size:22px; font-weight:800; display:flex; align-items:center; justify-content:center}
  /* ★v37：説明文が 1行→2行 に なると フッターが のびて、そのぶん 図が 小さくなる。
     つねに 2行ぶんの 高さを とって、フッターの 高さを 変えない。
     （説明文は 2行に おさまる 長さ＝全角29字いない に そろえてある） */
  .steptext{font-size:clamp(15px,3.7vw,20px); font-weight:700; line-height:1.35; min-height:2.7em; display:grid; align-content:center}
  .progress{margin-left:auto; font-size:14px; color:var(--sub); font-weight:700; white-space:nowrap}
  .controls{display:flex; gap:9px; margin-top:9px; flex-wrap:wrap}
  button.act{font-family:inherit; font-size:clamp(14px,3.6vw,18px); font-weight:800; padding:9px 15px; border-radius:12px; border:none; cursor:pointer; background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-d)}
  button.act:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-d)}
  button.act.ghost{background:#fff; color:var(--green-d); box-shadow:0 4px 0 #cfe3cf; border:2px solid var(--green)}
  button.act.warm{background:#f0993a; box-shadow:0 4px 0 #c9781f}
  /* ★v26 手動モード */
  button.act.hand{background:#7b5cd6; box-shadow:0 4px 0 #5c3fb0}
  button.act:disabled{opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #bbb}
  .hintbox{margin-top:9px; background:#fffbe8; border:2px dashed #e6c65a; border-radius:12px; padding:9px 13px; font-size:15px; font-weight:700; color:#7a5c00; display:none}
  .hintbox.show{display:block}
  .grab{cursor:grab}
  .grab:active{cursor:grabbing}
  /* ★v44：🎲だけ 色を 分ける（モード切替と まちがえないように） */
  .mode-btn.rnd{margin-left:14px; border-color:#d9a441; color:#8a5b00; background:#fff7e6}
  .mode-btn.rnd:hover{background:#ffefcc}
  /* 手動で つかむもの以外は 指が すり抜けるように */
  #vtx,#dims,#refFig,#measLbl,#angMark,#ray70,#sideBC,#sideAB,#sideAD,#sideCD,#parA,#parC,#arcA,#arcC,#okBadge,#handDot{pointer-events:none}
</style>

<style>
  /* 「作図」の 中の 小さいタブ（外側の 作図タブと そろえて 黄色） */
  header h1{font-size:clamp(14px,3.2vw,19px)}
  .subnav{display:flex; gap:6px; flex-wrap:wrap; margin-left:14px}
  .snb{font-family:inherit; border:3px solid #ffd54a; background:rgba(255,213,74,.20); color:#fff6d0;
    font-size:clamp(12px,3vw,15px); font-weight:800; padding:5px 12px; border-radius:999px; cursor:pointer; white-space:nowrap}
  .snb.on{background:#ffd54a; color:#5a4300}
</style>
<header>
  <h1>平行四辺形のかき方</h1>
  <div class="subnav">
    <button class="snb" onclick="parent.postMessage({type:'sub',id:'fSui'},'*')">垂直</button>
    <button class="snb" onclick="parent.postMessage({type:'sub',id:'fHei'},'*')">平行</button>
    <button class="snb on">平行四辺形</button>
    <button class="snb" onclick="parent.postMessage({type:'sub',id:'fHishi'},'*')">ひし形</button>
  </div>
  <div class="modes">
    <button class="mode-btn active" id="btnJunbi">じゅんび</button>
    <button class="mode-btn" id="btnCompass">コンパス</button>
    <button class="mode-btn" id="btnRuler">三角じょうぎ</button>
    <button class="mode-btn" id="btnHeikou">平行</button>

  </div>
</header>

<main>
  <div class="stage">
    <svg id="board" viewBox="0 0 880 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <pattern id="min" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e3efe3" stroke-width="1"/></pattern>
        <pattern id="maj" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="#cfe6cf" stroke-width="1.6"/></pattern>
      </defs>
      <rect width="880" height="600" fill="url(#min)"/>
      <rect width="880" height="600" fill="url(#maj)"/>

      <!-- 三角じょうぎ方式：平行線（点線ガイド） -->
      <!-- 三角じょうぎでひく平行線＝そのまま辺AD/辺CDになるので、辺と同じ黒・同じ太さ -->
      <line id="parA" class="fade hidden" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <line id="parC" class="fade hidden" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>

      <!-- コンパス方式：弧 -->
      <path id="arcA" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" d=""/>
      <path id="arcC" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" d=""/>

      <!-- 仕上げの辺（AD・CD） -->
      <line id="sideAD" class="fade hidden" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <line id="sideCD" class="fade hidden" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <!-- はじめからある辺（BC・AB） -->
      <line id="sideBC" class="fade" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <line id="sideAB" class="fade" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <!-- じゅんび用：分度器の70°線 -->
      <line id="ray70" class="fade hidden" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <path id="angMark" class="fade hidden" fill="none" stroke="var(--red)" stroke-width="2.5"/>
      <g id="dojo" style="visibility:hidden"></g>
      <text id="measLbl" style="opacity:0" font-size="24" font-weight="800" fill="#2b7dd1" text-anchor="middle"></text>
      <!-- 分度器 -->
      <image id="prot" style="visibility:hidden;opacity:0.82"/>
      <!-- 寸法：文字も位置も setShape/baseSetup が入れる（v44：図がランダムになったため） -->
      <g id="dims" font-weight="800" fill="#2b2b2b">

/* ============ コンパスエンジン（v3から移植） ============ */
const HALF=(P.hari.nat-P.enp.nat)/2, BDIR=P.B;
function dir(deg){return [Math.cos(deg*RAD), Math.sin(deg*RAD)];}
function geom(C,t,theta,scale){
  const s=t*HALF, na=BDIR+s+theta, pa=BDIR-s+theta;
  const Lh=P.hari.L*scale, Le=P.enp.L*scale;
  const dn=dir(na), dp=dir(pa);
  const Hx=C.x-Lh*dn[0], Hy=C.y-Lh*dn[1];
  const Px=Hx+Le*dp[0],   Py=Hy+Le*dp[1];
  return {Hx,Hy,Px,Py,naRot:na-P.hari.nat,paRot:pa-P.enp.nat,yoke:theta,scale};
}
function setPose(C,t,theta,scale){
  const g=geom(C,t,theta,scale);
  hariEl.setAttribute('transform',`translate(${g.Hx} ${g.Hy}) rotate(${g.naRot}) scale(${scale}) translate(${-P.hari.attach[0]} ${-P.hari.attach[1]})`);
  enpEl.setAttribute('transform', `translate(${g.Hx} ${g.Hy}) rotate(${g.paRot}) scale(${scale}) translate(${-P.enp.attach[0]} ${-P.enp.attach[1]})`);
  jikuEl.setAttribute('transform',`translate(${g.Hx} ${g.Hy}) rotate(${g.yoke}) scale(${scale}) translate(${-P.jiku.anchor[0]} ${-P.jiku.anchor[1]})`);
  compass.style.visibility='visible';
}
function polar(C,r,deg){const a=deg*RAD;return [C.x+r*Math.cos(a),C.y+r*Math.sin(a)];}
function arcPath(C,r,a0,a1){ const [x0,y0]=polar(C,r,a0),[x1,y1]=polar(C,r,a1);
  const diff=a1-a0, large=Math.abs(diff)>180?1:0, sweep=diff>0?1:0;
  return `M ${x0} ${y0} A ${r} ${r} 0 ${large} ${sweep} ${x1} ${y1}`; }

function angLabelAt(B, ang, fs, minR, m, clearR){
  const w=fs*1.75, h=fs*0.72;                       // 「70°」くらいの 文字の 大きさ
  const bis=-ang/2*RAD, uAB={x:Math.cos(-ang*RAD), y:Math.sin(-ang*RAD)};

    const P={x:B.x+r*Math.cos(bis), y:B.y+r*Math.sin(bis)};
    let ok=true;
    for(const dx of [-w/2, w/2]) for(const dy of [-h/2, h/2]){
      const Q={x:P.x+dx, y:P.y+dy};
      const dBC=B.y-Q.y;                                      // へんBCより 上＝正
      const dAB=uAB.x*(Q.y-B.y)-uAB.y*(Q.x-B.x);              // へんABより 内がわ＝正
      if(dBC<m || dAB<m){ ok=false; break; }
      if(clearR && Math.hypot(Q.x-B.x, Q.y-B.y)<clearR){ ok=false; break; }   // 弧の外へ
    }
    if(ok) return {x:P.x, y:P.y+h/2};                         // ベースラインへ 直す
  }

  [A,B,C,D].forEach(p=>add('circle',{cx:p.x, cy:p.y, r:4, fill:'var(--red)'}));
  const lbl=(p,t,dx,dy)=>add('text',{x:p.x+dx, y:p.y+dy, 'font-size':19, fill:'var(--red)',
    'text-anchor':'middle'}, t);
  lbl(A,'A',-2,-10); lbl(B,'B',-14,19); lbl(C,'C',14,19); lbl(D,'D',13,-10);
  const dim=(p,t,dx,dy,fs)=>add('text',{x:p.x+dx, y:p.y+dy, 'font-size':fs||15, fill:'#444',
    'text-anchor':'middle'}, t);
  const ab=awaySide(V.B,V.A);
  dim({x:(A.x+B.x)/2, y:(A.y+B.y)/2}, cmTxt(AB_CM), ab.pr.x*26-4, ab.pr.y*26+5);   // へんAB
  dim({x:(B.x+C.x)/2, y:(B.y+C.y)/2}, cmTxt(BC_CM), 0, 21);                        // へんBC
  /* ★v46：見本にも 角度の しるし（弧）を つける。本体と 同じ 見た目・同じ 向き。 */
  add('path',{d:arcPath(B, REF_MARK_R, 0, -ANG), fill:'none', stroke:'var(--red)', 'stroke-width':2});

     大きくすると よけい かぶるので、位置は 辺と 弧から はなれる ところを 計算で 出す。 */
  const q=angLabelAt(B, ANG, 15, REF_MARK_R+6, 6, REF_MARK_R+5);
  dim(q, degTxt(ANG), 0, 0, 15);                                                   // 角B
}

function render(n){   // アニメなしで状態nを表示
  step=n;
  const jun=(method==='junbi'), comp=(method==='compass'), rul=(method==='ruler'), par=(method==='heikou');
  // もとからある辺（じゅんびでは順番に、他はつねに表示）

  show(parC, rul && n>=2); if(rul&&n>=2){parC.style.strokeDasharray='';}
  showEl('dimAD', par && n>=2);   // 平行モードの「4cm」（へんAD）
  // 仕上げの辺（コンパスだけ。三角じょうぎは 平行線 parA/parC が そのまま 辺AD/辺CD）
  show(sideAD, comp && n>=3); show(sideCD, (comp && n>=4) || (par && n>=3));
  compass.style.visibility='hidden'; rulerFrame.style.visibility='hidden'; prot.style.visibility='hidden'; dojo.style.visibility='hidden'; $('measLbl').style.opacity=0;

  $('stepText').innerHTML=TXT[method][n];
  $('progress').textContent=`${n} / ${nstep()}`;

}

/* ===== 三角じょうぎ2枚で「平行線」をひく（参照辺の向きに合わせてフレーム配置） ===== */
const rulerFrame=$('rulerFrame'), pgGuide=$('pgGuide'), pgDraw=$('pgDraw');
/* ★v18：三角じょうぎの大きさ。①と②は別々に調整する（v17は連動していた）。
   ①＝PG_SC   ：平行タブの①は 450×300。1.0＝平行タブと同じ大きさ。大きく→数値を上げる。
   ②＝PG_GD_BOT：②のレールが基準辺より「下」へどこまで伸びるか。上へは点の位置まで自動でのびる。
                 ②を長く（＝太く）したい→数値を上げる。※210は平行タブと同じ見え方。 */
const PG_SC=1.0;
const PG_GD_BOT=210;
const ROFF=58;
function frameMatrix(refP1,refP2,T,offset){
  const dx=refP2.x-refP1.x, dy=refP2.y-refP1.y, L=Math.hypot(dx,dy);
  const ux=dx/L, uy=dy/L;                                  // 参照辺の向き＝ローカルx
  const tp=(T.x-refP1.x)*ux+(T.y-refP1.y)*uy;
  const F={x:refP1.x+tp*ux, y:refP1.y+tp*uy};              // 点Tを参照辺へ下ろした足
  let nx=T.x-F.x, ny=T.y-F.y; const dist=Math.hypot(nx,ny); nx/=dist; ny/=dist;
  const mx=-nx, my=-ny;                                    // ローカル+y＝点と反対がわ（①の本体側）
  const R0={x:F.x-offset*ux, y:F.y-offset*uy};             // レールの足（少し左へ）
  /* ★メモ：ローカルxを「基準辺の向き」、+yを「点と反対がわ」と決めているので、
     点が辺のどちら側にあるかで行列式の符号が変わる（手順①=+1／手順②=-1）。
     手順②では座標系が鏡になる＝三角じょうぎが「裏返し」で表示される。
     作図の向き（辺の伸びる先＝D側）は正しいので、そのままにしてある。
     裏返しが気になる場合は、ここで det<0 のとき ux,uy を反転すれば鏡は消えるが、
     そのかわり①の作図辺がD側と逆（B側）を向いてしまうので注意。 */
  return {ux,uy,mx,my,R0,dist};
}
function applyFrame(fm){ rulerFrame.setAttribute('transform',`matrix(${fm.ux} ${fm.uy} ${fm.mx} ${fm.my} ${fm.R0.x} ${fm.R0.y})`); }
/* ②：平行タブの座標（斜辺＝たて x=320／y=140→600／本体は左）を、
   このタブのローカル座標（レール＝x=0／y=yt→yb／本体は左）へそのまま写す。
   基準辺と点のへだたり dist に合わせて、レールの長さがちょうど足りるように拡大縮小する。 */
function buildGuide(dist,gx,gy){
  const yt=-dist-16, yb=PG_GD_BOT;       // レールの上はし・下はし（ローカル）
  const s=(yb-yt)/460;                   // 平行タブの斜辺の長さ460 → 必要な長さへ
  /* ★v40：gx,gy＝手動で ②を 運ぶ ときの ずれ。0,0 が 正しい 位置（＝①の 辺に あたる）。 */
  pgGuide.setAttribute('transform',`translate(${gx||0} ${gy||0}) translate(0 ${yt}) scale(${s.toFixed(4)}) translate(-320 -140)`);
}
/* ①：平行タブの座標（原点＝直角／上の辺＝作図辺／左の辺＝レール／本体は右下）をそのまま縮小して置く
   edge_lx＝作図辺にそった位置（線をつぎ足すときの平行移動）／edge_ly＝レールにそった位置 */
function setPgDraw(edge_lx,edge_ly){ pgDraw.setAttribute('transform',`translate(${edge_lx} ${edge_ly}) scale(${PG_SC})`); }
/* ①の作図辺が どこまで届くか（ローカル）。
   ★v20：450 は「読めなかったときのSVG」の幅であって、PNGの幅ではなかった。
   PNGが読めていれば その実寸(PGR.draw.W)を使う。読めなければ SVG の 450。 */
const PG_EDGE_FB=450;
function pgEdgeLen(){ return (PGR.draw.W||PG_EDGE_FB)*PG_SC; }
/* 線を「はじめから t1 の割合まで」あらわす（t0＝すでにひけている割合） */
async function drawLinePart(el,pts,t0,t1,dur){
  const len=Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
  setLine(el,pts[0],pts[1]);
  el.style.strokeDasharray=len+' '+len;
  el.style.strokeDashoffset=len*(1-t0);
  show(el,true);
  await animate(len*(1-t0), len*(1-t1), dur||650, v=>{ el.style.strokeDashoffset=v; }, ease);
  if(t1>=1) el.style.strokeDasharray='';
}
/* ★v38：手動モードと 中身を 分けあうため、2つに 割った。
   setupParallel＝②を 基準辺に あてて ①を 足もとに 置く（ここまでは 同じ）
   drawAlongRuler＝①が 点に ついた ところから 線を ひく（お手本も 手動も ここは 同じ） */
function setupParallel(refP1,refP2,T){
  const fm=frameMatrix(refP1,refP2,T,ROFF);
  applyFrame(fm); buildGuide(fm.dist); setPgDraw(0,0);
  show(pgGuide,true);      // ★v39：place で 隠した ままに ならないよう、ここで もどす
  rulerFrame.style.opacity=1; rulerFrame.style.visibility='visible';
  return fm;
}
async function drawParallelRuler(refP1,refP2,T,lineEl,linePts){
  const fm=setupParallel(refP1,refP2,T);
  await animate(0,1,320,()=>{},easeOut);                  // 辺に合わせて一呼吸
  await animate(0,fm.dist,1200, d=>{ setPgDraw(0,-d); }, ease);   // ②に沿って点までスライド
  await drawAlongRuler(fm,lineEl,linePts);
}
async function drawAlongRuler(fm,lineEl,linePts){
  /* 線の両はしを、作図辺にそった位置（ローカルx）に直す。
     定規の作図辺は ローカルx=shift から shift+reach まで。そこから先には線をひけない。
     ★v20：「定規のはしまで ひく → 定規を 線にそって 平行移動 → また はしまで ひく」をくり返す。 */
  const lxOf=p=>(p.x-fm.R0.x)*fm.ux+(p.y-fm.R0.y)*fm.uy;
  const lx0=lxOf(linePts[0]), lx1=lxOf(linePts[1]);
  const tOf=v=>(v-lx0)/(lx1-lx0);
  const reach=pgEdgeLen();
  let shift=0, cur=lx0;
  for(let guard=0; guard<8; guard++){
    const to=Math.min(lx1, shift+reach);          // 定規のはし（線の先をこえない）
    if(to>cur+0.5) await drawLinePart(lineEl,linePts,tOf(cur),tOf(to), guard===0?560:480);
    cur=to;
    if(cur>=lx1-0.5) break;                       // ひきおわり
    const next=Math.min(lx1-reach, cur);          // 次は 定規の左はしを いまの線の先へ
    await animate(0,1,300,()=>{},ease);
    await animate(shift,next,850, d=>{ setPgDraw(d,-fm.dist); }, ease);   // 線にそって 平行移動
    await animate(0,1,240,()=>{},ease);
    shift=next;
  }

  await animate(0,1,260,()=>{},ease);
  rulerFrame.style.opacity=0; await animate(0,1,300,()=>{},ease);
  rulerFrame.style.visibility='hidden'; rulerFrame.style.opacity=1;
}

/* 平行線を1本、のばして描くアニメ（旧・未使用） */
async function drawParallel(el,p1,p2){
  el.style.strokeDasharray=''; show(el,true);
  const len=Math.hypot(p2.x-p1.x,p2.y-p1.y);
  el.style.strokeDasharray=len+' '+len; el.style.strokeDashoffset=len;
  await animate(len,0,1100, v=>{ el.style.strokeDashoffset=v; }, ease);
  el.style.strokeDasharray='';
}

let playing=false, animating=false;
async function goNext(auto){
  if(animating || step>=nstep()) return;
  animating=true; $('btnNext').disabled=true; $('btnPrev').disabled=true;
  const n=step+1;
  $('stepNo').textContent=n; $('stepText').innerHTML=TXT[method][n]; $('progress').textContent=`${n} / ${nstep()}`;
  if(method==='junbi'){
    if(n===1){ await drawSideWithRuler(sideBC,V.B,V.C,1000); showEl('dim4',true); vtxOn('C',true); }
    else if(n===2){ await drawProtRay(); }   // ★v46：dim70 は drawProtRay の 中で 出す
    else if(n===3){ const {u,pr}=awaySide(V.B,V.A); placeRuler(V.B,u,pr);
        await animate(0,1,750,()=>{},easeOut); showEl('dim3',true); vtxOn('A',true);
        await animate(0,1,400,()=>{},ease); await fadeHide(dojo,300); }   // 線は切らず、3cmに点Aをつけるだけ
  } else if(method==='compass'){
    if(n===1) await measureMoveDraw(V.A,BCL,angAD,arcA,'4cm');
    else if(n===2) await measureMoveDraw(V.C,ABL,angCD,arcC,'3cm');
    else if(n===3){ revealD(); await drawSideWithRuler(sideAD,V.A,V.D,950); }
    else if(n===4){ await drawSideWithRuler(sideCD,V.C,V.D,950); }
  } else if(method==='ruler'){
    if(n===1){ const p=parLine_A(); await drawParallelRuler(V.B,V.C,V.A,parA,p); }
    else if(n===2){ const p=parLine_C(); await drawParallelRuler(V.B,V.A,V.C,parC,p); revealD(); }   // ★v22：辺CDをひいたら点Dをつけて完成
  } else {
    /* ★v23「平行」：三角じょうぎで平行線 → 点Aから4cmはかって点D → 点CとDを定規でむすぶ */
    if(n===1){ const p=parLine_A(); await drawParallelRuler(V.B,V.C,V.A,parA,p); }
    else if(n===2){ const dx=V.D.x-V.A.x, dy=V.D.y-V.A.y, L=Math.hypot(dx,dy), u={x:dx/L,y:dy/L};
        placeRuler(V.A,u,belowPerp(u));                       // 定規は へんADの下＝数字が上向き
        await animate(0,1,750,()=>{},easeOut); showEl('dimAD',true); revealD();
        await animate(0,1,400,()=>{},ease); await fadeHide(dojo,300); }
    else if(n===3){ await drawSideWithRuler(sideCD,V.C,V.D,950); }
  }
  render(n);
  animating=false;
  if(auto && playing && step<nstep()){ setTimeout(()=>goNext(true), 900); }
  else { playing=false; $('btnPause').style.display='none'; }
}
function revealD(){ const dotD=$('dotD'), lblD=$('lblD'); if(dotD)dotD.style.opacity=1; if(lblD)lblD.style.opacity=1; }
/* 2辺を同時にひく（旧・未使用：v21から 定規で1辺ずつ ひくようにしたため） */
async function drawFinish(){
  show(sideAD,true); show(sideCD,true);
  for(const el of [sideAD,sideCD]){
    const x1=+el.getAttribute('x1'),y1=+el.getAttribute('y1'),x2=+el.getAttribute('x2'),y2=+el.getAttribute('y2');
    const len=Math.hypot(x2-x1,y2-y1); el.style.strokeDasharray=len+' '+len; el.style.strokeDashoffset=len;
  }

  sideAD.style.strokeDasharray=''; sideCD.style.strokeDasharray='';
}

/* ★v44：見本の平行四辺形を ランダムに 作りなおす。

/* ============================================================
   ★v31 手動モード（じゅんび／コンパス）
   フェーズ＝「やること(acts)の ならび」＋「さいごに おすボタン」。
     acts の 中身（1つずつ 順に こなす）
       {kind:'prot'} 分度器を ドラッグして 点Bへ
       {kind:'open'} コンパスを STAGEで ひらく（えんぴつを 右へ）
       {kind:'move'} ひらいたまま コンパスを 中心へ ドラッグ
       {kind:'dot'}  道具の 外を クリックして 点をつける
     ruler:… は「はじめから 当ててある 定規」（子どもは 動かさない）
     label が 空 なら ボタンは 出さず、さいごの act が すんだ 時点で act() が 走る
   ふやすときは P_junbi / P_compass に フェーズを 足すだけ。
   ============================================================ */
let uiMode='demo';
let hand=null;
const HAND_SNAP=60;      // 道具の 位置合わせ（px）
const HAND_DOT=52;       // 点をつける クリック（px）
const HAND_OPEN=26;      // コンパスの ひらき具合（px）＝ やく0.3cm
const handDot=$('handDot');
/* 分度器の 70°の 点：PROT_RIM_K＝半円の ふちの 半径÷画像の幅（実測）／R70_OUT＝ふちから 何px 外か */
const PROT_RIM_K=0.481, R70_OUT=10;
const r70=()=>PROT.size*PROT_RIM_K+R70_OUT;
const val=v=>(typeof v==='function'? v() : v);
const onTool=e=>(dojo.contains(e.target) || prot===e.target);
/* ★v39：三角じょうぎの 手動は「平行タブ」と おなじ 手つき にする。
     ①を 基準の 辺に 合わせる（②は まだ 出さない）→ ②が 出る → ①を すべらせる → 線をひく
   スナップ値も 平行タブの CONFIG から そのまま（座標の 大きさが ほぼ 1:1 のため）。 */
/* ★v41：吸着の 考えかたを ①②で そろえた。
     PG_SNAP_FIT  … 辺と 直角の 向き ＝「接したか」。ここだけ きびしく 見る
     PG_SNAP_ALONG… 辺に そった 向き。接した まま ずれても 接触は 保たれるので 大きく ゆるす
                    （合ったら 正しい 位置へ すべりこむ） */
const PG_SNAP_FIT=64;
const PG_SNAP_ALONG=200;
const PG_TOUCH=60;       // ②の レールが ①の 辺と 何px 重なれば「接した」と みなすか
const PG_SNAP_Y=46;      // ①を 点まで すべらせる（平行タブ CONFIG.SNAP_Y）
/* ★v41：②の レール（ローカル y＝gy+yt 〜 gy+yb）と ①の 辺（ローカル y＝0〜①の高さ）の
   重なりの 長さ。これが PG_TOUCH 以上 あれば「①に 接している」＝どこで 接しても 吸着する。 */
function touchLen(){
  const yt=-hand.fm.dist-16, yb=PG_GD_BOT, g=hand.gpos.gy, h=(PGR.draw.H||300)*PG_SC;
  return Math.min(g+yb, h) - Math.max(g+yt, 0);
}
const PG_START={lx:85, ly:35};      // ①の はじめの 位置（平行タブ DRAW_START と おなじ ずれ）

/* ---------------- 三角じょうぎ（平行） ---------------- */
/* ★v40：本ものと おなじ 手つき。
   ①を 基準の 辺に あてる → ②を ①に あてる → ①を ②に そって すべらせる → 線をひく */
const P_ruler=[null,
  { acts:[{kind:'place', ref1:V.B, ref2:V.C, T:V.A,

    label:'✏️ 線をひく',
    act:async()=>{ await drawAlongRuler(hand.fm, parA, parLine_A()); } },
  { acts:[{kind:'place', ref1:V.B, ref2:V.A, T:V.C,
      say:'こんどは ①を、へんAB に あてよう。',
      hint:'次は へんAB に 平行な 線。①を へんAB に あてよう。'},
     {kind:'place2',
      say:'②を、①に あてよう。',
      hint:'さっきと おなじ。②を うごかして、①の 辺に あてよう。'},
     {kind:'slide',
      say:'①を すべらせて、点C に 合わせよう。',
      hint:'②を おさえて、①を 点C まで すべらせよう。'}],
    label:'✏️ 線をひく',
    act:async()=>{ await drawAlongRuler(hand.fm, parC, parLine_C());
                   await animate(0,1,400,()=>{},ease); revealD();
                   await animate(0,1,400,()=>{},ease); } }];

/* ---------------- 平行（平行線＋長さ） ---------------- */
const P_heikou=(function(){
  const uAD={x:(V.D.x-V.A.x)/BCL, y:(V.D.y-V.A.y)/BCL}, pAD=belowPerp(uAD);
  const LCD=Math.hypot(V.D.x-V.C.x, V.D.y-V.C.y);

      hint:'②は へんBC に あててあるよ。①の 上の 辺が 点A に つくまで すべらせよう。'}],
    label:'✏️ 線をひく',
    act:async()=>{ await drawAlongRuler(hand.fm, parA, parLine_A()); } },
  { ruler:{u:uAD, away:pAD, at:{x:V.A.x+pAD.x*RULER_GAP, y:V.A.y+pAD.y*RULER_GAP}},

    act:async()=>{ await animate(0,1,450,()=>{},ease); showEl('dimAD',true); vtxOn('D',true);

  { ruler:{u:uCD, away:pCD, at:{x:V.C.x+pCD.x*RULER_GAP, y:V.C.y+pCD.y*RULER_GAP}}, acts:[],

    label:'',
    act:async()=>{ await animate(0,1,550,()=>{},easeOut); await drawSideAnim(sideCD,V.C,V.D,900);
